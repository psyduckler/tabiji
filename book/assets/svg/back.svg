  <rect x="0" y="796" width="500" height="4" fill="#8B3A2E"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#8B3A2E">TABIJI.AI</text>
  <text x="460" y="42" font-family="Georgia, serif" font-size="9" letter-spacing="3" fill="#8B3A2E" text-anchor="end" opacity="0.8">TRAVEL SAFETY SERIES</text>
  <line x1="40" y1="58" x2="460" y2="58" stroke="#8B3A2E" stroke-width="0.5" opacity="0.5"/>
  <g>
    <ellipse cx="420" cy="100" rx="5" ry="4" fill="#F5A2B3" opacity="0.8" transform="rotate(25 420 100)"/>
    <ellipse cx="445" cy="118" rx="4" ry="3" fill="#F5A2B3" opacity="0.7" transform="rotate(-15 445 118)"/>
    <ellipse cx="408" cy="128" rx="5" ry="4" fill="#F5A2B3" opacity="0.75" transform="rotate(40 408 128)"/>
    <ellipse cx="438" cy="145" rx="4" ry="3" fill="#F5A2B3" opacity="0.65" transform="rotate(10 438 145)"/>
    <ellipse cx="425" cy="90" rx="3" ry="2" fill="#F9C8D2" opacity="0.85" transform="rotate(50 425 90)"/>
  </g>
  <text x="40" y="138" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#2A2420" letter-spacing="-0.5">What the guidebooks</text>
  <text x="40" y="176" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#2A2420" letter-spacing="-0.5">won&#8217;t tell you.</text>
  <rect x="40" y="196" width="60" height="2" fill="#8B3A2E"/>
  <text x="40" y="237" font-family="Georgia, serif" font-size="13" fill="#3A2A28">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="40" y="257" font-family="Georgia, serif" font-size="13" fill="#3A2A28">lifetime. Don&#8217;t lose a yen of it to a rigged meter, a</text>
  <text x="40" y="277" font-family="Georgia, serif" font-size="13" fill="#3A2A28">fake tea ceremony, or a bar tab you never agreed to.</text>
  <text x="40" y="318" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">This book documents 60 tourist scams across 9</text>
  <text x="40" y="336" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Japanese cities &#8212; drawn from traveler reports,</text>
  <text x="40" y="354" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">embassy advisories, and local police warnings. You&#8217;ll</text>
  <text x="40" y="372" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">learn the exact scripts scammers use, the red flags</text>
  <text x="40" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">that give them away, and the moves that shut them down.</text>
  <text x="40" y="432" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#8B3A2E" font-weight="700">Inside:</text>
  <circle cx="48" cy="463" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="467" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">The &#165;130,000 Tokyo bar trap &#8212; and the words that stop it</text>
  <circle cx="48" cy="488" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="492" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">How a &#8216;let&#8217;s practice English&#8217; chat ends at a &#165;15,000 bill</text>
  <circle cx="48" cy="513" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="517" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">The fake-monk donation at every temple (&#165;3,000&#8211;10,000)</text>
  <circle cx="48" cy="538" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="542" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Why airport taxi hustlers quote &#165;8,000 and charge &#165;32,000</text>
  <circle cx="48" cy="563" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="567" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">The Nara deer problem (159 tourist injuries last year)</text>
  <line x1="40" y1="620" x2="460" y2="620" stroke="#8B3A2E" stroke-width="0.5" opacity="0.5"/>
  <text x="40" y="646" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#8B3A2E" font-weight="700">Plus:</text>
  <circle cx="48" cy="668" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="672" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Japanese exit-phrase card</text>
  <circle cx="48" cy="690" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="694" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Post-scam recovery playbook</text>
  <circle cx="48" cy="712" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="716" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Emergency contacts for all 9 cities</text>
  <rect x="355" y="645" width="80" height="80" fill="none" stroke="#8B3A2E" stroke-width="0.8" opacity="0.5"/>
