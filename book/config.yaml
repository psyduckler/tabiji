title: "Japan Tourist Scams 2026"
subtitle: "60 Real Scams Across Tokyo, Kyoto, Osaka & 6 More Cities — The Exact Japanese Phrases to Stop Them Before They Cost You ¥500,000"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose ¥500,000 in Japan. This book documents 60 tourist scams across
  9 Japanese cities — drawn from traveler reports, embassy advisories, and
  local police warnings. You'll learn the exact scripts scammers use, the
  red flags that give them away, and the moves that shut them down. Includes
  a Japanese exit-phrase card, a post-scam recovery playbook, and emergency
  contacts for all 9 cities.

# Cities in intended reading order (matches back-cover ordering)
cities:
  - tokyo
  - kyoto
  - osaka
  - fukuoka
  - hiroshima
  - nara
  - sapporo
  - okinawa
  - yokohama

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../app/data/scams

# Output
output_dir: build
output_filename: japan-scams
