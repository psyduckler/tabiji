<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- PORTUGAL BACK COVER — José de Guimarães folk-pop aesthetic     -->
  <!-- Background: full-bleed Porto scene (scam illustration)         -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets             -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#003d28" stop-opacity="0.88"/>
      <stop offset="0.75" stop-color="#003d28" stop-opacity="0.84"/>
      <stop offset="0.85" stop-color="#003d28" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#003d28" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#003d28" fill-opacity="0.75" stroke="#d4a628" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#d4a628" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#fef3d7" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#fef3d7" opacity="0.94">
    <tspan x="60" dy="0">Lisbon&#8217;s Tram 28 is the most pickpocket-heavy tourist route in Portugal.</tspan>
    <tspan x="60" dy="16">Faro Airport runs one of Europe&#8217;s best-rehearsed rental-car scams.</tspan>
    <tspan x="60" dy="16">Naz&#225;r&#233;&#8217;s 1889 funicular is closed &#8212; know the four ways up before you go.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="226" font-family="Georgia, serif" font-size="11.5"
        fill="#fef3d7" opacity="0.94">
    <tspan x="60" dy="0">This book documents 65 specific scams across 10 Portuguese</tspan>
    <tspan x="60" dy="15">destinations &#8212; drawn from PSP (Pol&#237;cia de Seguran&#231;a P&#250;blica)</tspan>
    <tspan x="60" dy="15">records, ASAE consumer-protection advisories, Turismo de</tspan>
    <tspan x="60" dy="15">Portugal filings, and real r/portugal, r/lisboa, r/Algarve, and</tspan>
    <tspan x="60" dy="15">r/Madeira traveler reports. You&#8217;ll learn the scripts scammers</tspan>
    <tspan x="60" dy="15">use and the Portuguese phrases that shut them down on the spot.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="338" x2="440" y2="338" stroke="#d4a628" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="358" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#d4a628">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fef3d7">
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">65 scams with exact Portuguese scripts and &#8364; amounts</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Six universal red-flag patterns covering every scam in Portugal</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">A four-panel Jos&#233; de Guimar&#227;es folk-pop comic for every scam</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Coverage of Lisbon, Porto, Sintra, Funchal, the Algarve &amp; 5 more</text>
    </g>
    <g transform="translate(60 452)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">European Portuguese phrases for the moment, with pronunciation</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="482" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#d4a628">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fef3d7">
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">A European Portuguese exit-phrase card for your phone</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Post-scam recovery playbook with Multibanco and SEPA escalation</text>
    </g>
    <g transform="translate(60 538)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Emergency contacts: 112 + PSP Turismo + every major hospital</text>
    </g>
  </g>

  <line x1="60" y1="566" x2="440" y2="566" stroke="#d4a628" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#fef3d7" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
