<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- PORTUGAL FRONT COVER — framed-panel design (v2)                 -->
  <!-- Comic is a framed inset, not full-bleed, so title + hook text  -->
  <!-- sit on solid cream/green bands for maximum legibility.           -->
  <!-- Palette: Portuguese flag red + cobalt blue + mustard + cream    -->
  <!-- ================================================================ -->

  <defs>
    <linearGradient id="bottomDepth" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#006847" stop-opacity="0"/>
      <stop offset="1" stop-color="#003d28" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- SOLID BACKGROUND: warm cream for the whole cover (top band) -->
  <rect x="0" y="0" width="500" height="800" fill="#fef3d7"/>

  <!-- MASTHEAD -->
  <text x="250" y="40" font-family="Georgia, serif" font-size="10"
        letter-spacing="6" fill="#ce1126" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="52" x2="290" y2="52" stroke="#ce1126" stroke-width="0.4" opacity="0.7"/>
  <text x="250" y="68" font-family="Georgia, serif" font-style="italic" font-size="10"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="82" font-family="Georgia, serif" font-size="8"
        letter-spacing="5" fill="#ce1126" text-anchor="middle" opacity="0.9">VOLUME FOURTEEN</text>

  <!-- TITLE — chunky display serif on solid cream = perfectly legible -->
  <text x="250" y="140" font-family="Georgia, serif" font-weight="700" font-size="64"
        fill="#142a52" text-anchor="middle" letter-spacing="-1">PORTUGAL</text>

  <!-- Ornamental gold rule -->
  <g transform="translate(250 162)">
    <rect x="-90" y="-0.8" width="180" height="1.6" fill="#d4a628"/>
    <rect x="-3" y="-4" width="6" height="8" fill="#d4a628"/>
  </g>

  <!-- Italic subtitle -->
  <text x="250" y="192" font-family="Georgia, serif" font-style="italic" font-size="22"
        fill="#142a52" text-anchor="middle">Tourist Scams</text>

  <!-- ===== FRAMED COMIC PANEL ===== -->
  <!-- Square frame (380×380) so the 1024×1024 source comic fits entirely,
       including the speech bubbles at the top/bottom edges. `meet`
       preserveAspectRatio prevents any edge cropping. -->
  <!-- Gold outer frame rectangle -->
  <rect x="60" y="210" width="380" height="380"
        fill="none" stroke="#d4a628" stroke-width="2.5"/>
  <!-- Inner thin rule (creates double-line frame effect) -->
  <rect x="64" y="214" width="372" height="372"
        fill="none" stroke="#d4a628" stroke-width="0.5" opacity="0.6"/>
  <!-- Comic image: square, no cropping (source is 1024×1024) -->
  <image xlink:href="front.jpg" x="66" y="216" width="368" height="368"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- ===== BOTTOM BAND: SOLID Portuguese-flag green ===== -->
  <rect x="0" y="600" width="500" height="200" fill="#006847"/>
  <!-- Darker gradient at very bottom for depth -->
  <rect x="0" y="600" width="500" height="200" fill="url(#bottomDepth)"/>

  <!-- STAT BADGE — cream-on-green, prominent -->
  <g transform="translate(250 646)">
    <rect x="-76" y="-20" width="152" height="40" fill="none"
          stroke="#d4a628" stroke-width="1.3" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="21"
          fill="#fef3d7" text-anchor="middle">65</text>
    <text x="0" y="13" font-family="Georgia, serif" font-size="7.5"
          fill="#d4a628" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- HOOK BLOCK -->
  <line x1="60" y1="690" x2="440" y2="690" stroke="#d4a628" stroke-width="0.6" opacity="0.8"/>
  <text x="250" y="716" font-family="Georgia, serif" font-weight="700" font-size="22"
        fill="#fef3d7" text-anchor="middle">Don&#8217;t Lose &#8364;500 in Portugal</text>
  <text x="250" y="738" font-family="Georgia, serif" font-style="italic" font-size="11.5"
        fill="#fef3d7" text-anchor="middle" opacity="0.95">Drawn from PSP, ASAE, and real traveler reports.</text>
  <line x1="60" y1="752" x2="440" y2="752" stroke="#d4a628" stroke-width="0.6" opacity="0.8"/>

  <!-- FOOTER -->
  <text x="250" y="772" font-family="Georgia, serif" font-size="10"
        fill="#fef3d7" text-anchor="middle" letter-spacing="4">10 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>
