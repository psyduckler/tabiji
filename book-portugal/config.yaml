title: "Portugal Tourist Scams 2026"
subtitle: "65 Real Scams Across Lisbon, Porto, the Algarve, Madeira & 6 More Destinations — Drawn from Portuguese Police Records, Consumer-Protection Advisories, and Real Traveler Reports"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €500 in Portugal. This book documents 65 tourist scams
  across 10 Portuguese cities and regions — drawn from PSP (Polícia
  de Segurança Pública) and GNR (Guarda Nacional Republicana) records,
  ASAE (Autoridade de Segurança Alimentar e Económica) enforcement
  filings, Portuguese consumer law under Decreto-Lei 24/96 and the
  "não pedi, não pago" rule, and direct traveler reports on r/portugal,
  r/lisboa, r/Lisbon, r/LisbonPortugalTravel, r/Coimbra, r/Madeira,
  r/Algarve, r/PortugalExpats, r/TravelPortugal, and r/Bookingcom.
  You'll learn the exact scripts scammers use, the red flags that give
  them away, and the Portuguese phrases that shut them down. Includes
  a European Portuguese exit-phrase card, a post-scam recovery playbook
  covering the Multibanco / SIBS network and credit-card chargeback
  mechanics, and emergency contacts for every major Portuguese city
  and region.

# Cities in intended reading order
# Lisbon flagship → Porto → Sintra day-trip → Madeira → Algarve cluster →
# Cascais/Coimbra/Nazaré interior + coast
cities:
  - lisbon
  - porto
  - sintra
  - funchal
  - faro
  - albufeira
  - lagos-portugal
  - cascais
  - coimbra
  - nazare

# Path to scam JSON data
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: portugal-scams
