<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="imperialRed" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#A6192E"/>
      <stop offset="1" stop-color="#7A1220"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#imperialRed)"/>

  <!-- Double-rule gold frame -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#C9A449" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#C9A449" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="250" y="82" font-family="Georgia, serif" font-size="11" letter-spacing="6" fill="#C9A449" text-anchor="middle">T A B I J I . A I</text>
  <line x1="205" y1="98" x2="295" y2="98" stroke="#C9A449" stroke-width="0.5"/>
  <text x="250" y="116" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#E8C098" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="134" font-family="Georgia, serif" font-size="9" letter-spacing="5" fill="#C9A449" text-anchor="middle" opacity="0.9">VOLUME TWELVE</text>

  <!-- Ornamental fleuron bridging masthead and title -->
  <g transform="translate(250 182)" fill="#C9A449">
    <!-- Central diamond -->
    <polygon points="0,-6 4,0 0,6 -4,0" opacity="0.95"/>
    <!-- Horizontal leaves -->
    <ellipse cx="-14" cy="0" rx="8" ry="2.2" transform="rotate(-15 -14 0)" opacity="0.85"/>
    <ellipse cx="14" cy="0" rx="8" ry="2.2" transform="rotate(15 14 0)" opacity="0.85"/>
    <!-- Outer dots -->
    <circle cx="-26" cy="0" r="1.6"/>
    <circle cx="26" cy="0" r="1.6"/>
    <!-- Faint extending lines -->
    <line x1="-80" y1="0" x2="-34" y2="0" stroke="#C9A449" stroke-width="0.4" opacity="0.5"/>
    <line x1="34" y1="0" x2="80" y2="0" stroke="#C9A449" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- Title — baseline chosen so the cap-center sits at the midpoint between the fleuron (y=182) and the divider (y=310). AUSTRIA is 7 letters, so a slightly smaller size keeps it inside the frame. -->
  <text x="250" y="283" font-family="Georgia, serif" font-weight="700" font-size="78" fill="#F5E6CE" text-anchor="middle" letter-spacing="-1">AUSTRIA</text>

  <!-- Ornamental divider -->
  <g transform="translate(250 310)">
    <line x1="-120" y1="0" x2="-22" y2="0" stroke="#C9A449" stroke-width="0.8"/>
    <line x1="22" y1="0" x2="120" y2="0" stroke="#C9A449" stroke-width="0.8"/>
    <g fill="#C9A449">
      <ellipse cx="-14" cy="0" rx="8" ry="2.4" transform="rotate(-25 -14 0)"/>
      <ellipse cx="0" cy="0" rx="5" ry="1.8"/>
      <ellipse cx="14" cy="0" rx="8" ry="2.4" transform="rotate(25 14 0)"/>
    </g>
  </g>

  <text x="250" y="354" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#E8C098" text-anchor="middle">Tourist Scams</text>
  <text x="250" y="384" font-family="Georgia, serif" font-size="13" fill="#C9A449" text-anchor="middle" letter-spacing="5">A TRAVELER&#8217;S FIELD GUIDE &#183; MMXXVI</text>

  <!-- Circular laurel seal -->
  <g transform="translate(250 510)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#C9A449" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#C9A449" stroke-width="0.5"/>
    <!-- Laurel ring — symmetric 14-leaf arrangement -->
    <g fill="#C9A449" opacity="0.9">
      <ellipse cx="-52" cy="0" rx="7" ry="2.4" transform="rotate(90 -52 0)"/>
      <ellipse cx="-46" cy="-22" rx="7" ry="2.4" transform="rotate(115 -46 -22)"/>
      <ellipse cx="-30" cy="-42" rx="7" ry="2.4" transform="rotate(140 -30 -42)"/>
      <ellipse cx="-8" cy="-52" rx="7" ry="2.4" transform="rotate(160 -8 -52)"/>
      <ellipse cx="52" cy="0" rx="7" ry="2.4" transform="rotate(90 52 0)"/>
      <ellipse cx="46" cy="-22" rx="7" ry="2.4" transform="rotate(65 46 -22)"/>
      <ellipse cx="30" cy="-42" rx="7" ry="2.4" transform="rotate(40 30 -42)"/>
      <ellipse cx="8" cy="-52" rx="7" ry="2.4" transform="rotate(20 8 -52)"/>
      <ellipse cx="-46" cy="22" rx="7" ry="2.4" transform="rotate(65 -46 22)"/>
      <ellipse cx="-30" cy="42" rx="7" ry="2.4" transform="rotate(40 -30 42)"/>
      <ellipse cx="-8" cy="52" rx="7" ry="2.4" transform="rotate(20 -8 52)"/>
      <ellipse cx="46" cy="22" rx="7" ry="2.4" transform="rotate(115 46 22)"/>
      <ellipse cx="30" cy="42" rx="7" ry="2.4" transform="rotate(140 30 42)"/>
      <ellipse cx="8" cy="52" rx="7" ry="2.4" transform="rotate(160 8 52)"/>
    </g>
    <!-- Classical ribbon knot at the base of the wreath -->
    <g transform="translate(0 74)" fill="#C9A449" opacity="0.95">
      <!-- Center knot -->
      <path d="M -6 -2 L 6 -2 L 5 6 L -5 6 Z"/>
      <!-- Left streamer -->
      <path d="M -5 6 L -16 16 L -18 12 L -10 4 Z" opacity="0.85"/>
      <path d="M -16 16 L -22 22 L -20 18 L -14 14 Z" opacity="0.7"/>
      <!-- Right streamer -->
      <path d="M 5 6 L 16 16 L 18 12 L 10 4 Z" opacity="0.85"/>
      <path d="M 16 16 L 22 22 L 20 18 L 14 14 Z" opacity="0.7"/>
    </g>
    <!-- Center stat -->
    <text x="0" y="-8" font-family="Georgia, serif" font-weight="700" font-size="36" fill="#F5E6CE" text-anchor="middle">56</text>
    <text x="0" y="12" font-family="Georgia, serif" font-size="9" fill="#E8C098" text-anchor="middle" letter-spacing="3">DOCUMENTED</text>
    <text x="0" y="26" font-family="Georgia, serif" font-size="9" fill="#E8C098" text-anchor="middle" letter-spacing="3">SCAMS</text>
  </g>

  <!-- Hook block — bold headline + authority-anchored subtitle -->
  <line x1="90" y1="644" x2="410" y2="644" stroke="#C9A449" stroke-width="0.6"/>
  <text x="250" y="678" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#F5E6CE" text-anchor="middle">Don&#8217;t Lose &#8364;500 in Austria</text>
  <text x="250" y="704" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098" text-anchor="middle">Drawn from Austrian police reports, news, and travelers.</text>
  <line x1="90" y1="722" x2="410" y2="722" stroke="#C9A449" stroke-width="0.6"/>

  <!-- Footer — sits inside the inner frame (bottom edge y=764) -->
  <text x="250" y="742" font-family="Georgia, serif" font-size="12" fill="#E8C098" text-anchor="middle" letter-spacing="4">9 CITIES &#183; 2026 EDITION</text>
  <text x="250" y="756" font-family="Georgia, serif" font-size="9" fill="#C9A449" text-anchor="middle" letter-spacing="5" opacity="0.9">BY TABIJI</text>
</svg>
