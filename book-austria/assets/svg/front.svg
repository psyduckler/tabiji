<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4a3526" stop-opacity="0"/>
      <stop offset="0.28" stop-color="#43301f" stop-opacity="0.76"/>
      <stop offset="0.55" stop-color="#332417" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#271c12" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fdf4e3" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fdf4e3" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image xlink:href="front.jpg" x="0" y="0" width="500" height="800" preserveAspectRatio="xMidYMid slice"/>

  <!-- Soft light wash at top to settle the masthead over the cream sky -->
  <rect x="0" y="0" width="500" height="200" fill="url(#topBand)"/>

  <!-- Masthead -->
  <text x="250" y="40" font-family="Georgia, serif" font-size="10" letter-spacing="6" fill="#A6192E" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="52" x2="290" y2="52" stroke="#A6192E" stroke-width="0.4" opacity="0.7"/>
  <text x="250" y="68" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#3a0a10" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="82" font-family="Georgia, serif" font-size="8" letter-spacing="5" fill="#A6192E" text-anchor="middle" opacity="0.9">VOLUME TWELVE</text>

  <!-- Title — dark serif with cream stroke for legibility over the pale sky (France treatment) -->
  <text x="250" y="138" font-family="Georgia, serif" font-weight="700" font-size="64" fill="#3a0a10" text-anchor="middle" letter-spacing="-1" style="paint-order: stroke; stroke: #fdf4e3; stroke-width: 4px;">AUSTRIA</text>
  <g transform="translate(250 160)">
    <rect x="-90" y="-0.8" width="180" height="1.6" fill="#A6192E"/>
    <rect x="-3" y="-4" width="6" height="8" fill="#A6192E"/>
  </g>
  <text x="250" y="186" font-family="Georgia, serif" font-style="italic" font-size="22" fill="#3a0a10" text-anchor="middle" style="paint-order: stroke; stroke: #fdf4e3; stroke-width: 3px;">Tourist Scams</text>

  <!-- Bottom hook block over a Habsburg-red scrim -->
  <rect x="0" y="580" width="500" height="220" fill="url(#bottomBand)"/>
  <g transform="translate(250 648)">
    <rect x="-72" y="-18" width="144" height="34" fill="#271c12" opacity="0.72" rx="2"/>
    <rect x="-72" y="-18" width="144" height="34" fill="none" stroke="#C9A449" stroke-width="1.1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="19" fill="#fdf4e3" text-anchor="middle">56</text>
    <text x="0" y="11" font-family="Georgia, serif" font-size="7" fill="#C9A449" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>
  <line x1="70" y1="684" x2="430" y2="684" stroke="#C9A449" stroke-width="0.5" opacity="0.7"/>
  <text x="250" y="710" font-family="Georgia, serif" font-weight="700" font-size="21" fill="#fdf4e3" text-anchor="middle">Don&#8217;t Lose &#8364;500 in Austria</text>
  <text x="250" y="732" font-family="Georgia, serif" font-style="italic" font-size="11.5" fill="#fdf4e3" text-anchor="middle" opacity="0.92">Drawn from Austrian press and police records.</text>
  <line x1="70" y1="746" x2="430" y2="746" stroke="#C9A449" stroke-width="0.5" opacity="0.7"/>
  <text x="250" y="768" font-family="Georgia, serif" font-size="10" fill="#fdf4e3" text-anchor="middle" letter-spacing="4">9 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>
