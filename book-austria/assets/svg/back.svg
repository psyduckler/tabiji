<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="imperialRedBack" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#A6192E"/>
      <stop offset="1" stop-color="#7A1220"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#imperialRedBack)"/>

  <!-- Double-rule gold frame (matches front) -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#C9A449" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#C9A449" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#C9A449">T A B I J I . A I</text>
  <text x="440" y="70" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#E8C098" text-anchor="end">Travel Safety Series</text>
  <line x1="60" y1="84" x2="440" y2="84" stroke="#C9A449" stroke-width="0.5" opacity="0.7"/>

  <!-- Hero headline -->
  <text x="60" y="156" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#F5E6CE" letter-spacing="-0.3">What the guidebooks</text>
  <text x="60" y="194" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#F5E6CE" letter-spacing="-0.3">won&#8217;t tell you.</text>
  <rect x="60" y="210" width="60" height="1.8" fill="#C9A449"/>

  <!-- Italic pitch paragraph -->
  <text x="60" y="250" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">Austria is one of the safest places you&#8217;ll ever visit &#8212;</text>
  <text x="60" y="270" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">which is exactly why the scams here work. Nobody mugs</text>
  <text x="60" y="290" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">you in Salzburg. They just hand you a card reader set</text>
  <text x="60" y="310" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">to dollars, or a &#8220;fixed&#8221; airport fare that quietly doubles.</text>

  <!-- Body pitch paragraph -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">This book documents 56 tourist scams across nine</text>
  <text x="60" y="368" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Austrian cities &#8212; drawn from Austrian news, police</text>
  <text x="60" y="386" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">and consumer-protection warnings, and travelers. You&#8217;ll</text>
  <text x="60" y="404" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">learn the exact scripts scammers use, the red flags</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">that give them away, and the moves that shut them down.</text>

  <!-- Inside bullets -->
  <text x="60" y="462" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#C9A449" font-weight="700">Inside:</text>
  <circle cx="66" cy="492" r="2" fill="#C9A449"/>
  <text x="78" y="496" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The costumed &#8220;Mozart&#8221; concert tickets that aren&#8217;t (Vienna)</text>
  <circle cx="66" cy="516" r="2" fill="#C9A449"/>
  <text x="78" y="520" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Vienna&#8217;s ~5,300-a-year U1 pickpocket problem &#8212; and how to beat it</text>
  <circle cx="66" cy="540" r="2" fill="#C9A449"/>
  <text x="78" y="544" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The &#8364;105 airport-train fine you never see coming</text>
  <circle cx="66" cy="564" r="2" fill="#C9A449"/>
  <text x="78" y="568" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The ATM &#8220;home currency&#8221; trick that costs you 4&#8211;12% extra</text>
  <circle cx="66" cy="588" r="2" fill="#C9A449"/>
  <text x="78" y="592" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The bargain apartment that doesn&#8217;t exist (~30 Vienna cases a week)</text>

  <!-- Gold divider -->
  <line x1="60" y1="618" x2="440" y2="618" stroke="#C9A449" stroke-width="0.5" opacity="0.6"/>

  <!-- Plus bullets -->
  <text x="60" y="644" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#C9A449" font-weight="700">Plus:</text>
  <circle cx="66" cy="670" r="2" fill="#C9A449"/>
  <text x="78" y="674" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">German exit-phrase card</text>
  <circle cx="66" cy="692" r="2" fill="#C9A449"/>
  <text x="78" y="696" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Post-scam recovery playbook</text>
  <circle cx="66" cy="714" r="2" fill="#C9A449"/>
  <text x="78" y="718" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Emergency contacts for all 9 cities</text>

  <!-- Amazon barcode safe zone (blank) — KDP auto-places barcode at 2x1.2" bottom-right.
       Footer line + edition copy intentionally omitted: Amazon's barcode sits at
       y≈720-760 and would overlap any footer text. Bottom of back cover is left clean. -->
</svg>
