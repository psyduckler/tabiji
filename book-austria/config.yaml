title: "Austria Tourist Scams 2026"
subtitle: "56 Real Scams Across Vienna, Salzburg, Hallstatt, Graz & 5 More Cities — Drawn from Austrian Police Reports, News & Traveler Reports"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €500 in Austria. This book documents 56 tourist scams across
  9 Austrian cities and regions — drawn from Austrian news reports, official
  police and consumer-protection warnings (VKI, AK), and real traveler
  accounts. You'll learn the exact scripts scammers use, the red flags that
  give them away, and the German phrases that shut them down. Includes a
  German exit-phrase card, a post-scam recovery playbook, and emergency
  contacts for every major Austrian city.

# Cities in intended reading order
# Capital → Danube/UNESCO valley → upstream-Danube city → Mozart-city Salzburg
# → lake & alpine spa resorts → Tyrol → Styria
cities:
  - vienna
  - wachau
  - linz
  - salzburg
  - hallstatt
  - bad-gastein
  - zell-am-see
  - innsbruck
  - graz

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: austria-scams

# Spine title override — explicit for the AT volume.
spine_title: "AUSTRIA"

# Wraparound spine + bleed colors — should match the cover palette so trim
# drift doesn't produce a contrasting stripe. Austria uses a warm sepia/espresso
# gradient (#332417 → #271c12) matching the sepia scrim on the front/back cover.
bleed_colors:
  - "#332417"
  - "#271c12"
