<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a0a0a" stop-opacity="0.82"/>
      <stop offset="0.75" stop-color="#1a0a0a" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#1a0a0a" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7" fill="#1a0a0a" fill-opacity="0.7" stroke="#c89a3d" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9" fill="#c89a3d" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#fdf4e3" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">Roman &#8220;centurions&#8221; charge &#8364;30 for a photo you didn&#8217;t ask for.</tspan>
    <tspan x="60" dy="16">Venice San Marco pickpockets work a 90-meter beat in shifts.</tspan>
    <tspan x="60" dy="16">Pompeii &#8220;Info Point&#8221; shops sell &#8364;150 guides for a &#8364;22 entry.</tspan>
  </text>
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">This book documents 138 specific scams across 20 Italian cities</tspan>
    <tspan x="60" dy="15">and scenic regions &#8212; drawn from La Repubblica, Il Corriere</tspan>
    <tspan x="60" dy="15">della Sera, La Nazione, L&#8217;Arena, and Carabinieri (112) records.</tspan>
    <tspan x="60" dy="15">You&#8217;ll learn the exact scripts scammers use, the red flags that</tspan>
    <tspan x="60" dy="15">give them away, and the Italian phrases that shut them down.</tspan>
  </text>
  <line x1="60" y1="320" x2="440" y2="320" stroke="#c89a3d" stroke-width="0.5"/>
  <text x="60" y="340" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#c89a3d">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 362)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">138 scams with exact Italian scripts and euro (&#8364;) amounts</text></g>
    <g transform="translate(60 380)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">Six universal red-flag patterns covering every scam in Italy</text></g>
    <g transform="translate(60 398)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">A four-panel watercolor comic for every scam entry</text></g>
    <g transform="translate(60 416)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">Rome, Venice, Florence, Milan &amp; 16 more cities and regions</text></g>
    <g transform="translate(60 434)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">Italian phrases with pronunciation cues for every situation</text></g>
  </g>
  <text x="60" y="464" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#c89a3d">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 484)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">An Italian exit-phrase card you can screenshot to your phone</text></g>
    <g transform="translate(60 502)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">A post-scam recovery playbook (first 15 min, first hour, first day)</text></g>
    <g transform="translate(60 520)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">Emergency contacts: 112 Carabinieri &amp; every Polizia desk + hospitals</text></g>
  </g>
  <line x1="60" y1="548" x2="440" y2="548" stroke="#c89a3d" stroke-width="0.5"/>
  <text x="250" y="770" font-family="Georgia, serif" font-size="9" fill="#fdf4e3" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
