<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- BRAZIL FRONT COVER — Aldemir Martins folk-modernist aesthetic    -->
  <!-- Background: full-bleed scam-scene Aldemir Martins painting       -->
  <!-- with text overlays in the upper sky + lower band                  -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1b3c" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#0b1b3c" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#050e20" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4e6a8" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f4e6a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="coverBg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4c876"/>
      <stop offset="0.45" stop-color="#d98c3e"/>
      <stop offset="1" stop-color="#0b7d3f"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED COVER BACKGROUND -->
  <rect x="0" y="0" width="500" height="800" fill="url(#coverBg)"/>

  <!-- TOP BAND: soft cream gradient over the sky for title legibility -->
  <rect x="0" y="0" width="500" height="200" fill="url(#topBand)"/>

  <!-- MASTHEAD -->
  <text x="250" y="40" font-family="Georgia, serif" font-size="10"
        letter-spacing="6" fill="#0b7d3f" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="52" x2="290" y2="52" stroke="#0b7d3f" stroke-width="0.4" opacity="0.7"/>
  <text x="250" y="68" font-family="Georgia, serif" font-style="italic" font-size="10"
        fill="#1a1a1a" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="82" font-family="Georgia, serif" font-size="8"
        letter-spacing="5" fill="#0b7d3f" text-anchor="middle" opacity="0.9">VOLUME THIRTEEN</text>

  <!-- TITLE — chunky display serif, stroked for readability -->
  <text x="250" y="138" font-family="Georgia, serif" font-weight="700" font-size="62"
        fill="#142a52" text-anchor="middle" letter-spacing="-1"
        style="paint-order: stroke; stroke: #f4e6a8; stroke-width: 4px;">BRAZIL</text>

  <!-- Ornamental gold rule -->
  <g transform="translate(250 160)">
    <rect x="-90" y="-0.8" width="180" height="1.6" fill="#d4a628"/>
    <rect x="-3" y="-4" width="6" height="8" fill="#d4a628"/>
  </g>

  <!-- Italic subtitle -->
  <text x="250" y="186" font-family="Georgia, serif" font-style="italic" font-size="22"
        fill="#142a52" text-anchor="middle"
        style="paint-order: stroke; stroke: #f4e6a8; stroke-width: 3px;">Tourist Scams</text>

  <!-- BOTTOM BAND: dark gradient for hook block legibility -->
  <rect x="0" y="600" width="500" height="200" fill="url(#bottomBand)"/>

  <!-- STAT BADGE — cream-on-dark for contrast -->
  <g transform="translate(250 648)">
    <rect x="-72" y="-18" width="144" height="34" fill="none"
          stroke="#d4a628" stroke-width="1.1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="19"
          fill="#f4e6a8" text-anchor="middle">72</text>
    <text x="0" y="11" font-family="Georgia, serif" font-size="7"
          fill="#d4a628" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- HOOK -->
  <line x1="70" y1="684" x2="430" y2="684" stroke="#d4a628" stroke-width="0.5" opacity="0.7"/>
  <text x="250" y="710" font-family="Georgia, serif" font-weight="700" font-size="21"
        fill="#f4e6a8" text-anchor="middle">Don&#8217;t Lose R$ 10,000 in Brazil</text>
  <text x="250" y="732" font-family="Georgia, serif" font-style="italic" font-size="11.5"
        fill="#f4e6a8" text-anchor="middle" opacity="0.92">Drawn from DEATUR, PROCON, and real traveler reports.</text>
  <line x1="70" y1="746" x2="430" y2="746" stroke="#d4a628" stroke-width="0.5" opacity="0.7"/>

  <!-- FOOTER -->
  <text x="250" y="768" font-family="Georgia, serif" font-size="10"
        fill="#f4e6a8" text-anchor="middle" letter-spacing="4">12 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>
