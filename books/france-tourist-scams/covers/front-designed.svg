<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- FRANCE COVER — Art Deco travel-poster aesthetic                  -->
  <!-- Cassandre-inspired: flat color blocks, geometric sunburst,       -->
  <!-- stylized Eiffel Tower chevrons, stacked condensed type.          -->
  <!-- Palette: deep navy, aged cream, brass gold, signal red.          -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="skyGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0F1A2E"/>
      <stop offset="1" stop-color="#1E2F4D"/>
    </linearGradient>
    <radialGradient id="sunburst" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#E8B63B" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#E8B63B" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E8B63B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep navy ground -->
  <rect width="500" height="800" fill="url(#skyGrad)"/>

  <!-- Geometric sunburst halo behind the tower motif -->
  <rect width="500" height="800" fill="url(#sunburst)"/>

  <!-- Double-rule thin gold frame (keeps the poster read) -->
  <rect x="22" y="22" width="456" height="756" fill="none" stroke="#D4A12E" stroke-width="0.8"/>
  <rect x="30" y="30" width="440" height="740" fill="none" stroke="#D4A12E" stroke-width="0.3" opacity="0.6"/>

  <!-- ================== MASTHEAD ================== -->
  <text x="250" y="66" font-family="Georgia, serif" font-size="10" letter-spacing="7" fill="#D4A12E" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="80" x2="290" y2="80" stroke="#D4A12E" stroke-width="0.5"/>
  <text x="250" y="96" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#F5E9D3" text-anchor="middle" letter-spacing="1" opacity="0.85">Travel Safety Series</text>
  <text x="250" y="112" font-family="Georgia, serif" font-size="8" letter-spacing="6" fill="#D4A12E" text-anchor="middle" opacity="0.9">VOLUME THREE</text>

  <!-- ================== ART DECO EIFFEL TOWER ================== -->
  <!-- Stylized but with true Eiffel proportions: wide splayed legs,    -->
  <!-- first platform, tapering second tier, narrow upper, spire.        -->
  <!-- Base y=362, apex y=135. Anchored at x=250.                       -->
  <g transform="translate(250 0)">
    <!-- Ground shadow ellipse -->
    <ellipse cx="0" cy="364" rx="70" ry="4" fill="#000" opacity="0.35"/>

    <!-- FIRST TIER — four splayed legs + grand arch -->
    <!-- Left leg (outer silhouette) -->
    <path d="M -56 362 L -42 362 L -22 302 L -26 302 Z" fill="#D4A12E"/>
    <!-- Right leg -->
    <path d="M  56 362 L  42 362 L  22 302 L  26 302 Z" fill="#D4A12E"/>
    <!-- Middle-left leg (slight inset for depth) -->
    <path d="M -38 362 L -30 362 L -18 302 L -20 302 Z" fill="#D4A12E" opacity="0.75"/>
    <!-- Middle-right leg -->
    <path d="M  38 362 L  30 362 L  18 302 L  20 302 Z" fill="#D4A12E" opacity="0.75"/>
    <!-- Grand arch between legs (the iconic curve) -->
    <path d="M -36 338 Q 0 316 36 338 L 30 342 Q 0 324 -30 342 Z" fill="#D4A12E"/>
    <!-- Lattice strokes on legs -->
    <g stroke="#0F1A2E" stroke-width="0.5" opacity="0.5">
      <line x1="-48" y1="332" x2="-24" y2="332"/>
      <line x1="-45" y1="320" x2="-23" y2="320"/>
      <line x1="-42" y1="310" x2="-22" y2="310"/>
      <line x1="48" y1="332" x2="24" y2="332"/>
      <line x1="45" y1="320" x2="23" y2="320"/>
      <line x1="42" y1="310" x2="22" y2="310"/>
    </g>

    <!-- FIRST PLATFORM -->
    <rect x="-34" y="298" width="68" height="4" fill="#F5E9D3"/>
    <rect x="-34" y="302" width="68" height="2" fill="#D4A12E" opacity="0.7"/>

    <!-- SECOND TIER — tapering trapezoid -->
    <path d="M -22 298 L -14 232 L 14 232 L 22 298 Z" fill="#D4A12E"/>
    <!-- X-braces (hallmark of the Eiffel lattice) -->
    <g stroke="#F5E9D3" stroke-width="0.9" opacity="0.85">
      <line x1="-20" y1="290" x2="20" y2="290"/>
      <line x1="-18" y1="275" x2="18" y2="275"/>
      <line x1="-17" y1="260" x2="17" y2="260"/>
      <line x1="-16" y1="245" x2="16" y2="245"/>
      <line x1="-14" y1="232" x2="20" y2="290"/>
      <line x1="14"  y1="232" x2="-20" y2="290"/>
    </g>

    <!-- SECOND PLATFORM -->
    <rect x="-18" y="228" width="36" height="3" fill="#F5E9D3"/>
    <rect x="-18" y="231" width="36" height="1.5" fill="#D4A12E" opacity="0.7"/>

    <!-- UPPER TIER — narrower -->
    <path d="M -13 228 L -6 178 L 6 178 L 13 228 Z" fill="#D4A12E"/>
    <g stroke="#F5E9D3" stroke-width="0.7" opacity="0.85">
      <line x1="-6"  y1="178" x2="13" y2="228"/>
      <line x1="6"   y1="178" x2="-13" y2="228"/>
      <line x1="-10" y1="205" x2="10" y2="205"/>
    </g>

    <!-- OBSERVATION CAP -->
    <rect x="-9" y="172" width="18" height="3" fill="#F5E9D3"/>
    <rect x="-6" y="164" width="12" height="8" fill="#D4A12E"/>
    <rect x="-6" y="164" width="12" height="1.6" fill="#F5E9D3" opacity="0.65"/>

    <!-- SPIRE -->
    <rect x="-1" y="148" width="2" height="16" fill="#D4A12E"/>
    <polygon points="0,135 -2.2,150 2.2,150" fill="#D4A12E"/>

    <!-- TRICOLOR FLAG at the tip -->
    <rect x="1" y="135" width="9" height="2.3" fill="#0055A4"/>
    <rect x="1" y="137.3" width="9" height="2.3" fill="#F5E9D3"/>
    <rect x="1" y="139.6" width="9" height="2.3" fill="#E63946"/>
    <line x1="1" y1="135" x2="1" y2="142" stroke="#D4A12E" stroke-width="0.5"/>
  </g>

  <!-- ================== TITLE BLOCK ================== -->
  <!-- Thin horizontal rule above title -->
  <line x1="90" y1="392" x2="410" y2="392" stroke="#D4A12E" stroke-width="0.6"/>

  <!-- FRANCE — chunky Art Deco display, stacked heavy -->
  <text x="250" y="470" font-family="Georgia, serif" font-weight="700" font-size="100" fill="#F5E9D3" text-anchor="middle" letter-spacing="-1">FRANCE</text>

  <!-- Below-title ornamental bar -->
  <g transform="translate(250 498)">
    <rect x="-140" y="-1" width="280" height="2" fill="#D4A12E" opacity="0.8"/>
    <rect x="-4" y="-6" width="8" height="12" fill="#D4A12E"/>
  </g>

  <!-- Italic subtitle -->
  <text x="250" y="530" font-family="Georgia, serif" font-style="italic" font-size="28" fill="#F5E9D3" text-anchor="middle">Tourist Scams</text>

  <!-- Small-caps tagline -->
  <text x="250" y="556" font-family="Georgia, serif" font-size="11" fill="#D4A12E" text-anchor="middle" letter-spacing="4">A TRAVELER&#8217;S FIELD GUIDE &#183; MMXXVI</text>

  <!-- ================== STAT BADGE (Art Deco chevron medallion) ================== -->
  <g transform="translate(250 625)">
    <!-- Chevron-top frame -->
    <path d="M -90 -26 L -70 -34 L 70 -34 L 90 -26 L 90 26 L 70 34 L -70 34 L -90 26 Z"
          fill="none" stroke="#D4A12E" stroke-width="1.2"/>
    <path d="M -84 -22 L -68 -28 L 68 -28 L 84 -22 L 84 22 L 68 28 L -68 28 L -84 22 Z"
          fill="none" stroke="#D4A12E" stroke-width="0.4" opacity="0.65"/>

    <!-- Left / right chevron accents -->
    <polygon points="-90,-4 -96,0 -90,4" fill="#D4A12E"/>
    <polygon points="90,-4 96,0 90,4" fill="#D4A12E"/>

    <!-- Center stat -->
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="32" fill="#F5E9D3" text-anchor="middle">191</text>
    <text x="0" y="18" font-family="Georgia, serif" font-size="8" fill="#D4A12E" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- ================== HOOK BLOCK ================== -->
  <line x1="60" y1="670" x2="440" y2="670" stroke="#D4A12E" stroke-width="0.6"/>
  <text x="250" y="700" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#F5E9D3" text-anchor="middle">Don&#8217;t Lose &#8364;1,000 in France</text>
  <text x="250" y="722" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#F5E9D3" text-anchor="middle" opacity="0.9">Drawn from French news reports and gendarmerie records.</text>
  <line x1="60" y1="734" x2="440" y2="734" stroke="#D4A12E" stroke-width="0.6"/>

  <!-- ================== FOOTER — single line, baseline y=754 sits clean above inner frame bottom at y=770 ================== -->
  <text x="250" y="754" font-family="Georgia, serif" font-size="10" fill="#F5E9D3" text-anchor="middle" letter-spacing="4">16 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>