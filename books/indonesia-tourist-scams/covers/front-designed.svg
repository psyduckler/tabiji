<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- INDONESIA FRONT COVER — Balinese Lontar palm-leaf aesthetic     -->
  <!-- Background: full-bleed Uluwatu pendant-scam scene               -->
  <!-- with text overlays in the upper sky + lower semi-transparent band-->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a2c2e" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#1a2c2e" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#0f1f21" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fdf4e3" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#fdf4e3" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED COMIC BACKGROUND -->
  <image xlink:href="https://img.tabiji.ai/books/indonesia-tourist-scams/covers/front.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- TOP BAND: soft cream gradient over the sky for title legibility -->
  <rect x="0" y="0" width="500" height="200" fill="url(#topBand)"/>

  <!-- MASTHEAD -->
  <text x="250" y="40" font-family="Georgia, serif" font-size="10"
        letter-spacing="6" fill="#7d4a26" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="52" x2="290" y2="52" stroke="#7d4a26" stroke-width="0.4" opacity="0.7"/>
  <text x="250" y="68" font-family="Georgia, serif" font-style="italic" font-size="10"
        fill="#3a2511" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="82" font-family="Georgia, serif" font-size="8"
        letter-spacing="5" fill="#7d4a26" text-anchor="middle" opacity="0.9">VOLUME EIGHT</text>

  <!-- TITLE — chunky display serif, shadowed for readability against watercolor -->
  <text x="250" y="138" font-family="Georgia, serif" font-weight="700" font-size="62"
        fill="#3a1a12" text-anchor="middle" letter-spacing="-1"
        style="paint-order: stroke; stroke: #fdf4e3; stroke-width: 4px;">INDONESIA</text>

  <!-- Ornamental gold rule -->
  <g transform="translate(250 160)">
    <rect x="-90" y="-0.8" width="180" height="1.6" fill="#c89a3d"/>
    <rect x="-3" y="-4" width="6" height="8" fill="#c89a3d"/>
  </g>

  <!-- Italic subtitle -->
  <text x="250" y="186" font-family="Georgia, serif" font-style="italic" font-size="22"
        fill="#3a1a12" text-anchor="middle"
        style="paint-order: stroke; stroke: #fdf4e3; stroke-width: 3px;">Tourist Scams</text>

  <!-- BOTTOM BAND: dark gradient for hook block legibility over the ground area -->
  <rect x="0" y="600" width="500" height="200" fill="url(#bottomBand)"/>

  <!-- STAT BADGE — cream-on-dark for contrast — tucked inside the hook band -->
  <g transform="translate(250 648)">
    <rect x="-72" y="-18" width="144" height="34" fill="none"
          stroke="#c89a3d" stroke-width="1.1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="19"
          fill="#fdf4e3" text-anchor="middle">73</text>
    <text x="0" y="11" font-family="Georgia, serif" font-size="7"
          fill="#c89a3d" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- HOOK -->
  <line x1="70" y1="684" x2="430" y2="684" stroke="#c89a3d" stroke-width="0.5" opacity="0.7"/>
  <text x="250" y="710" font-family="Georgia, serif" font-weight="700" font-size="21"
        fill="#fdf4e3" text-anchor="middle">Don&#8217;t Lose $1,000 in Indonesia</text>
  <text x="250" y="732" font-family="Georgia, serif" font-style="italic" font-size="11.5"
        fill="#fdf4e3" text-anchor="middle" opacity="0.92">Drawn from Indonesian press and Ministry of Tourism records.</text>
  <line x1="70" y1="746" x2="430" y2="746" stroke="#c89a3d" stroke-width="0.5" opacity="0.7"/>

  <!-- FOOTER -->
  <text x="250" y="768" font-family="Georgia, serif" font-size="10"
        fill="#fdf4e3" text-anchor="middle" letter-spacing="4">12 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>