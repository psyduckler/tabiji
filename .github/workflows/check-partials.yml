name: Check shared partials

# Catches drift between _includes/*.html and the managed blocks embedded
# in every HTML page. The pre-commit hook only verifies staged files
# (to avoid sweeping merge conflicts across parallel branches), so this
# workflow provides the whole-repo guarantee at PR time.
#
# To fix a failure locally: run `scripts/sync-partials.sh`, commit the
# updated HTML files, push.

on:
  pull_request:
    paths:
      - '_includes/**'
      - 'scripts/build-partials.py'
      - '**/*.html'
  push:
    branches:
      - main
    paths:
      - '_includes/**'
      - 'scripts/build-partials.py'
      - '**/*.html'

jobs:
  check-partials:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify every tracked HTML is in sync with _includes/
        run: python3 scripts/build-partials.py --check
