name: Lint Scam Content

# Runs the scam-content linter in two passes:
#   1. JSON lint (rules 1-17) over scams/research/*.json
#   2. HTML lint (rules 18-20) over scams/<slug>/index.html
#
# To fix a failure locally: run the same commands and address each REJECT.
#   python3 scripts/lint_scam_content.py --all
#   python3 scripts/lint_scam_content.py --html

on:
  pull_request:
    paths:
      - 'scams/research/**.json'
      - 'scams/*/index.html'
      - 'scripts/lint_scam_content.py'
  push:
    branches:
      - main
    paths:
      - 'scams/research/**.json'
      - 'scams/*/index.html'
      - 'scripts/lint_scam_content.py'

jobs:
  lint-scam-content:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so sweep_dates.py / generate_pages._page_dates() can
          # resolve each page's first-add commit. Shallow clone silently returns
          # empty and falls back to today's date.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4

      # JSON lint (rules 1-17) is non-blocking for now — ~1700 pre-existing
      # editorial debts across the research batches need to be worked down
      # separately. The linter still runs + surfaces the count, so new
      # violations are visible in CI logs even though they won't fail the job.
      - name: Lint scam research JSON (rules 1-17, non-blocking)
        run: python3 scripts/lint_scam_content.py --all
        continue-on-error: true

      # HTML lint (rules 18-20) IS blocking — the corpus was swept to 0 REJECTs
      # in this PR, so any regression in a PR should fail the check.
      - name: Lint rendered scam HTML (rules 18-20)
        run: python3 scripts/lint_scam_content.py --html
