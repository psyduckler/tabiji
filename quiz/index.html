
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How Basic Is Your Bucket List? | tabiji.ai</title>
    <meta name="description" content="A brutally honest quiz to determine your travel style. Swipe on 20 destinations and find out if you're a Tourist Trap Connoisseur or something much, much worse.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D7QHNRXLHJ"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-D7QHNRXLHJ');</script>
    <style>
        :root { --indigo: #2D3A5C; --terracotta: #C4704B; --warm-cream: #F5F0E8; --sand: #E8DFD0; --earth: #8B7355; --white: #FEFCF9; --text: #2C2419; --sage: #7A8B6F; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background-color: var(--warm-cream); color: var(--text); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; user-select: none; }
        .card-container { width: 90vw; max-width: 350px; height: 500px; position: relative; }
        .card { width: 100%; height: 100%; background-size: cover; background-position: center; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); position: absolute; transition: transform 0.3s ease, opacity 0.3s ease; display: flex; flex-direction: column; justify-content: flex-end; padding: 25px; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .card h2 { font-size: 2rem; margin: 0 0 10px 0; }
        .card p { font-size: 1.1rem; margin: 0; }
        .card.dragging { transition: none; }
        .status-indicator { position: absolute; top: 40px; font-weight: bold; font-size: 3rem; text-transform: uppercase; letter-spacing: 2px; z-index: 10; opacity: 0; }
        #yes { left: 40px; color: var(--sage); border: 5px solid var(--sage); padding: 5px 15px; border-radius: 10px; transform: rotate(-15deg); }
        #no { right: 40px; color: var(--terracotta); border: 5px solid var(--terracotta); padding: 5px 15px; border-radius: 10px; transform: rotate(15deg); }
        .progress-bar { width: 90%; max-width: 350px; height: 10px; background-color: var(--sand); border-radius: 5px; margin-top: 20px; overflow: hidden; }
        #progress { width: 0; height: 100%; background-color: var(--terracotta); transition: width 0.3s ease; }
        .result-screen { display: none; text-align: center; padding: 20px; }
        .result-screen h2 { color: var(--indigo); font-size: 2rem; }
        .result-screen p { color: var(--earth); font-size: 1.1rem; max-width: 500px; }
        #share-card { background: var(--indigo); color: white; padding: 15px; border-radius: 10px; text-align: left; max-width: 350px; margin-top: 20px; }
        #share-card .logo { font-size: 1.2rem; font-weight: 700; color: var(--white); } #share-card .logo span { color: var(--terracotta); }
        #share-card h3 { font-size: 1.5rem; margin: 10px 0; }
        #share-card p { font-size: 1rem; margin: 0; }
        .cta-button { background: var(--terracotta); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 500; display: inline-block; margin-top: 20px; }
        .credit { position: fixed; bottom: 10px; font-size: 0.8rem; } .credit a { color: var(--indigo); }
    </style>
</head>
<body>

    <div class="card-container">
        <div id="no" class="status-indicator">Nope</div>
        <div id="yes" class="status-indicator">Basic</div>
    </div>
    <div class="progress-bar"><div id="progress"></div></div>

    <div class="result-screen">
        <h2>Your Travel Style:</h2>
        <div id="share-card">
            <div class="logo">tabiji<span>.ai</span></div>
            <h3 id="result-title"></h3>
            <p id="result-description"></p>
        </div>
        <a href="https://tabiji.ai/plan" class="cta-button">Get a FREE Itinerary for Your... Unique Taste</a>
        <p style="margin-top:20px; color: var(--earth)">Take a screenshot and share your result!</p>
    </div>

    <div class="credit">a tool by <a href="https://tabiji.ai">tabiji.ai</a></div>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.0.0-rc.7/dist/html2canvas.min.js"></script>
    <script>
        const destinations = [
            { name: 'Eiffel Tower', country: 'Paris, France', img: 'https://images.unsplash.com/photo-1511739001486-6b65b65a5a20?w=800', score: 1 },
            { name: 'Colosseum', country: 'Rome, Italy', img: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=800', score: 1 },
            { name: 'Times Square', country: 'New York, USA', img: 'https://images.unsplash.com/photo-1534274988757-a28bf1a57c17?w=800', score: 1 },
            { name: 'Canals of Venice', country: 'Venice, Italy', img: 'https://images.unsplash.com/photo-1523906834658-6e24ef2386f9?w=800', score: 1 },
            { name: 'Fushimi Inari Shrine', country: 'Kyoto, Japan', img: 'https://images.unsplash.com/photo-1528164344705-47542687000d?w=800', score: 0 },
            { name: 'Santorini', country: 'Greece', img: 'https://images.unsplash.com/photo-1570157977340-94a251a3a58e?w=800', score: 1 },
            { name: 'The Pyramids of Giza', country: 'Cairo, Egypt', img: 'https://images.unsplash.com/photo-1572009203923-a25e695b3662?w=800', score: 0 },
            { name: 'Machu Picchu', country: 'Peru', img: 'https://images.unsplash.com/photo-1526392060635-9d6019884377?w=800', score: 0 },
            { name: 'Bali', country: 'Indonesia', img: 'https://images.unsplash.com/photo-1537996194471-e657df97525d?w=800', score: 1 },
            { name: 'Neuschwanstein Castle', country: 'Germany', img: 'https://images.unsplash.com/photo-1597143423452-92d7216a4450?w=800', score: 1 },
            { name: 'Salar de Uyuni', country: 'Bolivia', img: 'https://images.unsplash.com/photo-1580556240217-1335552a46e1?w=800', score: -1 },
            { name: 'Northern Lights', country: 'Iceland', img: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=800', score: 0 },
        ];

        const results = [
            { title: 'Tourist Trap Connoisseur', description: 'You have a refined palate for the worlds most popular, crowded, and expensive attractions. You and your selfie stick are unstoppable.', min: 8 },
            { title: 'Basically Balanced', description: 'You appreciate a good classic, but you arent afraid to venture slightly off the beaten path. You probably own hiking boots and a nice suitcase.', min: 4 },
            { title: 'Aspiring Contrarian', description: 'You’ve seen the popular stuff on Instagram and you’re not impressed. You’d rather be in a Bolivian salt flat than a Venetian canal.', min: 0 },
            { title: 'Are You Okay?', description: 'Your bucket list is a cry for help. It’s so unique and obscure that you might be the only person who enjoys it. We’re a little worried.', min: -12 }
        ];

        let currentCard = 0;
        let score = 0;

        const container = document.querySelector('.card-container');
        const yes = document.getElementById('yes');
        const no = document.getElementById('no');

        function createCards() {
            destinations.forEach((dest, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.innerHTML = `<h2>${dest.name}</h2><p>${dest.country}</p>`;
                card.style.backgroundImage = `linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 50%), url(${dest.img})`;
                card.style.zIndex = destinations.length - index;
                container.appendChild(card);

                if (index > 0) card.style.transform = `translateY(${index * 10}px)`;

                let startPoint;
                let isDragging = false;

                function onStart(e) {
                    isDragging = true;
                    card.classList.add('dragging');
                    startPoint = { x: e.pageX ?? e.touches[0].pageX, y: e.pageY ?? e.touches[0].pageY };
                    e.preventDefault();
                }

                function onMove(e) {
                    if (!isDragging) return;
                    const currentPoint = { x: e.pageX ?? e.touches[0].pageX, y: e.pageY ?? e.touches[0].pageY };
                    const deltaX = currentPoint.x - startPoint.x;
                    const rotate = deltaX * 0.1;
                    card.style.transform = `translateX(${deltaX}px) rotate(${rotate}deg)`;
                    
                    yes.style.opacity = Math.max(0, deltaX / 100);
                    no.style.opacity = Math.max(0, -deltaX / 100);
                }

                function onEnd(e) {
                    if (!isDragging) return;
                    isDragging = false;
                    card.classList.remove('dragging');
                    const deltaX = (e.pageX ?? e.changedTouches[0].pageX) - startPoint.x;

                    if (Math.abs(deltaX) > 100) {
                        const direction = deltaX > 0 ? 1 : -1;
                        card.style.transform = `translateX(${direction * 500}px) rotate(${direction * 30}deg)`;
                        card.style.opacity = 0;
                        if (direction === 1) score += destinations[currentCard].score;
                        setTimeout(() => nextCard(), 200);
                    } else {
                        card.style.transform = '';
                    }
                    yes.style.opacity = 0;
                    no.style.opacity = 0;
                }
                
                card.addEventListener('mousedown', onStart);
                card.addEventListener('mousemove', onMove);
                card.addEventListener('mouseup', onEnd);
                card.addEventListener('mouseleave', onEnd);

                card.addEventListener('touchstart', onStart, {passive: false});
                card.addEventListener('touchmove', onMove, {passive: false});
                card.addEventListener('touchend', onEnd);
            });
        }

        function nextCard() {
            currentCard++;
            document.getElementById('progress').style.width = `${(currentCard / destinations.length) * 100}%`;
            if (currentCard >= destinations.length) {
                showResults();
            }
        }

        function showResults() {
            container.style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            const result = results.find(r => score >= r.min);
            document.getElementById('result-title').innerText = result.title;
            document.getElementById('result-description').innerText = result.description;
            document.querySelector('.result-screen').style.display = 'block';
        }

        createCards();
    </script>
</body>
</html>
