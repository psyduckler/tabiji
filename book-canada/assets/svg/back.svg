<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- CANADA BACK COVER — Drawn & Quarterly indie-comic aesthetic     -->
  <!-- Background: full-bleed Montreal Vieux-Port winter-evening scene -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets              -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0d1218" stop-opacity="0.84"/>
      <stop offset="0.75" stop-color="#0d1218" stop-opacity="0.8"/>
      <stop offset="0.85" stop-color="#0d1218" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0d1218" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED COMIC BACKGROUND -->
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#0d1218" fill-opacity="0.7" stroke="#c8392d" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#c8392d" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#fdf4e3" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">Toronto runs the most-documented taxi card-swap script in Canada.</tspan>
    <tspan x="60" dy="16">Montreal and Whistler work parking-tow and QR-sticker scams.</tspan>
    <tspan x="60" dy="16">Banff and Jasper pad fees at every Rockies combo-pass viewpoint.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">This book documents 75 specific scams across 12 Canadian cities</tspan>
    <tspan x="60" dy="15">&#8212; drawn from the Globe and Mail, CBC, CTV News, Toronto Star,</tspan>
    <tspan x="60" dy="15">Montreal Gazette, Vancouver Sun, and Canadian Anti-Fraud</tspan>
    <tspan x="60" dy="15">Centre (1-888-495-8501) records. You&#8217;ll learn the exact scripts</tspan>
    <tspan x="60" dy="15">scammers use, the red flags, and the moves that shut them down.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="320" x2="440" y2="320" stroke="#c8392d" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c8392d">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">75 scams with exact scripts and Canadian-dollar amounts</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">Six universal red-flag patterns covering every scam in Canada</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">A four-panel Drawn &amp; Quarterly indie comic for every scam entry</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">Coverage of Toronto, Montreal, Vancouver, Banff, Whistler &amp; 7 more</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">English + French exit phrases for Quebec and bilingual encounters</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c8392d">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">A traveler quick-reference card you can screenshot to your phone</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">A post-scam recovery playbook (first 15 min, first hour, first day)</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#c8392d"/>
      <text x="14" y="3">Emergency contacts: 911 + every major Canadian hospital</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#c8392d" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#fdf4e3" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
