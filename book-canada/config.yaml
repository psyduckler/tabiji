title: "Canada Tourist Scams 2026"
subtitle: "75 Real Scams Across Toronto, Vancouver, Montreal, Banff & 8 More Cities — Drawn from Canadian News Reports and Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $1,000 in Canada. This book documents 75 tourist scams
  across 12 Canadian cities — drawn from Canadian news reports (Globe
  and Mail, CBC, CTV News, Toronto Star, Montreal Gazette, Vancouver
  Sun), RCMP and provincial police reports, and real traveler
  accounts. You'll learn the exact scripts scammers use, the red flags
  that give them away, and the simple habits that shut them down.
  Includes a post-scam recovery playbook, an emergency-contacts
  appendix, and city-by-city coverage across the whole country.

# Cities in intended reading order
# Gateway Toronto → eastern corridor → Rockies → Pacific → Maritimes
cities:
  - toronto
  - niagara-falls
  - ottawa
  - montreal
  - quebec-city
  - halifax
  - calgary
  - banff
  - jasper
  - whistler
  - vancouver
  - victoria-bc

# Path to scam JSON data
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: canada-scams
