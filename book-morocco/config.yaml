title: "Morocco Tourist Scams 2026"
subtitle: "61 Real Scams Across Marrakech, Fez, Casablanca & 7 More Cities — Drawn from Moroccan News Reports, Embassy Advisories, and Tourist Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose 5,000 dirhams in Morocco. This book documents 61 tourist scams
  across 10 Moroccan cities — drawn from Moroccan news reports (Le Matin,
  Hespress, Yabiladi, Morocco World News), Brigade Touristique and Sûreté
  Nationale records, US and UK embassy advisories, and real traveler
  accounts on r/Morocco and TripAdvisor. You'll learn the exact scripts
  faux guides, henna-ambush teams, and meter-rigging petit-taxi drivers
  use, the red flags that give them away, and the Darija and French
  phrases that shut them down. Includes a Darija exit-phrase card, a
  post-scam recovery playbook, and emergency contacts for every major
  Moroccan destination from Tangier to Merzouga.

# Cities in intended reading order:
# Imperial-cities core (Marrakech, Fez) → administrative + Atlantic coast
# (Casablanca, Rabat, Tangier) → Rif (Chefchaouen) → coastal Atlantic
# (Essaouira, Agadir) → desert/southern circuit (Merzouga, Ouarzazate).
cities:
  - marrakech
  - fez
  - casablanca
  - rabat
  - tangier
  - chefchaouen
  - essaouira
  - agadir
  - merzouga
  - ouarzazate

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: morocco-scams
