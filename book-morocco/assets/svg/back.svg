<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="moroccoScrim" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6E2210" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#6E2210" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a0a04" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Wavespeed-generated back cover artwork (Marrakech medina alley evening with
       copper-lantern glow + saffron-purple atmosphere for back-copy negative space).
       build.py inlines this as a base64 data URI before rsvg-convert renders. -->
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800" preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-bleed scrim — keeps the dense back-cover copy legible while letting
       the watercolor artwork show through as a moody atmospheric backdrop. -->
  <rect x="0" y="0" width="500" height="800" fill="url(#moroccoScrim)"/>

  <!-- Cream double-rule frame (matches front) -->
  <rect x="20" y="20" width="460" height="760" fill="none" stroke="#F5E6CE" stroke-width="1" opacity="0.7"/>
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#F5E6CE" stroke-width="0.4" opacity="0.45"/>

  <!-- Masthead -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#F5E6CE">T A B I J I . A I</text>
  <text x="440" y="70" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#FFDDA6" text-anchor="end">Travel Safety Series</text>
  <line x1="60" y1="84" x2="440" y2="84" stroke="#F5E6CE" stroke-width="0.5" opacity="0.7"/>

  <!-- Hero headline -->
  <text x="60" y="156" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">What the guidebooks</text>
  <text x="60" y="194" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">won&#8217;t tell you.</text>
  <rect x="60" y="210" width="60" height="1.8" fill="#F5E6CE"/>

  <!-- Italic pitch paragraph -->
  <text x="60" y="250" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="60" y="270" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">lifetime. Don&#8217;t lose a dirham of it to a Marrakech</text>
  <text x="60" y="290" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">&#8220;that way is closed&#8221; faux guide, a Chefchaouen hash</text>
  <text x="60" y="310" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">shakedown, or a desert tour that vanishes after deposit.</text>

  <!-- Body pitch paragraph -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">This book documents 61 tourist scams across 10</text>
  <text x="60" y="368" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Moroccan cities &#8212; sourced from Le Matin, Hespress,</text>
  <text x="60" y="386" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">r/Morocco, Brigade Touristique advisories, and US/UK</text>
  <text x="60" y="404" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">embassy traveler reports. You&#8217;ll learn the exact scripts</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">scammers use, the red flags, and the moves that shut them down.</text>

  <!-- Inside bullets -->
  <text x="60" y="462" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#F5E6CE" font-weight="700">Inside:</text>
  <circle cx="66" cy="492" r="2" fill="#F5E6CE"/>
  <text x="78" y="496" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Marrakech &#8220;that way is closed&#8221; fake-guide play (200 MAD)</text>
  <circle cx="66" cy="516" r="2" fill="#F5E6CE"/>
  <text x="78" y="520" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Chefchaouen hash-tout police shakedown (2,000&#8211;5,000 MAD)</text>
  <circle cx="66" cy="540" r="2" fill="#F5E6CE"/>
  <text x="78" y="544" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Marrakech-to-Merzouga desert-tour bait-and-switch</text>
  <circle cx="66" cy="564" r="2" fill="#F5E6CE"/>
  <text x="78" y="568" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Casablanca seafood &#8220;market price&#8221; menu-switch (1,500+ MAD)</text>
  <circle cx="66" cy="588" r="2" fill="#F5E6CE"/>
  <text x="78" y="592" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The fake argan-oil cooperative network (300 MAD for 50-MAD product)</text>

  <!-- Divider -->
  <line x1="60" y1="618" x2="440" y2="618" stroke="#F5E6CE" stroke-width="0.5" opacity="0.6"/>

  <!-- Plus bullets (left) — no QR (Amazon reserves bottom-right for ISBN barcode) -->
  <text x="60" y="644" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#F5E6CE" font-weight="700">Plus:</text>
  <circle cx="66" cy="670" r="2" fill="#F5E6CE"/>
  <text x="78" y="674" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Darija exit-phrase card</text>
  <circle cx="66" cy="692" r="2" fill="#F5E6CE"/>
  <text x="78" y="696" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Post-scam recovery playbook</text>
  <circle cx="66" cy="714" r="2" fill="#F5E6CE"/>
  <text x="78" y="718" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Emergency contacts for all 10 cities</text>

  <!-- Amazon barcode safe zone (blank) — KDP auto-places barcode at 2x1.2" bottom-right. -->
</svg>
