<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#6E2210" stop-opacity="0.92"/>
      <stop offset="0.7" stop-color="#6E2210" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6E2210" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a1a08" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3a1a08" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#1a0a04" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- Wavespeed-generated front cover artwork (Marrakech medina 'that way is closed'
       fake-guide scene with Koutoubia minaret + saffron-purple sunset). build.py
       inlines this as a base64 data URI before rsvg-convert renders. -->
  <image xlink:href="front.jpg" x="0" y="0" width="500" height="800" preserveAspectRatio="xMidYMid slice"/>

  <!-- Top fade band — title legibility against the watercolor sky -->
  <rect x="0" y="0" width="500" height="240" fill="url(#topBand)"/>

  <!-- Cream double-rule frame -->
  <rect x="20" y="20" width="460" height="760" fill="none" stroke="#F5E6CE" stroke-width="1" opacity="0.7"/>
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#F5E6CE" stroke-width="0.4" opacity="0.45"/>

  <!-- Masthead -->
  <text x="250" y="58" font-family="Georgia, serif" font-size="11" letter-spacing="6" fill="#F5E6CE" text-anchor="middle">T A B I J I . A I</text>
  <line x1="205" y1="74" x2="295" y2="74" stroke="#F5E6CE" stroke-width="0.5" opacity="0.8"/>
  <text x="250" y="92" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#FFDDA6" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="110" font-family="Georgia, serif" font-size="9" letter-spacing="5" fill="#F5E6CE" text-anchor="middle" opacity="0.9">MOROCCO EDITION</text>

  <!-- Title — paint-order stroke gives a thin cream halo for legibility against any sky -->
  <text x="250" y="172" font-family="Georgia, serif" font-weight="700" font-size="68" fill="#FFF3DC" text-anchor="middle" letter-spacing="-2"
        style="paint-order: stroke; stroke: #6E2210; stroke-width: 2.5px;">MOROCCO</text>

  <!-- Subtitle -->
  <text x="250" y="208" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#FFDDA6" text-anchor="middle"
        style="paint-order: stroke; stroke: #6E2210; stroke-width: 2px;">Tourist Scams</text>
  <text x="250" y="232" font-family="Georgia, serif" font-size="11" fill="#F5E6CE" text-anchor="middle" letter-spacing="4"
        style="paint-order: stroke; stroke: #6E2210; stroke-width: 2px;">A TRAVELER&#8217;S FIELD GUIDE &#183; MMXXVI</text>

  <!-- Bottom fade band for hook copy -->
  <rect x="0" y="560" width="500" height="240" fill="url(#bottomBand)"/>

  <!-- Documented-scams stat badge — box widened from 116 → 144 to fit "DOCUMENTED SCAMS" letter-spaced text without overflow -->
  <g transform="translate(250 612)">
    <rect x="-72" y="-22" width="144" height="44" fill="none" stroke="#FFDDA6" stroke-width="1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#FFF3DC" text-anchor="middle">61</text>
    <text x="0" y="14" font-family="Georgia, serif" font-size="8" fill="#FFDDA6" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- Hook block — bold headline + authority-anchored subtitle -->
  <line x1="90" y1="660" x2="410" y2="660" stroke="#FFDDA6" stroke-width="0.6" opacity="0.7"/>
  <text x="250" y="694" font-family="Georgia, serif" font-weight="700" font-size="22" fill="#FFF3DC" text-anchor="middle"
        style="paint-order: stroke; stroke: #1a0a04; stroke-width: 2px;">Don&#8217;t Lose 5,000 MAD in Morocco</text>
  <text x="250" y="720" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#FFDDA6" text-anchor="middle">Drawn from Reddit, Le Matin, Hespress &amp; Brigade Touristique advisories.</text>
  <line x1="90" y1="736" x2="410" y2="736" stroke="#FFDDA6" stroke-width="0.6" opacity="0.7"/>

  <!-- Footer -->
  <text x="250" y="754" font-family="Georgia, serif" font-size="10" fill="#FFDDA6" text-anchor="middle" letter-spacing="4">10 CITIES &#183; 2026 EDITION</text>
  <text x="250" y="768" font-family="Georgia, serif" font-size="8" fill="#F5E6CE" text-anchor="middle" letter-spacing="5" opacity="0.85">BY TABIJI</text>
</svg>
