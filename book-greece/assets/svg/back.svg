<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- GREECE BACK COVER — red-figure pottery aesthetic                 -->
  <!-- Background: full-bleed image with Aegean harbor scene            -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets              -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0a1619" stop-opacity="0.82"/>
      <stop offset="0.75" stop-color="#0a1619" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#0a1619" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0a1619" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED BACKGROUND -->
  <image xlink:href="https://img.tabiji.ai/book-greece/assets/svg/back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility; lightens toward bottom -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#0a1619" fill-opacity="0.7" stroke="#c89a3d" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#c89a3d" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#fdf4e3" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">Athens runs southeastern Europe&#8217;s oldest tourist-scam playbook.</tspan>
    <tspan x="60" dy="16">Mykonos and Santorini work the caldera-view restaurant markup.</tspan>
    <tspan x="60" dy="16">Crete runs the most aggressive car-rental damage-claim cycle.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">This book documents 99 specific scams across 16 Greek cities and</tspan>
    <tspan x="60" dy="15">islands &#8212; drawn from Kathimerini, Greek Reporter, eKathimerini,</tspan>
    <tspan x="60" dy="15">and Tourist Police (171) records. You&#8217;ll learn the exact scripts</tspan>
    <tspan x="60" dy="15">scammers use, the red flags that give them away, and the Greek</tspan>
    <tspan x="60" dy="15">phrases that shut them down on the spot.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="320" x2="440" y2="320" stroke="#c89a3d" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c89a3d">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">99 scams with exact Greek scripts and euro amounts</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Six universal red-flag patterns covering every scam in Greece</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A red-figure pottery comic for every scam entry</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Coverage of Athens, Santorini, Meteora, Crete &amp; 12 more</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Greek phrases you will encounter at the scene, with pronunciation</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c89a3d">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A Greek exit-phrase card you can screenshot to your phone</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A post-scam recovery playbook (first 15 min, first hour, first day)</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Emergency contacts: 171 Tourist Police + every major hospital</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#c89a3d" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#fdf4e3" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
