title: "Greece Tourist Scams 2026"
subtitle: "99 Real Scams Across Athens, Santorini, Mykonos, Meteora & 12 More Cities — Drawn from Greek News Reports and Tourist Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €1,000 in Greece. This book documents 99 tourist scams
  across 16 Greek cities and islands — drawn from Greek news reports,
  Tourist Police (171) records, and real traveler accounts. You'll learn
  the exact scripts scammers use, the red flags that give them away, and
  the Greek phrases that shut them down. Includes a Greek exit-phrase card,
  a post-scam recovery playbook, and emergency contacts for every major
  Greek city and island.

