title: "Argentina Tourist Scams 2026"
subtitle: "66 Real Scams Across Buenos Aires, Patagonia, Iguazú & 8 More Destinations — Drawn from Clarín, La Nación, and Policía Federal Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose a thousand dollars in Argentina. This book documents 66
  tourist scams across 11 Argentine destinations — drawn from Argentine
  news reports (Clarín, La Nación, Página/12), Policía Federal and
  provincial tourist-police records, and real traveler accounts. You'll
  learn the exact scripts Florida Avenue "cambio" touts use in Buenos
  Aires, how to spot a counterfeit peso note, why the blue-dollar market
  is now often a net loss, and the Rioplatense phrases that end a
  negotiation in seconds. Includes a Spanish exit-phrase card, a post-scam
  recovery playbook, and emergency contacts for every major Argentine
  city — from the humid north of Puerto Iguazú to the sub-Antarctic south
  of Ushuaia.

# Cities in intended reading order:
# Capital → Northwest wine/altiplano → Patagonia → Subtropics → Delta
cities:
  - buenos-aires
  - cordoba-argentina
  - rosario
  - mendoza
  - salta
  - bariloche
  - el-calafate
  - el-chalten
  - ushuaia
  - puerto-iguazu
  - tigre

# Path to scam JSON data — Argentine data lives in the public API tree
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: argentina-scams
