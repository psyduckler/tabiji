<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- COSTA RICA BACK COVER — tico naïf primitivist tropical painting  -->
  <!-- Background: full-bleed Arenal volcano + rainforest scene          -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets               -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#082A1A" stop-opacity="0.84"/>
      <stop offset="0.75" stop-color="#082A1A" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#082A1A" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#082A1A" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED ILLUSTRATION BACKGROUND -->
  <image xlink:href="https://img.tabiji.ai/book-costa-rica/assets/svg/back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility; lightens toward bottom -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#082A1A" fill-opacity="0.7" stroke="#FFDDA6" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#FFDDA6" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#FFF3DC" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#FFF3DC" opacity="0.92">
    <tspan x="60" dy="0">A Manuel Antonio &#8220;park ranger&#8221; quotes a $40 fee that doesn&#8217;t exist.</tspan>
    <tspan x="60" dy="16">Avis Liberia quotes $35 a day and ambushes you for $2,000.</tspan>
    <tspan x="60" dy="16">A Tamarindo &#8220;guachim&#225;n&#8221; demands cash to &#8220;watch&#8221; your parked car.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#FFF3DC" opacity="0.92">
    <tspan x="60" dy="0">This book documents 69 specific scams across 11 Costa</tspan>
    <tspan x="60" dy="15">Rican destinations &#8212; sourced from r/CostaRicaTravel,</tspan>
    <tspan x="60" dy="15">U.S. Embassy Security Alerts, OIJ police reports, and</tspan>
    <tspan x="60" dy="15">real traveler accounts. You&#8217;ll learn the scripts, the</tspan>
    <tspan x="60" dy="15">red flags, and the Costa Rican Spanish that shuts them down.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="320" x2="440" y2="320" stroke="#FFDDA6" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#FFDDA6">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#FFF3DC">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">The Manuel Antonio fake park-ranger Route 618 roadblock</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">Why Avis Liberia is Reddit&#8217;s most-avoided rental counter</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">&#8220;Costa Joe&#8221; &#8212; the named Jac&#243; WhatsApp deposit fraud</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">Puerto Viejo key-fob jammer car break-ins (Playa Cocles)</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">The Tamarindo &#8220;guachim&#225;n&#8221; parking-extortion shakedown</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#FFDDA6">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#FFF3DC">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">A Costa Rican Spanish exit-phrase card you can screenshot</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">A post-scam recovery playbook (911 / OIJ / ICT)</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#FFDDA6"/>
      <text x="14" y="3">Emergency contacts for all 11 Costa Rican destinations</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#FFDDA6" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#FFF3DC" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
