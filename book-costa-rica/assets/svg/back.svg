<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="crSkyBack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0E6C89"/>
      <stop offset="0.40" stop-color="#148EAD"/>
      <stop offset="0.70" stop-color="#E39454"/>
      <stop offset="1" stop-color="#A34425"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#crSkyBack)"/>

  <!-- Double-rule cream frame (matches front) -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#F5E6CE" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#F5E6CE" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#F5E6CE">T A B I J I . A I</text>
  <text x="440" y="70" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#FFDDA6" text-anchor="end">Travel Safety Series</text>
  <line x1="60" y1="84" x2="440" y2="84" stroke="#F5E6CE" stroke-width="0.5" opacity="0.7"/>

  <!-- Hero headline -->
  <text x="60" y="156" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">What the guidebooks</text>
  <text x="60" y="194" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">won&#8217;t tell you.</text>
  <rect x="60" y="210" width="60" height="1.8" fill="#F5E6CE"/>

  <!-- Italic pitch paragraph -->
  <text x="60" y="250" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="60" y="270" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">lifetime. Don&#8217;t lose a dollar to a Manuel Antonio</text>
  <text x="60" y="290" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">&#8220;fake park ranger,&#8221; an Avis Liberia $2,000 insurance</text>
  <text x="60" y="310" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">ambush, or a Los Jobos villa calendar-leak robbery.</text>

  <!-- Body pitch paragraph -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">This book documents 54 tourist scams across 8 Costa</text>
  <text x="60" y="368" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Rican cities &#8212; sourced from r/CostaRicaTravel,</text>
  <text x="60" y="386" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">U.S. Embassy Security Alerts, and OIJ police reports.</text>
  <text x="60" y="404" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">You&#8217;ll learn the exact scripts scammers use, the red</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">flags that give them away, and the moves that shut them down.</text>

  <!-- Inside bullets -->
  <text x="60" y="462" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#F5E6CE" font-weight="700">Inside:</text>
  <circle cx="66" cy="492" r="2" fill="#F5E6CE"/>
  <text x="78" y="496" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Manuel Antonio fake park-ranger roadblock (Route 618)</text>
  <circle cx="66" cy="516" r="2" fill="#F5E6CE"/>
  <text x="78" y="520" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Why Avis Liberia is Reddit&#8217;s most-avoided rental counter</text>
  <circle cx="66" cy="540" r="2" fill="#F5E6CE"/>
  <text x="78" y="544" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">&#8220;Costa Joe&#8221; &#8212; the named Jac&#243; WhatsApp deposit fraud</text>
  <circle cx="66" cy="564" r="2" fill="#F5E6CE"/>
  <text x="78" y="568" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Puerto Viejo key-fob jammer car break-ins (Playa Cocles)</text>
  <circle cx="66" cy="588" r="2" fill="#F5E6CE"/>
  <text x="78" y="592" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Tamarindo &#8220;guachim&#225;n&#8221; parking-extortion shakedown</text>

  <!-- Divider -->
  <line x1="60" y1="618" x2="440" y2="618" stroke="#F5E6CE" stroke-width="0.5" opacity="0.6"/>

  <!-- Plus bullets (left) — no QR (Amazon reserves bottom-right for ISBN barcode) -->
  <text x="60" y="644" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#F5E6CE" font-weight="700">Plus:</text>
  <circle cx="66" cy="670" r="2" fill="#F5E6CE"/>
  <text x="78" y="674" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Costa Rican Spanish exit-phrase card</text>
  <circle cx="66" cy="692" r="2" fill="#F5E6CE"/>
  <text x="78" y="696" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Post-scam recovery playbook (911 / OIJ / ICT)</text>
  <circle cx="66" cy="714" r="2" fill="#F5E6CE"/>
  <text x="78" y="718" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Emergency contacts for all 8 cities</text>

  <!-- Amazon barcode safe zone (blank) — KDP auto-places barcode at 2x1.2" bottom-right. -->
</svg>
