<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="crSky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#082A1A"/>
      <stop offset="0.40" stop-color="#0F4D2E"/>
      <stop offset="0.70" stop-color="#1A6E3F"/>
      <stop offset="1" stop-color="#C18B3F"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#crSky)"/>

  <!-- Double-rule cream frame -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#F5E6CE" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#F5E6CE" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="250" y="82" font-family="Georgia, serif" font-size="11" letter-spacing="6" fill="#F5E6CE" text-anchor="middle">T A B I J I . A I</text>
  <line x1="205" y1="98" x2="295" y2="98" stroke="#F5E6CE" stroke-width="0.5"/>
  <text x="250" y="116" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#FFDDA6" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="134" font-family="Georgia, serif" font-size="9" letter-spacing="5" fill="#F5E6CE" text-anchor="middle" opacity="0.9">COSTA RICA EDITION</text>

  <!-- Ornamental fleuron bridging masthead and title -->
  <g transform="translate(250 182)" fill="#F5E6CE">
    <!-- Central diamond -->
    <polygon points="0,-6 4,0 0,6 -4,0" opacity="0.95"/>
    <!-- Horizontal leaves -->
    <ellipse cx="-14" cy="0" rx="8" ry="2.2" transform="rotate(-15 -14 0)" opacity="0.85"/>
    <ellipse cx="14" cy="0" rx="8" ry="2.2" transform="rotate(15 14 0)" opacity="0.85"/>
    <!-- Outer dots -->
    <circle cx="-26" cy="0" r="1.6"/>
    <circle cx="26" cy="0" r="1.6"/>
    <!-- Faint extending lines -->
    <line x1="-80" y1="0" x2="-34" y2="0" stroke="#F5E6CE" stroke-width="0.4" opacity="0.5"/>
    <line x1="34" y1="0" x2="80" y2="0" stroke="#F5E6CE" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- Title — COSTA RICA (10 chars with space) at 72pt fits cleanly in 428-wide frame -->
  <text x="250" y="270" font-family="Georgia, serif" font-weight="700" font-size="72" fill="#FFF3DC" text-anchor="middle" letter-spacing="-1">COSTA RICA</text>

  <!-- Ornamental divider -->
  <g transform="translate(250 310)">
    <line x1="-120" y1="0" x2="-22" y2="0" stroke="#F5E6CE" stroke-width="0.8"/>
    <line x1="22" y1="0" x2="120" y2="0" stroke="#F5E6CE" stroke-width="0.8"/>
    <g fill="#F5E6CE">
      <ellipse cx="-14" cy="0" rx="8" ry="2.4" transform="rotate(-25 -14 0)"/>
      <ellipse cx="0" cy="0" rx="5" ry="1.8"/>
      <ellipse cx="14" cy="0" rx="8" ry="2.4" transform="rotate(25 14 0)"/>
    </g>
  </g>

  <text x="250" y="354" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#FFDDA6" text-anchor="middle">Tourist Scams</text>
  <text x="250" y="384" font-family="Georgia, serif" font-size="13" fill="#F5E6CE" text-anchor="middle" letter-spacing="5">A TRAVELER&#8217;S FIELD GUIDE &#183; MMXXVI</text>

  <!-- Circular seal — 11 cities ring + tropical motif -->
  <g transform="translate(250 510)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#F5E6CE" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#F5E6CE" stroke-width="0.5"/>
    <!-- Eleven cluster dots around the rim (one per city), 360°/11 ≈ 32.73° apart, starting at top -->
    <g fill="#FFDDA6" opacity="0.95">
      <circle cx="0" cy="-52" r="2.8"/>
      <circle cx="28.13" cy="-43.69" r="2.8"/>
      <circle cx="47.30" cy="-21.61" r="2.8"/>
      <circle cx="51.47" cy="7.40" r="2.8"/>
      <circle cx="39.27" cy="34.07" r="2.8"/>
      <circle cx="14.65" cy="49.90" r="2.8"/>
      <circle cx="-14.65" cy="49.90" r="2.8"/>
      <circle cx="-39.27" cy="34.07" r="2.8"/>
      <circle cx="-51.47" cy="7.40" r="2.8"/>
      <circle cx="-47.30" cy="-21.61" r="2.8"/>
      <circle cx="-28.13" cy="-43.69" r="2.8"/>
    </g>
    <!-- Palm-frond accent at the base of the wreath -->
    <g transform="translate(0 74)" fill="#F5E6CE" opacity="0.95">
      <!-- Central stem -->
      <path d="M 0 -4 L 0 10" stroke="#F5E6CE" stroke-width="1" fill="none"/>
      <!-- Left palm frond -->
      <ellipse cx="-10" cy="4" rx="12" ry="3" transform="rotate(-30 -10 4)" opacity="0.9"/>
      <!-- Right palm frond -->
      <ellipse cx="10" cy="4" rx="12" ry="3" transform="rotate(30 10 4)" opacity="0.9"/>
    </g>
    <!-- Center stat -->
    <text x="0" y="-8" font-family="Georgia, serif" font-weight="700" font-size="36" fill="#FFF3DC" text-anchor="middle">69</text>
    <text x="0" y="12" font-family="Georgia, serif" font-size="9" fill="#FFDDA6" text-anchor="middle" letter-spacing="3">DOCUMENTED</text>
    <text x="0" y="26" font-family="Georgia, serif" font-size="9" fill="#FFDDA6" text-anchor="middle" letter-spacing="3">SCAMS</text>
  </g>

  <!-- Hook block — bold headline + authority-anchored subtitle -->
  <line x1="90" y1="644" x2="410" y2="644" stroke="#F5E6CE" stroke-width="0.6"/>
  <text x="250" y="678" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#FFF3DC" text-anchor="middle">Don&#8217;t Lose $1,000 in Costa Rica</text>
  <text x="250" y="704" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6" text-anchor="middle">Drawn from Reddit, U.S. Embassy alerts &amp; OIJ police reports.</text>
  <line x1="90" y1="722" x2="410" y2="722" stroke="#F5E6CE" stroke-width="0.6"/>

  <!-- Footer — sits inside the inner frame (bottom edge y=764) -->
  <text x="250" y="742" font-family="Georgia, serif" font-size="12" fill="#FFDDA6" text-anchor="middle" letter-spacing="4">11 CITIES &#183; 2026 EDITION</text>
  <text x="250" y="756" font-family="Georgia, serif" font-size="9" fill="#F5E6CE" text-anchor="middle" letter-spacing="5" opacity="0.9">BY TABIJI</text>
</svg>
