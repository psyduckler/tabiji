title: "Costa Rica Tourist Scams 2026"
subtitle: "69 Real Scams Across San José, Manuel Antonio & 9 More Costa Rican Destinations — Drawn from Embassy Alerts, Tico Times Reports & Real Traveler Accounts"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $1,000 in Costa Rica. This book documents 69 tourist scams across
  11 Costa Rican destinations — sourced from r/CostaRicaTravel, r/costarica,
  r/travel, the U.S. Embassy San José Security Alerts (including the November
  25, 2025 alert on rising vacation-rental armed robberies and impostors
  impersonating police), Organismo de Investigación Judicial (OIJ) reports,
  ICT (Instituto Costarricense de Turismo) operator records, SINAC park-service
  notices, *Tico Times* coverage of the 6,300+ tourist crimes recorded in
  2024, and real traveler incident reports with exact dollar and colón losses.
  You will learn the specific scripts scammers use — from the Manuel Antonio
  fake park-ranger Route 618 roadblock to the SJO airport pirate-taxi cartel,
  from the Avis Liberia "mandatory insurance" $2,000 ambush to the Santa
  Teresa fake-police villa heist, from the Tortuguero shadow turtle-walk to
  the Puerto Viejo key-fob jammer break-ins — plus the Costa Rican Spanish
  phrases and defensive playbooks that shut them down. Includes a Spanish
  exit-phrase card, a post-scam recovery playbook, and emergency contacts
  (911, OIJ tip line 800-8000-645, Tourist Police 2258-1008, ICT, U.S.
  Embassy San José +506 2519-2000) for every region.

# Cities in intended reading order
# Capital → Arenal → Cloud Forest → Central Pacific arc → Nicoya tip → Guanacaste gateway → Caribbean
cities:
  - san-jose-costa-rica
  - la-fortuna
  - monteverde
  - manuel-antonio
  - quepos
  - jaco-costa-rica
  - tamarindo
  - santa-teresa
  - liberia-costa-rica
  - tortuguero
  - puerto-viejo-costa-rica

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: costa-rica-scams

# Wraparound spine + bleed colors — Costa Rican rainforest palette: deep
# emerald jungle (top) into shadow jungle (bottom), so the spine matches a
# rainforest-cover front.
bleed_colors:
  - "#0F4D2E"   # top — deep emerald rainforest
  - "#082A1A"   # bottom — jungle-shadow

# Spine title override — explicit for the CR volume.
spine_title: "COSTA RICA"
