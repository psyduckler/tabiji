title: "Costa Rica Tourist Scams 2026"
subtitle: "54 Real Scams Across San José, Manuel Antonio & 6 More Cities — Drawn from Reddit, U.S. Embassy Security Alerts & OIJ Police Reports"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $1,000 in Costa Rica. This book documents 54 tourist scams across
  8 Costa Rican cities — sourced from r/CostaRicaTravel, r/costarica, r/travel,
  the U.S. Embassy San José Security Alerts (including the November 25, 2025
  alert on rising vacation-rental armed robberies), Organismo de Investigación
  Judicial (OIJ) reports, Tico Times coverage, and real traveler incident
  reports with exact dollar and colón losses. You will learn the specific
  scripts scammers use — from the Manuel Antonio "Fake Park Ranger" Route 618
  roadblock to the Avis Liberia "mandatory insurance" $2,000 ambush, from the
  Puerto Viejo key-fob jammer break-ins to the Jacó "Costa Joe" WhatsApp
  deposit fraud — plus the Costa Rican phrases and defensive playbooks that
  shut them down. Includes a Spanish exit-phrase card, a post-scam recovery
  playbook, and emergency contacts (911, OIJ tip line, Tourist Police, ICT,
  U.S. Embassy) for every region.

# Cities in intended reading order
# Central Valley gateway → Guanacaste → Cloud forest → Arenal → Central Pacific → Caribbean
cities:
  - san-jose-costa-rica
  - liberia-costa-rica
  - tamarindo
  - monteverde
  - la-fortuna
  - jaco-costa-rica
  - manuel-antonio
  - puerto-viejo-costa-rica

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: costa-rica-scams

# Wraparound spine + bleed colors — match the Pan-Am tropical-deco travel-poster
# palette: turquoise Pacific fading to volcano red-orange.
bleed_colors:
  - "#148EAD"   # top — deep Costa Rican turquoise Pacific
  - "#D96A3A"   # bottom — warm volcano red-orange

# Spine title override — explicit for the CR volume.
spine_title: "COSTA RICA"
