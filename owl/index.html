<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0a">

    <!-- SEO Meta Tags -->
    <meta name="description" content="Meet Tabiji, the wise travel owl who helps you discover your perfect destination. Answer a few questions and get personalized travel recommendations.">
    <meta name="keywords" content="travel planner, trip advisor, destination finder, travel quiz, Tabiji">

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Tabiji - Your Wise Travel Guide">
    <meta property="og:description" content="Let Tabiji the wise owl guide you to your perfect travel destination.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://tabiji.ai">
    <meta property="og:image" content="https://tabiji.ai/tabiji-owl.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tabiji - Your Wise Travel Guide">
    <meta name="twitter:description" content="Let Tabiji the wise owl guide you to your perfect travel destination.">

    <title>Tabiji - Your Wise Travel Guide</title>
    <link rel="icon" type="image/png" href="tabiji-owl.png">
    <link rel="apple-touch-icon" href="tabiji-owl.png">
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
    <div class="game-container">
        <div class="terminal">
            <div class="terminal-header">
                <span class="terminal-title">═══ TABIJI TRAVEL ═══</span>
            </div>

            <div class="npc-area">
                <img class="npc-image" id="npc-sprite" src="tabiji-owl.png" alt="Tabiji the Wise Travel Owl">
                <div class="npc-name">TABIJI</div>
                <div class="npc-title">( Wise Travel Owl )</div>
            </div>

            <div class="progress-area" id="progress-area" style="display: none;">
                <div class="progress-dots">
                    <span class="progress-dot" data-step="0"></span>
                    <span class="progress-dot" data-step="1"></span>
                    <span class="progress-dot" data-step="2"></span>
                    <span class="progress-dot" data-step="3"></span>
                    <span class="progress-dot" data-step="4"></span>
                </div>
                <div class="progress-label" id="progress-label">Question 1 of 5</div>
            </div>

            <div class="dialogue-area">
                <div class="dialogue-box" id="dialogue-box">
                    <span class="dialogue-text" id="dialogue-text"></span>
                    <span class="cursor">█</span>
                    <span class="skip-hint" id="skip-hint">(click to skip)</span>
                </div>
            </div>

            <div class="nav-area" id="nav-area" style="display: none;">
                <button class="back-btn" id="back-btn">← Back</button>
                <button class="surprise-btn" id="surprise-btn">✨ Surprise Me</button>
            </div>

            <div class="choices-area" id="choices-area">
                <!-- Choices will be injected here -->
            </div>

            <div class="trip-result" id="trip-result" style="display: none;">
                <!-- Trip results will appear here -->
            </div>
        </div>
    </div>

    <script src="data.js?v=2"></script>
    <script src="script.js?v=4"></script>
</body>
</html>
