<nav>

    <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">☰</button>
    <div class="nav-links">
        <div class="nav-dropdown">
            <button class="nav-dropdown-toggle" onclick="this.parentElement.classList.toggle('open')">Explore</button>
            <div class="nav-dropdown-menu">
                <a href="/compare/">🆚 Compare Destinations</a>
                <a href="/find/">🔍 Destination Finder</a>

    <div class="game-container">
        <div class="terminal">
            <div class="terminal-header">
                <span class="terminal-title">═══ TABIJI TRAVEL ═══</span>
            </div>

            <div class="npc-area">
                <img class="npc-image" id="npc-sprite" src="tabiji-owl.png" alt="Tabiji the Wise Travel Owl">
                <div class="npc-name">TABIJI</div>
                <div class="npc-title">( Wise Travel Owl )</div>
            </div>

            <div class="progress-area" id="progress-area" style="display: none;">
                <div class="progress-dots">
                    <span class="progress-dot" data-step="0"></span>
                    <span class="progress-dot" data-step="1"></span>
                    <span class="progress-dot" data-step="2"></span>
                    <span class="progress-dot" data-step="3"></span>
                    <span class="progress-dot" data-step="4"></span>
                </div>
                <div class="progress-label" id="progress-label">Question 1 of 5</div>
            </div>

            <div class="dialogue-area">
                <div class="dialogue-box" id="dialogue-box">
                    <span class="dialogue-text" id="dialogue-text"></span>
                    <span class="cursor">█</span>
                    <span class="skip-hint" id="skip-hint">(click to skip)</span>
                </div>
            </div>

            <div class="nav-area" id="nav-area" style="display: none;">
                <button class="back-btn" id="back-btn">← Back</button>
                <button class="surprise-btn" id="surprise-btn">✨ Surprise Me</button>
            </div>

            <div class="choices-area" id="choices-area">
                <!-- Choices will be injected here -->
            </div>

            <div class="trip-result" id="trip-result" style="display: none;">
                <!-- Trip results will appear here -->
            </div>
        </div>
    </div>

    <script src="data.js?v=2"></script>
    <script src="script.js?v=4"></script>
