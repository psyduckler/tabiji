title: "Thailand Tourist Scams 2026"
subtitle: "67 Real Scams Across Bangkok, Chiang Mai, Phuket & 8 More Cities — Drawn from Thai News Reports and Tourist Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $1,000 in Thailand. This book documents 67 tourist scams
  across 11 Thai cities and islands — drawn from Thai news reports
  (Bangkok Post, Thai PBS, The Nation, Khaosod English), Tourist Police
  (1155) records, and real traveler accounts. You'll learn the exact
  scripts scammers use, the red flags that give them away, and the Thai
  phrases that shut them down. Includes a Thai exit-phrase card, a
  post-scam recovery playbook, and emergency contacts for every major
  Thai city and island.

# Cities in intended reading order
# Bangkok flagship → Northern → Central → Southern mainland → Islands
cities:
  - bangkok
  - chiang-mai
  - ayutthaya
  - pattaya
  - hua-hin
  - phuket
  - krabi
  - koh-samui
  - koh-phangan
  - koh-tao
  - koh-phi-phi

# Path to scam JSON data — Thailand data lives in the public API tree
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: thailand-scams
