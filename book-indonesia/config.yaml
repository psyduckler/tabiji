title: "Indonesia Tourist Scams 2026"
subtitle: "73 Real Scams Across Bali, Jakarta, Yogyakarta & 9 More Cities — Drawn from Indonesian News Reports and Tourist Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $1,000 in Indonesia. This book documents 73 tourist scams
  across 12 Indonesian cities and regions — drawn from Indonesian news
  reports (Jakarta Post, Tempo, Kompas, Bali Post, Detik), local tourist
  police reports, and real traveler accounts. You'll learn the exact
  scripts scammers use, the red flags that give them away, and the
  Bahasa Indonesia phrases that shut them down. Includes an Indonesian
  exit-phrase card, a post-scam recovery playbook, and emergency
  contacts for every major Indonesian city and region.

# Cities in intended reading order
# Jakarta capital → Java highlights → Bali cluster → outer islands
cities:
  - jakarta
  - yogyakarta
  - mount-bromo
  - ijen-crater
  - bali
  - ubud
  - seminyak
  - nusa-penida
  - gili-islands
  - lombok
  - labuan-bajo
  - batam

# Path to scam JSON data
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: indonesia-scams
