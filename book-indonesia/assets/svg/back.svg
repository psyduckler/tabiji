<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- INDONESIA BACK COVER — Balinese Lontar palm-leaf aesthetic       -->
  <!-- Background: full-bleed Ubud rice-terrace Lontar scene            -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets              -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#16090a" stop-opacity="0.84"/>
      <stop offset="0.75" stop-color="#16090a" stop-opacity="0.8"/>
      <stop offset="0.85" stop-color="#16090a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#16090a" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED LONTAR BACKGROUND -->
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#16090a" fill-opacity="0.7" stroke="#c89a3d" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#c89a3d" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#fdf4e3" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">Bali runs one of the most rehearsed scooter-rental scripts in Asia.</tspan>
    <tspan x="60" dy="16">Jakarta and Batam work honeypot-bar and taxi-shark cycles.</tspan>
    <tspan x="60" dy="16">Bromo and Ijen jeep-cartels pad fees at every viewpoint stop.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">This book documents 73 specific scams across 12 Indonesian cities</tspan>
    <tspan x="60" dy="15">and regions &#8212; drawn from Jakarta Post, Tempo, Kompas, Bali</tspan>
    <tspan x="60" dy="15">Post, Detik, and Ministry of Tourism (+62 21 3838 899) records.</tspan>
    <tspan x="60" dy="15">You&#8217;ll learn the exact scripts scammers use, the red flags that</tspan>
    <tspan x="60" dy="15">give them away, and the Bahasa phrases that shut them down.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="320" x2="440" y2="320" stroke="#c89a3d" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c89a3d">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">73 scams with exact Bahasa scripts and rupiah amounts</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Six universal red-flag patterns covering every scam in Indonesia</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A four-panel Balinese Lontar palm-leaf comic for every scam entry</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Coverage of Bali, Jakarta, Yogyakarta, Lombok, Komodo &amp; 7 more</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Indonesian phrases you will encounter at the scene, with pronunciation</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c89a3d">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A Bahasa Indonesia exit-phrase card you can screenshot to your phone</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A post-scam recovery playbook (first 15 min, first hour, first day)</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Emergency contacts: Ministry of Tourism hotline + every major hospital</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#c89a3d" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#fdf4e3" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
