<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1296.39 925"
     width="3875"
     height="2775">
  <!-- ===========================================================
       The Dental Tourism Field Guide — Paperback Wrap Cover
       KDP 6×9" trim, 317 pages, spine width 0.7139"
       Total wrap dimensions (with 0.125" bleed):
         Width:  12.9639" (3866 px @ 300 DPI)
         Height: 9.25"     (2775 px @ 300 DPI)
       Layout (left to right):
         [bleed 0.125"][back cover 6"][spine 0.7139"][front cover 6"][bleed 0.125"]
       =========================================================== -->

  <!-- Full-bleed background: deep forest green -->
  <rect width="1296.39" height="925" fill="#1f3a2e"/>

  <!-- Subtle spine boundary lines (so spine fold is visible during printing setup, but inside safe zone) -->
  <line x1="612.5" y1="0" x2="612.5" y2="925" stroke="#0f1f17" stroke-width="0.4" opacity="0.5"/>
  <line x1="683.89" y1="0" x2="683.89" y2="925" stroke="#0f1f17" stroke-width="0.4" opacity="0.5"/>

  <!-- =========================================================
       BACK COVER (x: 12.5 to 612.5)
       Safe zone: x: 37.5 to 587.5 (0.25" from each edge)
       ========================================================= -->

  <!-- Back: top hook headline -->
  <text x="312.5" y="80"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="20"
        font-weight="bold"
        fill="#f4ebd9">If a dental quote made your stomach drop,</text>
  <text x="312.5" y="108"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="20"
        font-weight="bold"
        fill="#f4ebd9">you are not alone.</text>

  <!-- Back: short description -->
  <g font-family="Georgia, serif" font-size="11" fill="#e6dec5">
    <text x="50" y="170"><tspan x="50" dy="0">Maybe the estimate arrived after a rushed exam: extractions,</tspan><tspan x="50" dy="14">bone grafting, implants, crowns, and a number that looked like a</tspan><tspan x="50" dy="14">down payment on a house. Maybe you have already spent hours</tspan><tspan x="50" dy="14">scrolling clinic ads, before-and-after reels, and strangers in</tspan><tspan x="50" dy="14">comment threads insisting their decision was either the best or</tspan><tspan x="50" dy="14">worst they ever made.</tspan></text>

    <text x="50" y="280"><tspan x="50" dy="0" font-weight="bold" fill="#f4ebd9">This is the book you wish you had at the kitchen table that night.</tspan></text>

    <text x="50" y="320"><tspan x="50" dy="0">A calm, practical field manual for the cost-shocked patient</tspan><tspan x="50" dy="14">considering dental work abroad. It will not rank countries or</tspan><tspan x="50" dy="14">clinics. It will not sell you a destination. It will help you slow</tspan><tspan x="50" dy="14">down, decode a quote, vet a clinic, recognize sales pressure,</tspan><tspan x="50" dy="14">protect your records, and keep your decision from becoming</tspan><tspan x="50" dy="14">a one-way door.</tspan></text>

    <text x="50" y="430"><tspan x="50" dy="0" font-weight="bold" fill="#d4b87a">Inside:</tspan></text>
    <text x="50" y="450"><tspan x="50" dy="0">• The Five Rules and the Seven Leverage Points</tspan></text>
    <text x="50" y="466"><tspan x="50" dy="0">• A 20-Minute Safety Pause for readers about to send a deposit</tspan></text>
    <text x="50" y="482"><tspan x="50" dy="0">• 12 composite scenarios drawn from common patterns</tspan></text>
    <text x="50" y="498"><tspan x="50" dy="0">• Word-for-word scripts and email templates you can copy</tspan></text>
    <text x="50" y="514"><tspan x="50" dy="0">• Color-coded green / yellow / red flag checklists</tspan></text>
    <text x="50" y="530"><tspan x="50" dy="0">• 15 reusable worksheets in the back matter</tspan></text>
  </g>

  <!-- Pull quote on back cover -->
  <g transform="translate(80, 580)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="48" fill="#d4b87a" font-weight="bold" opacity="0.7">&#8220;</text>
    <text x="40" y="-14" font-family="Georgia, serif" font-size="13" fill="#f4ebd9" font-style="italic">Hope is important.</text>
    <text x="40" y="3" font-family="Georgia, serif" font-size="13" fill="#f4ebd9" font-style="italic">It is not enough to sign consent.</text>
  </g>

  <!-- Back: bottom — Tabiji line + price tag area + barcode placeholder -->
  <line x1="50" y1="700" x2="575" y2="700" stroke="#d4b87a" stroke-width="0.5" opacity="0.6"/>

  <text x="50" y="725" font-family="Georgia, serif" font-size="10" fill="#a8c4b0" letter-spacing="3">A TABIJI FIELD GUIDE  |  VOLUME ONE</text>
  <text x="50" y="744" font-family="Georgia, serif" font-size="10" fill="#a8c4b0" font-style="italic">tabiji.ai/book/dental</text>

  <!-- Barcode area intentionally left clear.
       KDP automatically places its own barcode (with white background) in the
       lower-right of the back cover during printing. No reserved white box is
       needed; KDP's barcode includes its own background. Keep this region of
       the cover free of text and graphics. -->
  <!-- Recommended clear area: x ≈ 362.5–562.5, y ≈ 687.5–807.5 (in the SVG's
       0.01-inch units = 2.0" × 1.2" in the lower right of the back cover). -->

  <!-- =========================================================
       SPINE (x: 612.5 to 676.23, width 63.73)
       Safe text area: x: 618.75 to 670 (0.0625" from each spine edge)
       ========================================================= -->

  <!-- Tabiji wordmark at top of spine -->
  <text transform="translate(647.3549999999999, 60) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="9"
        fill="#d4b87a"
        letter-spacing="3">TABIJI</text>

  <!-- Title on spine, vertical -->
  <text transform="translate(650.9549999999999, 180) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="22"
        font-weight="bold"
        fill="#f4ebd9">The Dental Tourism Field Guide</text>

  <!-- Author at bottom of spine -->
  <text transform="translate(646.9549999999999, 740) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="11"
        fill="#f4ebd9"
        letter-spacing="2">BERNARD HUANG</text>

  <!-- =========================================================
       FRONT COVER (x: 676.23 to 1276.23, width 600)
       Safe zone: x: 701.23 to 1251.23 (0.25" inside)
       Center of front: x = 976.23
       ========================================================= -->

  <!-- Front: top imprint band -->
  <line x1="733.89" y1="90" x2="1231.41" y2="90" stroke="#d4b87a" stroke-width="1"/>
  <text x="983.89" y="70" text-anchor="middle"
        font-family="Georgia, serif" font-size="11" fill="#d4b87a" letter-spacing="4">TABIJI FIELD GUIDES</text>
  <text x="983.89" y="110" text-anchor="middle"
        font-family="Georgia, serif" font-size="7" fill="#a8c4b0" letter-spacing="3" font-style="italic">VOLUME ONE</text>

  <!-- Front: title -->
  <g font-family="Georgia, serif" fill="#f4ebd9" font-weight="bold">
    <text x="983.89" y="320" text-anchor="middle" font-size="46">The</text>
    <text x="983.89" y="385" text-anchor="middle" font-size="46">Dental Tourism</text>
    <text x="983.89" y="450" text-anchor="middle" font-size="46">Field Guide</text>
  </g>

  <!-- Front: clipboard ornament -->
  <g transform="translate(953.89, 510)" stroke="#d4b87a" stroke-width="1.5" fill="none">
    <rect x="0" y="10" width="60" height="80" rx="3"/>
    <rect x="17.5" y="0" width="25" height="17.5" rx="2" fill="#d4b87a"/>
    <line x1="10" y1="32.5" x2="50" y2="32.5" stroke-width="1"/>
    <line x1="10" y1="46" x2="40" y2="46" stroke-width="1"/>
    <line x1="10" y1="59.5" x2="50" y2="59.5" stroke-width="1"/>
    <line x1="10" y1="73" x2="35" y2="73" stroke-width="1"/>
  </g>

  <!-- Front: subtitle -->
  <text x="983.89" y="660" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#d4b87a" font-style="italic">A buyer-protection guide</text>
  <text x="983.89" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#d4b87a" font-style="italic">to dental care abroad</text>

  <!-- Front: bottom band -->
  <line x1="733.89" y1="820" x2="1231.41" y2="820" stroke="#d4b87a" stroke-width="1"/>

  <!-- Front: editor byline -->
  <text x="983.89" y="855" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#f4ebd9" letter-spacing="2">BERNARD HUANG</text>
  <text x="983.89" y="873" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#a8c4b0" letter-spacing="3" font-style="italic">EDITOR</text>
</svg>
