<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <filter id="paper2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Dark slate background -->
  <rect width="1200" height="1800" fill="#22272e"/>

  <!-- Document - takes up most of cover -->
  <g transform="translate(80, 110) rotate(-1)" filter="url(#paper2)">
    <rect width="1040" height="1600" fill="#f5ede0"/>

    <!-- Header -->
    <text x="80" y="100" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1a1a1a" letter-spacing="3">DENTAL TREATMENT ESTIMATE</text>
    <line x1="80" y1="120" x2="960" y2="120" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Patient info -->
    <text x="80" y="170" font-family="Georgia, serif" font-size="16" fill="#444">Patient name:</text>
    <rect x="220" y="155" width="380" height="22" fill="#1a1a1a"/>

    <text x="80" y="205" font-family="Georgia, serif" font-size="16" fill="#444">Date of birth:</text>
    <rect x="220" y="190" width="180" height="22" fill="#1a1a1a"/>

    <text x="80" y="240" font-family="Georgia, serif" font-size="16" fill="#444">Clinic:</text>
    <rect x="220" y="225" width="500" height="22" fill="#1a1a1a"/>

    <!-- Procedures -->
    <text x="80" y="320" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#1a1a1a">PROPOSED PROCEDURES</text>
    <line x1="80" y1="335" x2="960" y2="335" stroke="#1a1a1a" stroke-width="1"/>

    <g font-family="Georgia, serif" font-size="18" fill="#1a1a1a">
      <text x="80" y="380">1. Comprehensive exam &amp; CBCT imaging</text>
      <rect x="800" y="365" width="160" height="22" fill="#1a1a1a"/>

      <text x="80" y="425">2. Extractions, teeth #__, __, __, __</text>
      <rect x="800" y="410" width="160" height="22" fill="#1a1a1a"/>

      <rect x="80" y="445" width="600" height="22" fill="#1a1a1a"/>
      <rect x="800" y="455" width="160" height="22" fill="#1a1a1a"/>

      <text x="80" y="515">4. Implants (___) sites</text>
      <rect x="800" y="500" width="160" height="22" fill="#1a1a1a"/>

      <rect x="80" y="535" width="500" height="22" fill="#1a1a1a"/>
      <rect x="800" y="545" width="160" height="22" fill="#1a1a1a"/>

      <text x="80" y="605">6. Final zirconia restoration</text>
      <rect x="800" y="590" width="160" height="22" fill="#1a1a1a"/>

      <rect x="80" y="625" width="450" height="22" fill="#1a1a1a"/>
      <rect x="800" y="635" width="160" height="22" fill="#1a1a1a"/>
    </g>

    <!-- Total -->
    <line x1="80" y1="710" x2="960" y2="710" stroke="#1a1a1a" stroke-width="2"/>
    <text x="80" y="765" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1a1a1a" letter-spacing="2">TOTAL</text>
    <rect x="700" y="725" width="260" height="50" fill="#1a1a1a"/>

    <!-- Footer disclaimers (partial redaction) -->
    <text x="80" y="900" font-family="Georgia, serif" font-size="13" fill="#666">Subject to insurance verification. Estimate valid 30 days.</text>
    <text x="80" y="922" font-family="Georgia, serif" font-size="13" fill="#666">Additional procedures may be required following examination.</text>

    <text x="80" y="970" font-family="Georgia, serif" font-size="13" fill="#666">Warranty terms:</text>
    <rect x="200" y="955" width="700" height="18" fill="#1a1a1a"/>
    <text x="80" y="995" font-family="Georgia, serif" font-size="13" fill="#666">Refund policy:</text>
    <rect x="190" y="980" width="720" height="18" fill="#1a1a1a"/>
    <text x="80" y="1020" font-family="Georgia, serif" font-size="13" fill="#666">After-hours contact:</text>
    <rect x="240" y="1005" width="660" height="18" fill="#1a1a1a"/>
    <text x="80" y="1045" font-family="Georgia, serif" font-size="13" fill="#666">Treating dentist:</text>
    <rect x="220" y="1030" width="680" height="18" fill="#1a1a1a"/>
  </g>

  <!-- Diagonal stamp overlay -->
  <g transform="translate(600, 850) rotate(-13)">
    <rect x="-510" y="-180" width="1020" height="360" fill="none" stroke="#a02020" stroke-width="6" rx="20"/>
    <text x="0" y="-50" text-anchor="middle" font-family="Georgia, serif" font-size="92" font-weight="bold" fill="#a02020">The Dental Tourism</text>
    <text x="0" y="55" text-anchor="middle" font-family="Georgia, serif" font-size="92" font-weight="bold" fill="#a02020">Field Guide</text>
    <text x="0" y="125" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#a02020" letter-spacing="3" font-style="italic">What the quote does not tell you</text>
  </g>

  <!-- Editor byline -->
  <text x="600" y="1745" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f5ede0" letter-spacing="4">BERNARD HUANG, EDITOR</text>
  <text x="600" y="1778" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a8a8a8" letter-spacing="6" font-style="italic">A TABIJI FIELD GUIDE</text>
</svg>
