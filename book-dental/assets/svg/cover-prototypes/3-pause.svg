<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!-- Cream background -->
  <rect width="1200" height="1800" fill="#f4ebd9"/>

  <!-- Subtle thin border -->
  <rect x="60" y="60" width="1080" height="1680" fill="none" stroke="#1a3a4f" stroke-width="2" opacity="0.4"/>

  <!-- Top tag -->
  <text x="600" y="200" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#1a3a4f" letter-spacing="8">A 20-MINUTE SAFETY PAUSE</text>

  <!-- Central element: stylized pause symbol -->
  <g transform="translate(600, 700)">
    <rect x="-100" y="-180" width="70" height="360" fill="#1a3a4f" rx="8"/>
    <rect x="30" y="-180" width="70" height="360" fill="#1a3a4f" rx="8"/>
  </g>

  <!-- Timer beneath -->
  <text x="600" y="980" text-anchor="middle" font-family="Georgia, serif" font-size="56" fill="#1a3a4f" font-weight="300" letter-spacing="8">20:00</text>

  <!-- Decorative line -->
  <line x1="500" y1="1040" x2="700" y2="1040" stroke="#1a3a4f" stroke-width="2"/>

  <!-- Title -->
  <g font-family="Georgia, serif" fill="#1a1a1a" font-weight="bold">
    <text x="600" y="1200" text-anchor="middle" font-size="68">The Dental Tourism</text>
    <text x="600" y="1290" text-anchor="middle" font-size="68">Field Guide</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="1370" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5a5a5a" font-style="italic">Slow down. Get the plan in writing.</text>
  <text x="600" y="1410" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#5a5a5a" font-style="italic">Keep your exit options open.</text>

  <!-- Editor byline -->
  <text x="600" y="1690" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1a3a4f" letter-spacing="4">BERNARD HUANG, EDITOR</text>
  <text x="600" y="1722" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#5a5a5a" letter-spacing="5">A TABIJI FIELD GUIDE</text>
</svg>
