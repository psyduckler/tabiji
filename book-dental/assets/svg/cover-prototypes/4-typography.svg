<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!-- Cream background -->
  <rect width="1200" height="1800" fill="#f0e6d2"/>

  <!-- Top oxblood block -->
  <rect x="0" y="0" width="1200" height="220" fill="#722f37"/>
  <text x="600" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f0e6d2" letter-spacing="8">TABIJI FIELD GUIDES</text>

  <!-- Title — dominant -->
  <g font-family="Georgia, serif" fill="#1a1a1a" font-weight="bold">
    <text x="600" y="500" text-anchor="middle" font-size="120" letter-spacing="-3">The</text>
    <text x="600" y="650" text-anchor="middle" font-size="120" letter-spacing="-3">Dental</text>
    <text x="600" y="800" text-anchor="middle" font-size="120" letter-spacing="-3">Tourism</text>
    <text x="600" y="950" text-anchor="middle" font-size="120" letter-spacing="-3">Field Guide</text>
  </g>

  <!-- Divider rule -->
  <line x1="450" y1="1030" x2="750" y2="1030" stroke="#722f37" stroke-width="3"/>

  <!-- Subtitle -->
  <text x="600" y="1110" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1a1a1a" font-style="italic">A buyer-protection guide</text>
  <text x="600" y="1155" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#1a1a1a" font-style="italic">to dental care abroad</text>

  <!-- Pull quote area -->
  <g transform="translate(150, 1380)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="120" fill="#722f37" font-weight="bold">&#8220;</text>
    <text x="100" y="-30" font-family="Georgia, serif" font-size="26" fill="#3a3a3a" font-style="italic">Hope is important.</text>
    <text x="100" y="10" font-family="Georgia, serif" font-size="26" fill="#3a3a3a" font-style="italic">It is not enough to sign consent.</text>
  </g>

  <!-- Bottom oxblood block -->
  <rect x="0" y="1620" width="1200" height="180" fill="#722f37"/>
  <text x="600" y="1715" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#f0e6d2" letter-spacing="4">BERNARD HUANG</text>
  <text x="600" y="1755" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#e0c8a0" letter-spacing="6" font-style="italic">EDITOR</text>
</svg>
