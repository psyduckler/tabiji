<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <!-- Deep forest green background -->
  <rect width="1200" height="1800" fill="#1f3a2e"/>

  <!-- Top imprint band -->
  <line x1="100" y1="180" x2="1100" y2="180" stroke="#d4b87a" stroke-width="2"/>
  <text x="600" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#d4b87a" letter-spacing="8">TABIJI FIELD GUIDES</text>
  <text x="600" y="220" text-anchor="middle" font-family="Georgia, serif" font-size="14" fill="#a8c4b0" letter-spacing="6" font-style="italic">VOLUME ONE</text>

  <!-- Title block - centered, large serif -->
  <g font-family="Georgia, serif" fill="#f4ebd9" font-weight="bold">
    <text x="600" y="650" text-anchor="middle" font-size="92">The</text>
    <text x="600" y="780" text-anchor="middle" font-size="92">Dental Tourism</text>
    <text x="600" y="910" text-anchor="middle" font-size="92">Field Guide</text>
  </g>

  <!-- Decorative ornament: stylized clipboard with checkmarks -->
  <g transform="translate(540, 1010)" stroke="#d4b87a" stroke-width="3" fill="none">
    <rect x="0" y="20" width="120" height="160" rx="6"/>
    <rect x="35" y="0" width="50" height="35" rx="4" fill="#d4b87a"/>
    <line x1="20" y1="65" x2="100" y2="65" stroke-width="2"/>
    <line x1="20" y1="92" x2="80" y2="92" stroke-width="2"/>
    <line x1="20" y1="119" x2="100" y2="119" stroke-width="2"/>
    <line x1="20" y1="146" x2="70" y2="146" stroke-width="2"/>
  </g>

  <!-- Subtitle -->
  <text x="600" y="1310" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#d4b87a" font-style="italic">A buyer-protection guide</text>
  <text x="600" y="1350" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#d4b87a" font-style="italic">to dental care abroad</text>

  <!-- Bottom band -->
  <line x1="100" y1="1640" x2="1100" y2="1640" stroke="#d4b87a" stroke-width="2"/>

  <!-- Editor byline -->
  <text x="600" y="1710" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#f4ebd9" letter-spacing="4">BERNARD HUANG</text>
  <text x="600" y="1745" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#a8c4b0" letter-spacing="6" font-style="italic">EDITOR</text>
</svg>
