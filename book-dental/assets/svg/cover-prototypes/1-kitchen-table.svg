<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="1200" height="1800">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a7460"/>
      <stop offset="100%" stop-color="#5d4838"/>
    </linearGradient>
    <filter id="paperShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Wood table background -->
  <rect width="1200" height="1800" fill="url(#wood)"/>

  <!-- Subtle wood grain -->
  <g stroke="#3a2c1d" stroke-width="1" opacity="0.18">
    <line x1="0" y1="200" x2="1200" y2="195"/>
    <line x1="0" y1="450" x2="1200" y2="460"/>
    <line x1="0" y1="700" x2="1200" y2="690"/>
    <line x1="0" y1="950" x2="1200" y2="960"/>
    <line x1="0" y1="1200" x2="1200" y2="1190"/>
    <line x1="0" y1="1500" x2="1200" y2="1510"/>
  </g>

  <!-- Coffee mug ring (top right) -->
  <circle cx="1020" cy="290" r="85" fill="none" stroke="#2e2218" stroke-width="3" opacity="0.30"/>
  <circle cx="1020" cy="290" r="82" fill="none" stroke="#2e2218" stroke-width="1" opacity="0.18"/>

  <!-- Pen (lower right) -->
  <g transform="translate(940, 1620) rotate(-25)" opacity="0.85">
    <rect x="0" y="0" width="180" height="14" fill="#1a1a1a" rx="3"/>
    <polygon points="180,0 210,7 180,14" fill="#444"/>
    <rect x="10" y="0" width="40" height="14" fill="#722f37" rx="3"/>
  </g>

  <!-- The estimate document, slightly rotated -->
  <g transform="translate(110, 600) rotate(-3)" filter="url(#paperShadow)">
    <rect width="980" height="1140" fill="#f4ebe0"/>

    <!-- Letterhead -->
    <text x="60" y="65" font-family="Georgia, serif" font-size="22" fill="#1a1a1a" letter-spacing="3" font-weight="bold">TREATMENT PLAN ESTIMATE</text>
    <line x1="60" y1="85" x2="920" y2="85" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Patient info -->
    <text x="60" y="135" font-family="Georgia, serif" font-size="18" fill="#333">Patient: ________________________________</text>
    <text x="60" y="170" font-family="Georgia, serif" font-size="14" fill="#666">Date of consultation: __ / __ / 2026</text>

    <!-- Procedures -->
    <g font-family="Georgia, serif" font-size="20" fill="#1a1a1a">
      <text x="60" y="265">Comprehensive exam &amp; CBCT imaging</text>
      <text x="920" y="265" text-anchor="end">$    485</text>
      <line x1="60" y1="290" x2="920" y2="290" stroke="#999" stroke-width="0.5"/>

      <text x="60" y="330">Extractions, teeth #2, 3, 14, 15</text>
      <text x="920" y="330" text-anchor="end">$  1,840</text>
      <line x1="60" y1="355" x2="920" y2="355" stroke="#999" stroke-width="0.5"/>

      <text x="60" y="395">Bone graft (2 sites)</text>
      <text x="920" y="395" text-anchor="end">$  3,200</text>
      <line x1="60" y1="420" x2="920" y2="420" stroke="#999" stroke-width="0.5"/>

      <text x="60" y="460">Sinus lift, right</text>
      <text x="920" y="460" text-anchor="end">$  2,450</text>
      <line x1="60" y1="485" x2="920" y2="485" stroke="#999" stroke-width="0.5"/>

      <text x="60" y="525">Dental implants (6)</text>
      <text x="920" y="525" text-anchor="end">$ 18,300</text>
      <line x1="60" y1="550" x2="920" y2="550" stroke="#999" stroke-width="0.5"/>

      <text x="60" y="590">Custom abutments &amp; final zirconia bridge</text>
      <text x="920" y="590" text-anchor="end">$  6,250</text>
      <line x1="60" y1="615" x2="920" y2="615" stroke="#999" stroke-width="0.5"/>

      <text x="60" y="655">IV sedation, surgical visit</text>
      <text x="920" y="655" text-anchor="end">$    900</text>
    </g>

    <!-- Total -->
    <line x1="60" y1="730" x2="920" y2="730" stroke="#1a1a1a" stroke-width="2"/>
    <text x="60" y="800" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#1a1a1a" letter-spacing="3">TOTAL</text>
    <text x="920" y="800" text-anchor="end" font-family="Georgia, serif" font-size="46" font-weight="bold" fill="#a02020">$33,425</text>

    <!-- Footer disclaimers -->
    <text x="60" y="880" font-family="Georgia, serif" font-size="13" fill="#888" font-style="italic">This estimate is valid for 30 days. Insurance coverage subject to verification.</text>
    <text x="60" y="905" font-family="Georgia, serif" font-size="13" fill="#888" font-style="italic">Payment plans available. Additional procedures may be required after examination.</text>
  </g>

  <!-- Title overlay -->
  <g font-family="Georgia, serif" fill="#f4ebe0">
    <text x="600" y="200" text-anchor="middle" font-size="80" font-weight="bold" letter-spacing="-1">The Dental Tourism</text>
    <text x="600" y="290" text-anchor="middle" font-size="80" font-weight="bold" letter-spacing="-1">Field Guide</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#e8dcc8" font-style="italic">A buyer-protection guide to dental care abroad</text>

  <!-- Editor byline -->
  <text x="600" y="1745" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#f4ebe0" letter-spacing="3">BERNARD HUANG, EDITOR</text>
  <text x="600" y="1778" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#d4c4a8" letter-spacing="5">A TABIJI FIELD GUIDE</text>
</svg>
