<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- INDIA BACK COVER — Amar Chitra Katha 1970s-80s comic-book         -->
  <!-- Background: full-bleed Hawa Mahal rickshaw-textile scene          -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets               -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0D1620" stop-opacity="0.84"/>
      <stop offset="0.75" stop-color="#0D1620" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#0D1620" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#0D1620" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED ILLUSTRATION BACKGROUND -->
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility; lightens toward bottom -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#0D1620" fill-opacity="0.7" stroke="#E97A2C" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#E97A2C" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#FBEBC9" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#FBEBC9" opacity="0.92">
    <tspan x="60" dy="0">Silk Board auto-rickshaws run meters that tick at twice the legal rate.</tspan>
    <tspan x="60" dy="16">Paharganj &#8220;Tourism&#8221; offices rebook your trip into a $400 package.</tspan>
    <tspan x="60" dy="16">A Lake Pichola boatman quotes &#8377;200 and demands &#8377;500 per photo.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#FBEBC9" opacity="0.92">
    <tspan x="60" dy="0">This book documents 60 specific scams across 12 Indian</tspan>
    <tspan x="60" dy="15">cities &#8212; drawn from Reddit r/India, r/IndiaTravel, the</tspan>
    <tspan x="60" dy="15">Times of India, embassy advisories, and consumer-protection</tspan>
    <tspan x="60" dy="15">investigations. You&#8217;ll learn the scripts, the red flags,</tspan>
    <tspan x="60" dy="15">and the Hindi phrases that shut them down.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="320" x2="440" y2="320" stroke="#E97A2C" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#E97A2C">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#FBEBC9">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">The New Delhi Station Fake Tourist Office &#8212; and how to walk out</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">The Johari Bazaar Gem Export Pitch (&#8377;45,000 of investment glass)</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">The Mumbai Dating App Caf&#233; Bill (&#8377;61,000 at one Andheri pub in 2024)</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">The Goa Taxi Mafia &#8212; why Uber doesn&#8217;t exist there</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">The Anjuna Drug Sting and Police Bribe Setup</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#E97A2C">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#FBEBC9">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">A Hindi exit-phrase card you can screenshot</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">A post-scam recovery playbook (first 15 min, hour, day, week)</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#E97A2C"/>
      <text x="14" y="3">Emergency contacts: 112 + Tourist Police 1363 for all 12 cities</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#E97A2C" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#FBEBC9" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
