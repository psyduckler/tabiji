description: >
  Don't lose ₹50,000 in India. This book documents 60 tourist scams across
  12 Indian cities — drawn from Reddit traveler reports, the Times of India,
  News18, and Telangana Today, embassy advisories, and consumer-protection
  investigations. You'll learn the exact scripts scammers use, the red flags
  that give them away, and the Hindi phrases that shut them down. Includes
  a Hindi exit-phrase card, a post-scam recovery playbook, and emergency
  contacts for every major Indian city.

