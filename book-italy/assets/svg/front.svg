<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- warm-cream background (Italian travel-book aesthetic, same as series) -->
  <rect width="500" height="800" fill="#F5E6CE"/>
  <rect x="0" y="0" width="500" height="4" fill="#8B3A2E"/>

  <!-- Masthead -->
  <text x="250" y="48" font-family="Georgia, serif" font-size="11" letter-spacing="5" fill="#8B3A2E" text-anchor="middle">T A B I J I . A I</text>
  <text x="250" y="68" font-family="Georgia, serif" font-size="9" letter-spacing="3" fill="#8B3A2E" text-anchor="middle" opacity="0.75">TRAVEL SAFETY SERIES</text>
  <line x1="220" y1="84" x2="280" y2="84" stroke="#8B3A2E" stroke-width="0.5"/>

  <!-- LAUREL WREATH (Roman / Italian symbol, replaces Japan's sakura) -->
  <!-- Left half of wreath -->
  <g transform="translate(175 140)">
    <!-- Left arc -->
    <path d="M 0 0 Q -30 25 -55 55 Q -72 80 -75 100" fill="none" stroke="#3F5A3D" stroke-width="1.6" opacity="0.9"/>
    <g fill="#5A7548">
      <ellipse cx="-8" cy="8" rx="9" ry="3" transform="rotate(-60 -8 8)"/>
      <ellipse cx="-18" cy="20" rx="10" ry="3" transform="rotate(-55 -18 20)"/>
      <ellipse cx="-28" cy="34" rx="10" ry="3" transform="rotate(-50 -28 34)"/>
      <ellipse cx="-40" cy="50" rx="11" ry="3.2" transform="rotate(-45 -40 50)"/>
      <ellipse cx="-52" cy="67" rx="10" ry="3" transform="rotate(-40 -52 67)"/>
      <ellipse cx="-62" cy="85" rx="9" ry="3" transform="rotate(-30 -62 85)"/>
      <ellipse cx="-70" cy="102" rx="8" ry="2.6" transform="rotate(-20 -70 102)"/>
    </g>
    <g fill="#3F5A3D" opacity="0.85">
      <ellipse cx="-6" cy="14" rx="8" ry="2.6" transform="rotate(-65 -6 14)"/>
      <ellipse cx="-16" cy="28" rx="10" ry="3" transform="rotate(-60 -16 28)"/>
      <ellipse cx="-26" cy="42" rx="10" ry="3" transform="rotate(-55 -26 42)"/>
      <ellipse cx="-37" cy="58" rx="11" ry="3" transform="rotate(-50 -37 58)"/>
      <ellipse cx="-48" cy="74" rx="10" ry="3" transform="rotate(-45 -48 74)"/>
      <ellipse cx="-58" cy="92" rx="9" ry="3" transform="rotate(-35 -58 92)"/>
    </g>
    <!-- Laurel berries -->
    <g fill="#6B4A3F">
      <circle cx="-20" cy="24" r="2"/>
      <circle cx="-34" cy="44" r="2"/>
      <circle cx="-54" cy="75" r="2"/>
    </g>
  </g>

  <!-- Right half of wreath -->
  <g transform="translate(325 140)">
    <path d="M 0 0 Q 30 25 55 55 Q 72 80 75 100" fill="none" stroke="#3F5A3D" stroke-width="1.6" opacity="0.9"/>
    <g fill="#5A7548">
      <ellipse cx="8" cy="8" rx="9" ry="3" transform="rotate(60 8 8)"/>
      <ellipse cx="18" cy="20" rx="10" ry="3" transform="rotate(55 18 20)"/>
      <ellipse cx="28" cy="34" rx="10" ry="3" transform="rotate(50 28 34)"/>
      <ellipse cx="40" cy="50" rx="11" ry="3.2" transform="rotate(45 40 50)"/>
      <ellipse cx="52" cy="67" rx="10" ry="3" transform="rotate(40 52 67)"/>
      <ellipse cx="62" cy="85" rx="9" ry="3" transform="rotate(30 62 85)"/>
      <ellipse cx="70" cy="102" rx="8" ry="2.6" transform="rotate(20 70 102)"/>
    </g>
    <g fill="#3F5A3D" opacity="0.85">
      <ellipse cx="6" cy="14" rx="8" ry="2.6" transform="rotate(65 6 14)"/>
      <ellipse cx="16" cy="28" rx="10" ry="3" transform="rotate(60 16 28)"/>
      <ellipse cx="26" cy="42" rx="10" ry="3" transform="rotate(55 26 42)"/>
      <ellipse cx="37" cy="58" rx="11" ry="3" transform="rotate(50 37 58)"/>
      <ellipse cx="48" cy="74" rx="10" ry="3" transform="rotate(45 48 74)"/>
      <ellipse cx="58" cy="92" rx="9" ry="3" transform="rotate(35 58 92)"/>
    </g>
    <g fill="#6B4A3F">
      <circle cx="20" cy="24" r="2"/>
      <circle cx="34" cy="44" r="2"/>
      <circle cx="54" cy="75" r="2"/>
    </g>
  </g>

  <!-- Ribbon binding the wreath at the bottom center -->
  <g transform="translate(250 235)">
    <path d="M -8 0 L 8 0 L 6 12 L -6 12 Z" fill="#8B3A2E"/>
    <path d="M -6 12 L -14 22 L -10 14 Z" fill="#8B3A2E" opacity="0.8"/>
    <path d="M 6 12 L 14 22 L 10 14 Z" fill="#8B3A2E" opacity="0.8"/>
  </g>

  <!-- ROLLING TUSCAN HILLS in the distance (layered) -->
  <!-- Farthest hill line -->
  <path d="M 0 340 Q 100 312 200 328 Q 300 318 400 336 Q 450 340 500 332 L 500 360 L 0 360 Z" fill="#C4B597" opacity="0.75"/>
  <!-- Middle hill line with a tiny hilltop town silhouette -->
  <path d="M 0 360 Q 80 348 160 360 Q 230 348 310 368 Q 390 362 500 356 L 500 390 L 0 390 Z" fill="#A89C78" opacity="0.85"/>
  <!-- Tiny hill-town silhouette on the middle ridge -->
  <g fill="#6B4A3F" transform="translate(370 348)">
    <rect x="-14" y="2" width="4" height="10"/>
    <rect x="-8" y="0" width="5" height="12"/>
    <rect x="-1" y="-4" width="4" height="16"/>
    <polygon points="1,-10 4,-4 -2,-4"/>
    <rect x="5" y="-2" width="4" height="14"/>
    <rect x="11" y="3" width="4" height="9"/>
  </g>

  <!-- Foreground hills (warmer) -->
  <path d="M 0 390 Q 80 376 200 392 Q 320 382 500 394 L 500 430 L 0 430 Z" fill="#8B6E4B"/>

  <!-- COLOSSEUM — centered -->
  <!-- Outer oval body -->
  <path d="M 120 418 Q 120 320 250 316 Q 380 320 380 418 L 380 430 L 120 430 Z" fill="#C9A449"/>
  <!-- Interior shadow on left half (sets direction of light from right) -->
  <path d="M 120 418 Q 120 320 250 316 Q 295 318 315 334 L 315 418 Z" fill="#A06D3E" opacity="0.55"/>
  <!-- Top arcade row arches -->
  <g fill="#F5E6CE">
    <rect x="140" y="336" width="12" height="20" rx="5"/>
    <rect x="162" y="330" width="12" height="22" rx="5"/>
    <rect x="184" y="326" width="12" height="24" rx="5"/>
    <rect x="206" y="324" width="12" height="25" rx="5"/>
    <rect x="228" y="322" width="12" height="26" rx="5"/>
    <rect x="250" y="322" width="12" height="26" rx="5"/>
    <rect x="272" y="324" width="12" height="25" rx="5"/>
    <rect x="294" y="326" width="12" height="24" rx="5"/>
    <rect x="316" y="330" width="12" height="22" rx="5"/>
    <rect x="338" y="336" width="12" height="20" rx="5"/>
  </g>
  <!-- Middle arcade row arches -->
  <g fill="#F5E6CE">
    <rect x="140" y="366" width="12" height="22" rx="5"/>
    <rect x="162" y="362" width="12" height="24" rx="5"/>
    <rect x="184" y="360" width="12" height="26" rx="5"/>
    <rect x="206" y="358" width="12" height="27" rx="5"/>
    <rect x="228" y="356" width="12" height="28" rx="5"/>
    <rect x="250" y="356" width="12" height="28" rx="5"/>
    <rect x="272" y="358" width="12" height="27" rx="5"/>
    <rect x="294" y="360" width="12" height="26" rx="5"/>
    <rect x="316" y="362" width="12" height="24" rx="5"/>
    <rect x="338" y="366" width="12" height="22" rx="5"/>
  </g>
  <!-- Broken edge on right (the iconic partial ruin) -->
  <path d="M 380 318 L 380 355 L 372 358 L 366 330 L 360 360 L 352 340 L 352 320 Z" fill="#F5E6CE"/>

  <!-- UMBRELLA PINES (Pini di Roma) flanking the Colosseum -->
  <!-- Left pine -->
  <g>
    <!-- Trunk -->
    <rect x="72" y="300" width="6" height="130" fill="#6B4A3F"/>
    <!-- Canopy — wide flat umbrella shape -->
    <ellipse cx="75" cy="290" rx="60" ry="22" fill="#3F5A3D"/>
    <ellipse cx="75" cy="282" rx="50" ry="14" fill="#4D6A49" opacity="0.9"/>
    <!-- Subtle branch strokes inside the canopy -->
    <path d="M 75 300 Q 55 295 30 285" stroke="#2A3F2A" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 75 300 Q 95 295 120 285" stroke="#2A3F2A" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  <!-- Right pine -->
  <g>
    <rect x="422" y="300" width="6" height="130" fill="#6B4A3F"/>
    <ellipse cx="425" cy="290" rx="60" ry="22" fill="#3F5A3D"/>
    <ellipse cx="425" cy="282" rx="50" ry="14" fill="#4D6A49" opacity="0.9"/>
    <path d="M 425 300 Q 405 295 380 285" stroke="#2A3F2A" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M 425 300 Q 445 295 470 285" stroke="#2A3F2A" stroke-width="1" fill="none" opacity="0.4"/>
  </g>

  <!-- Ground (terracotta path) -->
  <path d="M 0 430 Q 250 420 500 430 L 500 442 L 0 442 Z" fill="#C4704B"/>

  <!-- TITLE -->
  <text x="250" y="530" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="108" fill="#2A2420" text-anchor="middle" letter-spacing="-2">ITALY</text>
  <text x="250" y="588" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#8B3A2E" text-anchor="middle">Tourist Scams &#183; 2026</text>
  <line x1="220" y1="615" x2="280" y2="615" stroke="#8B3A2E" stroke-width="0.5"/>
  <text x="250" y="638" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6A5A58" text-anchor="middle" letter-spacing="4">BY TABIJI</text>

  <!-- HOOK -->
  <text x="250" y="678" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="20" fill="#2A2420" text-anchor="middle" letter-spacing="0.5">DON&#8217;T LOSE &#8364;1,000 IN ITALY</text>
  <text x="250" y="702" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#5A4A48" text-anchor="middle" letter-spacing="1.5">149 REAL SCAMS &#183; THE EXACT PHRASES TO STOP THEM</text>

  <!-- FOOTER -->
  <line x1="130" y1="725" x2="370" y2="725" stroke="#8B3A2E" stroke-width="0.5" opacity="0.5"/>
  <text x="250" y="750" font-family="Georgia, serif" font-size="14" fill="#2A2420" text-anchor="middle" letter-spacing="1.5">20 CITIES &#183; 149 DOCUMENTED SCAMS</text>
  <text x="250" y="772" font-family="Helvetica, sans-serif" font-size="10" fill="#8B3A2E" text-anchor="middle" letter-spacing="4">2026 EDITION</text>
  <rect x="0" y="796" width="500" height="4" fill="#8B3A2E"/>
</svg>
