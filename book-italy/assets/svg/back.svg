<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="oxbloodBack" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#5A1E1A"/>
      <stop offset="1" stop-color="#3F1612"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#oxbloodBack)"/>

  <!-- Double-rule gold frame (matches front) -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#C9A449" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#C9A449" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#C9A449">T A B I J I . A I</text>
  <text x="440" y="70" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#E8C098" text-anchor="end">Travel Safety Series</text>
  <line x1="60" y1="84" x2="440" y2="84" stroke="#C9A449" stroke-width="0.5" opacity="0.7"/>

  <!-- Hero headline -->
  <text x="60" y="156" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#F5E6CE" letter-spacing="-0.3">What the guidebooks</text>
  <text x="60" y="194" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#F5E6CE" letter-spacing="-0.3">won&#8217;t tell you.</text>
  <rect x="60" y="210" width="60" height="1.8" fill="#C9A449"/>

  <!-- Italic pitch paragraph -->
  <text x="60" y="250" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="60" y="270" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">lifetime. Don&#8217;t lose a euro of it to a &#8364;14-an-hour</text>
  <text x="60" y="290" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">parking lot, a tre-campanelle shell game, or a taxi</text>
  <text x="60" y="310" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C098">from Malpensa that quoted &#8364;95 and charged &#8364;250.</text>

  <!-- Body pitch paragraph -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">This book documents 149 tourist scams across 20</text>
  <text x="60" y="368" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Italian cities &#8212; drawn from Repubblica, Corriere,</text>
  <text x="60" y="386" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Il Mattino, and Carabinieri arrest records. You&#8217;ll</text>
  <text x="60" y="404" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">learn the exact scripts scammers use, the red flags</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">that give them away, and the moves that shut them down.</text>

  <!-- Inside bullets -->
  <text x="60" y="462" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#C9A449" font-weight="700">Inside:</text>
  <circle cx="66" cy="492" r="2" fill="#C9A449"/>
  <text x="78" y="496" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The &#8364;2,500-a-day Venice pickpocket ring — and how to beat it</text>
  <circle cx="66" cy="516" r="2" fill="#C9A449"/>
  <text x="78" y="520" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Why Fiumicino taxi touts quote &#8364;50 and charge &#8364;150</text>
  <circle cx="66" cy="540" r="2" fill="#C9A449"/>
  <text x="78" y="544" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The Florence fake-leather trade (49 indicted in one Finanza bust)</text>
  <circle cx="66" cy="564" r="2" fill="#C9A449"/>
  <text x="78" y="568" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Capri&#8217;s Blue Grotto fee-stack (&#8364;15 ticket, &#8364;45 total)</text>
  <circle cx="66" cy="588" r="2" fill="#C9A449"/>
  <text x="78" y="592" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The Sardinia sand-in-your-luggage fine (&#8364;3,000 per tourist)</text>

  <!-- Gold divider -->
  <line x1="60" y1="618" x2="440" y2="618" stroke="#C9A449" stroke-width="0.5" opacity="0.6"/>

  <!-- Plus bullets (left) + QR code (right) -->
  <text x="60" y="644" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#C9A449" font-weight="700">Plus:</text>
  <circle cx="66" cy="670" r="2" fill="#C9A449"/>
  <text x="78" y="674" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Italian exit-phrase card</text>
  <circle cx="66" cy="692" r="2" fill="#C9A449"/>
  <text x="78" y="696" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Post-scam recovery playbook</text>
  <circle cx="66" cy="714" r="2" fill="#C9A449"/>
  <text x="78" y="718" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Emergency contacts for all 20 cities</text>

  <!-- Amazon barcode safe zone (blank) — KDP auto-places barcode at 2x1.2" bottom-right.
       Footer line + edition copy removed: Amazon's barcode sits at y≈720-760 and was
       overlapping "KINDLE EDITION · 2026". Bottom of back cover is now clean. -->
</svg>
