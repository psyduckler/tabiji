<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <rect width="500" height="800" fill="#F5E6CE"/>
  <rect x="0" y="0" width="500" height="4" fill="#8B3A2E"/>
  <rect x="0" y="796" width="500" height="4" fill="#8B3A2E"/>
  <text x="40" y="42" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#8B3A2E">TABIJI.AI</text>
  <text x="460" y="42" font-family="Georgia, serif" font-size="9" letter-spacing="3" fill="#8B3A2E" text-anchor="end" opacity="0.8">TRAVEL SAFETY SERIES</text>
  <line x1="40" y1="58" x2="460" y2="58" stroke="#8B3A2E" stroke-width="0.5" opacity="0.5"/>

  <!-- Small laurel sprig (matches front cover motif) -->
  <g transform="translate(460 100) scale(-1 1)">
    <path d="M 0 0 Q -20 8 -40 18 Q -55 28 -65 40" fill="none" stroke="#3F5A3D" stroke-width="1.4"/>
    <g fill="#5A7548">
      <ellipse cx="-8" cy="4" rx="8" ry="2.5" transform="rotate(-30 -8 4)"/>
      <ellipse cx="-18" cy="10" rx="9" ry="2.6" transform="rotate(-25 -18 10)"/>
      <ellipse cx="-28" cy="18" rx="9" ry="2.6" transform="rotate(-20 -28 18)"/>
      <ellipse cx="-40" cy="26" rx="9" ry="2.6" transform="rotate(-15 -40 26)"/>
      <ellipse cx="-52" cy="34" rx="8" ry="2.4" transform="rotate(-10 -52 34)"/>
      <ellipse cx="-62" cy="42" rx="7" ry="2.2" transform="rotate(-5 -62 42)"/>
    </g>
    <g fill="#3F5A3D" opacity="0.85">
      <ellipse cx="-6" cy="8" rx="7" ry="2.2" transform="rotate(-35 -6 8)"/>
      <ellipse cx="-16" cy="14" rx="8" ry="2.3" transform="rotate(-30 -16 14)"/>
      <ellipse cx="-30" cy="22" rx="8" ry="2.4" transform="rotate(-25 -30 22)"/>
      <ellipse cx="-44" cy="30" rx="8" ry="2.3" transform="rotate(-20 -44 30)"/>
    </g>
    <g fill="#6B4A3F">
      <circle cx="-20" cy="12" r="1.8"/>
      <circle cx="-36" cy="22" r="1.8"/>
    </g>
  </g>

  <!-- Headline -->
  <text x="40" y="138" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#2A2420" letter-spacing="-0.5">What the guidebooks</text>
  <text x="40" y="176" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="32" fill="#2A2420" letter-spacing="-0.5">won&#8217;t tell you.</text>
  <rect x="40" y="196" width="60" height="2" fill="#8B3A2E"/>

  <!-- Pitch -->
  <text x="40" y="237" font-family="Georgia, serif" font-size="13" fill="#3A2A28">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="40" y="257" font-family="Georgia, serif" font-size="13" fill="#3A2A28">lifetime. Don&#8217;t lose a euro of it to a &#8364;14-an-hour</text>
  <text x="40" y="277" font-family="Georgia, serif" font-size="13" fill="#3A2A28">parking lot, a tre-campanelle shell game, or a taxi</text>
  <text x="40" y="297" font-family="Georgia, serif" font-size="13" fill="#3A2A28">from Malpensa that quoted &#8364;95 and charged &#8364;250.</text>

  <text x="40" y="338" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">This book documents 149 tourist scams across 20</text>
  <text x="40" y="356" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Italian cities &#8212; drawn from Repubblica, Corriere,</text>
  <text x="40" y="374" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Il Mattino, and Carabinieri arrest records. You&#8217;ll</text>
  <text x="40" y="392" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">learn the exact scripts scammers use, the red flags</text>
  <text x="40" y="410" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">that give them away, and the moves that shut them down.</text>

  <!-- Inside bullets -->
  <text x="40" y="452" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#8B3A2E" font-weight="700">Inside:</text>
  <circle cx="48" cy="483" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="487" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">The &#8364;2,500-a-day Venice pickpocket ring &#8212; and how to beat it</text>
  <circle cx="48" cy="508" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="512" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Why Fiumicino taxi touts quote &#8364;50 and charge &#8364;150</text>
  <circle cx="48" cy="533" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="537" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">The Florence fake-leather trade (49 indicted in one Finanza bust)</text>
  <circle cx="48" cy="558" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="562" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Capri&#8217;s Blue Grotto fee-stack (&#8364;15 ticket, &#8364;45 total)</text>
  <circle cx="48" cy="583" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="587" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">The Sardinia sand-in-your-luggage fine (&#8364;3,000 per tourist)</text>

  <line x1="40" y1="625" x2="460" y2="625" stroke="#8B3A2E" stroke-width="0.5" opacity="0.5"/>

  <text x="40" y="651" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#8B3A2E" font-weight="700">Plus:</text>
  <circle cx="48" cy="673" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="677" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Italian exit-phrase card</text>
  <circle cx="48" cy="695" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="699" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Post-scam recovery playbook</text>
  <circle cx="48" cy="717" r="2.5" fill="#8B3A2E"/>
  <text x="60" y="721" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#3A2A28">Emergency contacts for all 20 cities</text>

  <!-- Subtle Tuscan-hill silhouette under the QR area (ties palette to front cover) -->
  <path d="M 340 720 Q 390 712 440 718 Q 470 716 500 722 L 500 735 L 340 735 Z" fill="#A89C78" opacity="0.3"/>

  <!-- QR code placeholder box (replaced at build time by a real QR PNG) -->
  <rect x="355" y="645" width="80" height="80" fill="#F5E6CE" stroke="#8B3A2E" stroke-width="0.8" opacity="0.8"/>
  <text x="395" y="682" font-family="Georgia, serif" font-size="9" fill="#8B3A2E" text-anchor="middle" opacity="0.6">QR</text>
  <text x="395" y="696" font-family="Helvetica, sans-serif" font-size="7" fill="#8B3A2E" text-anchor="middle" opacity="0.6">tabiji.ai/books</text>
  <text x="395" y="738" font-family="Georgia, serif" font-size="9" letter-spacing="3" fill="#8B3A2E" text-anchor="middle">SCAN FOR UPDATES</text>

  <!-- Footer row -->
  <g transform="translate(40, 745)" opacity="0.6">
    <text x="0" y="14" font-family="Georgia, serif" font-size="11" font-style="italic" fill="#8B3A2E">Buon viaggio.</text>
    <text x="0" y="30" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#3A2A28" letter-spacing="1.5">SCAN FOR UPDATES &#8594;</text>
  </g>
  <text x="85" y="790" font-family="Helvetica, sans-serif" font-size="7" fill="#3A2A28" text-anchor="middle" letter-spacing="2">KINDLE EDITION &#183; ASIN ASSIGNED AT PUBLICATION</text>
  <text x="460" y="760" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#8B3A2E" text-anchor="end">TABIJI.AI</text>
  <text x="460" y="776" font-family="Helvetica, sans-serif" font-size="9" fill="#3A2A28" text-anchor="end" letter-spacing="1">tabiji.ai/scams</text>
  <text x="460" y="790" font-family="Helvetica, sans-serif" font-size="8" fill="#3A2A28" text-anchor="end" letter-spacing="2">2026 EDITION</text>
</svg>
