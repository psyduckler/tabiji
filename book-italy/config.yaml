title: "Italy Tourist Scams 2026"
subtitle: "149 Real Scams Across Rome, Venice, Florence & 17 More Cities — Drawn from Italian News Reports and Police Arrest Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €1,000 in Italy. This book documents 149 tourist scams across
  20 Italian cities — drawn from Italian news reports (Repubblica, Corriere,
  Il Mattino, Gazzetta del Sud, La Nuova Sardegna), official arrest records,
  and real traveler accounts. You'll learn the exact scripts scammers use,
  the red flags that give them away, and the Italian phrases that shut them
  down. Includes an Italian exit-phrase card, a post-scam recovery playbook,
  and emergency contacts for every major Italian city.

# Cities in intended reading order
# Grand Tour core → major cities → Tuscany → Amalfi region → Liguria → Veneto/lakes → islands/south
cities:
  - rome
  - venice
  - florence
  - milan
  - naples
  - bologna
  - palermo
  - pisa
  - siena
  - sorrento
  - positano
  - amalfi-coast
  - capri
  - pompeii
  - cinque-terre
  - verona
  - lake-garda
  - lake-como
  - sardinia
  - taormina

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../app/data/scams

# Output
output_dir: build
output_filename: italy-scams

# Wraparound spine + bleed colors — should match the cover palette so trim
# drift doesn't produce a contrasting stripe. Italy uses oxblood
# (#5A1E1A → #3F1612, same as the front/back cover gradient).
bleed_colors:
  - "#5A1E1A"
  - "#3F1612"
