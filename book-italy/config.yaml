title: "Italy Tourist Scams 2026"
subtitle: "149 Real Scams Across Rome, Venice, Florence & 17 More Cities — The Exact Italian Phrases to Stop Them Before They Cost You €1,000+"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €1,000+ in Italy. This book documents 149 tourist scams across
  20 Italian cities — drawn from Italian news reports (Repubblica, Corriere,
  Il Mattino, Gazzetta del Sud, La Nuova Sardegna), official arrest records,
  and real traveler accounts. You'll learn the exact scripts scammers use,
  the red flags that give them away, and the Italian phrases that shut them
  down. Includes an Italian exit-phrase card, a post-scam recovery playbook,
  and emergency contacts for every major Italian city.

