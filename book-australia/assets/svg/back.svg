<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ausScrim" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0E5573" stop-opacity="0.78"/>
      <stop offset="0.55" stop-color="#0E5573" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a0a04" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Wavespeed-generated back cover artwork (Sydney Harbour evening with Opera
       House + Harbour Bridge + dusky-purple sky for back-copy negative space).
       build.py inlines this as a base64 data URI before rsvg-convert renders. -->
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800" preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-bleed scrim — keeps the dense back-cover copy legible while letting
       the watercolor artwork show through as a moody atmospheric backdrop. -->
  <rect x="0" y="0" width="500" height="800" fill="url(#ausScrim)"/>

  <!-- Cream double-rule frame (matches front) -->
  <rect x="20" y="20" width="460" height="760" fill="none" stroke="#F5E6CE" stroke-width="1" opacity="0.7"/>
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#F5E6CE" stroke-width="0.4" opacity="0.45"/>

  <!-- Masthead -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#F5E6CE">T A B I J I . A I</text>
  <text x="440" y="70" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#FFDDA6" text-anchor="end">Travel Safety Series</text>
  <line x1="60" y1="84" x2="440" y2="84" stroke="#F5E6CE" stroke-width="0.5" opacity="0.7"/>

  <!-- Hero headline -->
  <text x="60" y="156" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">What the guidebooks</text>
  <text x="60" y="194" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">won&#8217;t tell you.</text>
  <rect x="60" y="210" width="60" height="1.8" fill="#F5E6CE"/>

  <!-- Italic pitch paragraph -->
  <text x="60" y="250" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="60" y="270" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">lifetime. Don&#8217;t lose a dollar of it to a Sydney Airport</text>
  <text x="60" y="290" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">taxi &#8220;top-up,&#8221; a Gold Coast timeshare, or a fake</text>
  <text x="60" y="310" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFDDA6">Airbnb that eats AUD $3,266 before you land.</text>

  <!-- Body pitch paragraph -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">This book documents 84 tourist scams across 14</text>
  <text x="60" y="368" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Australian cities &#8212; sourced from r/sydney,</text>
  <text x="60" y="386" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">r/melbourne, ScamWatch, and state police warnings.</text>
  <text x="60" y="404" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">You&#8217;ll learn the exact scripts scammers use, the red</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">flags that give them away, and the moves that shut them down.</text>

  <!-- Inside bullets -->
  <text x="60" y="462" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#F5E6CE" font-weight="700">Inside:</text>
  <circle cx="66" cy="492" r="2" fill="#F5E6CE"/>
  <text x="78" y="496" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Sydney Airport taxi &#8220;top-up&#8221; scam (1,700 upvote thread)</text>
  <circle cx="66" cy="516" r="2" fill="#F5E6CE"/>
  <text x="78" y="520" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Why Melbourne Airport installed &#8220;fake taxi&#8221; warning signs</text>
  <circle cx="66" cy="540" r="2" fill="#F5E6CE"/>
  <text x="78" y="544" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Gold Coast timeshare trap (64-year contract lock-ins)</text>
  <circle cx="66" cy="564" r="2" fill="#F5E6CE"/>
  <text x="78" y="568" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">SIXT phantom damage charges ($1,040 to $6,500 documented)</text>
  <circle cx="66" cy="588" r="2" fill="#F5E6CE"/>
  <text x="78" y="592" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Fake Aboriginal art &#8212; how to buy authentic in Alice Springs</text>

  <!-- Divider -->
  <line x1="60" y1="618" x2="440" y2="618" stroke="#F5E6CE" stroke-width="0.5" opacity="0.6"/>

  <!-- Plus bullets (left) — no QR (Amazon reserves bottom-right for ISBN barcode) -->
  <text x="60" y="644" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#F5E6CE" font-weight="700">Plus:</text>
  <circle cx="66" cy="670" r="2" fill="#F5E6CE"/>
  <text x="78" y="674" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Australian exit-phrase card</text>
  <circle cx="66" cy="692" r="2" fill="#F5E6CE"/>
  <text x="78" y="696" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Post-scam recovery playbook</text>
  <circle cx="66" cy="714" r="2" fill="#F5E6CE"/>
  <text x="78" y="718" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Emergency contacts for all 14 cities</text>

  <!-- Amazon barcode safe zone (blank) — KDP auto-places barcode at 2x1.2" bottom-right. -->
</svg>
