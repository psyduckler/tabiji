title: "Saudi Arabia Tourist Scams 2026"
subtitle: "64 Real Scams Across Riyadh, Jeddah, Mecca, AlUla & 6 More Cities — Drawn from Reddit Reports, Saudi News, and Embassy Advisories"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose 2,000 riyals in Saudi Arabia. This book documents 64 tourist scams
  across 10 Saudi cities — drawn from Reddit traveler reports, Saudi press (Arab
  News, Saudi Gazette, Gulf News), embassy advisories, and consumer-protection
  cases. As the Kingdom opens to tourism under Vision 2030, you'll learn the
  exact scripts scammers use, the red flags that give them away, and the Arabic
  phrases that shut them down — from Hegra ticket resellers in AlUla and fake
  NEOM job offers in Tabuk to Hajj-package fraud, gold-souq switches, and the
  broken-meter taxi. Includes a Saudi Arabic exit-phrase card, a post-scam
  recovery playbook, and emergency contacts for every major Saudi city.

# Cities in intended reading order
# Capital (Najd) -> Hejaz pilgrimage corridor (west) -> northwest heritage ->
# south (Asir) -> east (Gulf coast)
cities:
  - riyadh
  - jeddah
  - mecca
  - medina
  - taif
  - alula
  - tabuk
  - abha
  - dammam
  - al-khobar

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: saudi-arabia-scams

# Wraparound spine + bleed colors — match the Al-Qatt Al-Asiri folk palette
# (terracotta red + emerald green).
bleed_colors:
  - "#B5402F"
  - "#2F6E4F"
