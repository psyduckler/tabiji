<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- SAUDI ARABIA FRONT COVER — Al-Qatt Al-Asiri folk-comic           -->
  <!-- Background: full-bleed Hegra/AlUla cast scene                     -->
  <!-- Title overlays directly on the sky (no top wash); masthead is     -->
  <!-- light so it reads over the indigo sky.                            -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1F2A3A" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#1F2A3A" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#0D1620" stop-opacity="0.96"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED ILLUSTRATION BACKGROUND -->
  <image xlink:href="front.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- MASTHEAD (light, reads over the indigo sky; nudged below the top border) -->
  <text x="250" y="56" font-family="Georgia, serif" font-size="10"
        letter-spacing="6" fill="#E0C088" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="66" x2="290" y2="66" stroke="#E0C088" stroke-width="0.4" opacity="0.8"/>
  <text x="250" y="78" font-family="Georgia, serif" font-style="italic" font-size="10"
        fill="#FBEBC9" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="90" font-family="Georgia, serif" font-size="8"
        letter-spacing="4" fill="#E0C088" text-anchor="middle" opacity="0.95">VISION 2030 EDITION</text>

  <!-- TITLE — chunky display serif, cream-stroked for readability against the sky -->
  <text x="250" y="134" font-family="Georgia, serif" font-weight="700" font-size="42"
        fill="#1F2A3A" text-anchor="middle" letter-spacing="-1"
        style="paint-order: stroke; stroke: #FBEBC9; stroke-width: 4.5px;">SAUDI ARABIA</text>

  <!-- Ornamental Al-Qatt geometric rule (terracotta red + emerald green) -->
  <g transform="translate(250 158)">
    <rect x="-95" y="-0.8" width="190" height="1.6" fill="#B5402F"/>
    <g>
      <polygon points="-14,-4 -10,0 -14,4 -18,0" fill="#2F6E4F"/>
      <polygon points="0,-5 4,0 0,5 -4,0" fill="#B5402F"/>
      <polygon points="14,-4 18,0 14,4 10,0" fill="#2F6E4F"/>
    </g>
  </g>

  <!-- Italic subtitle -->
  <text x="250" y="186" font-family="Georgia, serif" font-style="italic" font-size="22"
        fill="#1F2A3A" text-anchor="middle"
        style="paint-order: stroke; stroke: #FBEBC9; stroke-width: 3px;">Tourist Scams</text>

  <!-- BOTTOM BAND: dark gradient for hook block legibility -->
  <rect x="0" y="600" width="500" height="200" fill="url(#bottomBand)"/>

  <!-- STAT BADGE — cream-on-dark for contrast — tucked inside the hook band -->
  <g transform="translate(250 648)">
    <rect x="-72" y="-18" width="144" height="34" fill="none"
          stroke="#C9A24A" stroke-width="1.1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="19"
          fill="#FBEBC9" text-anchor="middle">64</text>
    <text x="0" y="11" font-family="Georgia, serif" font-size="7"
          fill="#C9A24A" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- HOOK -->
  <line x1="60" y1="684" x2="440" y2="684" stroke="#C9A24A" stroke-width="0.5" opacity="0.7"/>
  <text x="250" y="710" font-family="Georgia, serif" font-weight="700" font-size="19"
        fill="#FBEBC9" text-anchor="middle">Don&#8217;t Lose 2,000 Riyals in Saudi Arabia</text>
  <text x="250" y="732" font-family="Georgia, serif" font-style="italic" font-size="11.5"
        fill="#FBEBC9" text-anchor="middle" opacity="0.92">Drawn from Reddit reports and embassy advisories.</text>
  <line x1="60" y1="746" x2="440" y2="746" stroke="#C9A24A" stroke-width="0.5" opacity="0.7"/>

  <!-- FOOTER -->
  <text x="250" y="768" font-family="Georgia, serif" font-size="10"
        fill="#FBEBC9" text-anchor="middle" letter-spacing="4">10 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>
