<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- BRAZIL BACK COVER — Aldemir Martins folk-modernist aesthetic    -->
  <!-- Background: full-bleed Aldemir Martins Brazil scene             -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets             -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050e20" stop-opacity="0.86"/>
      <stop offset="0.75" stop-color="#050e20" stop-opacity="0.82"/>
      <stop offset="0.85" stop-color="#050e20" stop-opacity="0.68"/>
      <stop offset="1" stop-color="#050e20" stop-opacity="0.42"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED BACKGROUND (reuses front.jpg if back.jpg not supplied) -->
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#050e20" fill-opacity="0.7" stroke="#d4a628" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#d4a628" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#f4e6a8" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#f4e6a8" opacity="0.92">
    <tspan x="60" dy="0">Rio runs one of the most rehearsed &#8220;Special Taxi&#8221; scripts in the world.</tspan>
    <tspan x="60" dy="16">Salvador&#8217;s Pelourinho has a forced-tip ribbon that catches even experienced travelers.</tspan>
    <tspan x="60" dy="16">Recife has a documented shark-attack beach &#8212; read before you swim.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="226" font-family="Georgia, serif" font-size="11.5"
        fill="#f4e6a8" opacity="0.92">
    <tspan x="60" dy="0">This book documents 72 specific scams across 12 Brazilian cities</tspan>
    <tspan x="60" dy="15">&#8212; drawn from DEATUR tourist-police records, PROCON consumer-</tspan>
    <tspan x="60" dy="15">protection advisories, IBAMA and CEMIT decrees, and real r/Brazil</tspan>
    <tspan x="60" dy="15">traveler reports. You&#8217;ll learn the exact scripts scammers use, the</tspan>
    <tspan x="60" dy="15">red flags that give them away, and the Brazilian Portuguese phrases</tspan>
    <tspan x="60" dy="15">that shut them down on the spot.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="338" x2="440" y2="338" stroke="#d4a628" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="358" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#d4a628">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#f4e6a8">
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">72 scams with exact Portuguese scripts and R$ amounts</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Six universal red-flag patterns covering every scam in Brazil</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">A four-panel Aldemir Martins folk-modernist comic for every scam</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Coverage of Rio, S&#227;o Paulo, Salvador, Manaus, Bras&#237;lia &amp; 7 more</text>
    </g>
    <g transform="translate(60 452)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Portuguese phrases for the moment, with Brazilian pronunciation</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="482" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#d4a628">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#f4e6a8">
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">A Brazilian Portuguese exit-phrase card for your phone</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Post-scam recovery playbook with PIX MED and DEATUR escalation</text>
    </g>
    <g transform="translate(60 538)">
      <polygon points="0,0 5,-3 5,3" fill="#d4a628"/>
      <text x="14" y="3">Emergency contacts: 190 / 192 / 151 + every major hospital</text>
    </g>
  </g>

  <line x1="60" y1="566" x2="440" y2="566" stroke="#d4a628" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#f4e6a8" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
