<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- USA FRONT COVER — Silver-Age American comic style                 -->
  <!-- Background: full-bleed US street-scam hero scene                  -->
  <!-- with text overlays in the upper sky + lower semi-transparent band -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1F3A66" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#1F3A66" stop-opacity="0.80"/>
      <stop offset="1" stop-color="#0D1B33" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FBF3E2" stop-opacity="0.93"/>
      <stop offset="1" stop-color="#FBF3E2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED ILLUSTRATION BACKGROUND -->
  <image xlink:href="front.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- TOP BAND: soft cream gradient over the sky for title legibility -->
  <rect x="0" y="0" width="500" height="200" fill="url(#topBand)"/>

  <!-- MASTHEAD -->
  <text x="250" y="40" font-family="Georgia, serif" font-size="10"
        letter-spacing="6" fill="#B22234" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="52" x2="290" y2="52" stroke="#B22234" stroke-width="0.4" opacity="0.7"/>
  <text x="250" y="68" font-family="Georgia, serif" font-style="italic" font-size="10"
        fill="#1F3A66" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="82" font-family="Georgia, serif" font-size="8"
        letter-spacing="5" fill="#B22234" text-anchor="middle" opacity="0.95">UNITED STATES</text>

  <!-- TITLE — chunky display serif, cream-stroked for readability against sky -->
  <text x="250" y="138" font-family="Georgia, serif" font-weight="700" font-size="58"
        fill="#1F3A66" text-anchor="middle" letter-spacing="-1"
        style="paint-order: stroke; stroke: #FBF3E2; stroke-width: 4px;">USA</text>

  <!-- Ornamental star rule (red + navy) -->
  <g transform="translate(250 160)">
    <rect x="-90" y="-0.8" width="180" height="1.6" fill="#B22234"/>
    <g fill="#B22234">
      <polygon points="-14,-3.2 -13.0,-0.9 -10.6,-0.9 -12.5,0.6 -11.7,3.0 -14,1.5 -16.3,3.0 -15.5,0.6 -17.4,-0.9 -15.0,-0.9"/>
      <polygon points="0,-4 1.2,-1.1 4.2,-1.1 1.8,0.8 2.8,3.8 0,1.9 -2.8,3.8 -1.8,0.8 -4.2,-1.1 -1.2,-1.1"/>
      <polygon points="14,-3.2 15.0,-0.9 17.4,-0.9 15.5,0.6 16.3,3.0 14,1.5 11.7,3.0 12.5,0.6 10.6,-0.9 13.0,-0.9"/>
    </g>
  </g>

  <!-- Italic subtitle -->
  <text x="250" y="186" font-family="Georgia, serif" font-style="italic" font-size="22"
        fill="#1F3A66" text-anchor="middle"
        style="paint-order: stroke; stroke: #FBF3E2; stroke-width: 3px;">Tourist Scams</text>

  <!-- BOTTOM BAND: dark gradient for hook block legibility -->
  <rect x="0" y="600" width="500" height="200" fill="url(#bottomBand)"/>

  <!-- STAT BADGE — cream-on-dark for contrast — tucked inside the hook band -->
  <g transform="translate(250 648)">
    <rect x="-72" y="-18" width="144" height="34" fill="none"
          stroke="#E8B23A" stroke-width="1.1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="19"
          fill="#FBF3E2" text-anchor="middle">238</text>
    <text x="0" y="11" font-family="Georgia, serif" font-size="7"
          fill="#E8B23A" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- HOOK -->
  <line x1="70" y1="684" x2="430" y2="684" stroke="#E8B23A" stroke-width="0.5" opacity="0.7"/>
  <text x="250" y="710" font-family="Georgia, serif" font-weight="700" font-size="21"
        fill="#FBF3E2" text-anchor="middle">Don&#8217;t Lose $500 in the USA</text>
  <text x="250" y="732" font-family="Georgia, serif" font-style="italic" font-size="11.5"
        fill="#FBF3E2" text-anchor="middle" opacity="0.92">Drawn from Reddit reports, local news &#38; police advisories.</text>
  <line x1="70" y1="746" x2="430" y2="746" stroke="#E8B23A" stroke-width="0.5" opacity="0.7"/>

  <!-- FOOTER -->
  <text x="250" y="768" font-family="Georgia, serif" font-size="10"
        fill="#FBF3E2" text-anchor="middle" letter-spacing="4">41 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>
