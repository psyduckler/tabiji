title: "United States Tourist Scams 2026"
subtitle: "238 Real Scams Across 41 US Cities — From Times Square to the Vegas Strip, Drawn from Reddit Reports, Local News & Police Advisories"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $500 on your US trip. This book documents 238 tourist scams
  across 41 American cities — drawn from Reddit traveler reports, local TV
  news investigations (KXAN, FOX, ABC affiliates), police advisories, and
  consumer-protection alerts. You'll learn the exact scripts scammers use,
  the red flags that give them away, and the official channels (911, the FTC,
  the FBI's IC3, and state attorneys general) that shut them down. Includes a
  red-flag pattern guide, a post-scam recovery playbook, and emergency
  contacts for every major US destination.

