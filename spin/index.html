
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Globe | tabiji.ai</title>
    <meta name="description" content="Cure your indecisiveness. Spin a wheel of 100+ global destinations and let fate decide your next adventure.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D7QHNRXLHJ"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-D7QHNRXLHJ');</script>
    <style>
        :root { --indigo: #2D3A5C; --terracotta: #C4704B; --warm-cream: #F5F0E8; --sand: #E8DFD0; --earth: #8B7355; --white: #FEFCF9; --text: #2C2419; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background-color: var(--warm-cream); color: var(--text); display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        .spinner-container { position: relative; width: 500px; height: 500px; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background-color: var(--sand); border: 10px solid var(--white); box-shadow: 0 0 0 10px var(--sand), 0 10px 40px rgba(0,0,0,0.15); position: relative; transition: transform 6s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .segment { position: absolute; width: 50%; height: 100%; left: 50%; transform-origin: 0 50%; clip-path: polygon(0 0, 100% 50%, 0 100%); display: flex; align-items: center; justify-content: center; }
        .segment span { display: block; transform: rotate(-90deg) translate(-100px); color: var(--earth); font-weight: 600; font-size: 14px; white-space: nowrap; }
        .pointer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -100%); width: 0; height: 0; border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 40px solid var(--terracotta); z-index: 10; }
        .spin-button { background: var(--indigo); color: white; padding: 15px 40px; border-radius: 100px; text-decoration: none; font-weight: 600; display: inline-block; margin-top: -50px; z-index: 20; cursor: pointer; border: 5px solid white; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .result-card { display: none; background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); text-align: center; max-width: 400px; z-index: 30; }
        .result-card h2 { color: var(--indigo); margin-top: 0; }
        .result-card p { color: var(--earth); }
        .result-card .cta { background: var(--terracotta); color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 500; display: inline-block; margin-top: 10px; }
        @media (max-width: 600px) { .spinner-container { transform: scale(0.7); } .spin-button { margin-top: -80px; } }
    </style>
</head>
<body>
    <div class="spinner-container">
        <div class="wheel" id="wheel"></div>
        <div class="pointer"></div>
    </div>
    <button class="spin-button" id="spin-button">Spin the Globe</button>

    <div class="result-card" id="result-card">
        <h2 id="result-name"></h2>
        <p id="result-description"></p>
        <a href="" id="result-link" class="cta">Get a Free Itinerary</a>
        <button id="spin-again" style="background:transparent; border: 2px solid var(--sand); color: var(--earth); padding: 8px 18px; border-radius: 8px; margin-top: 10px; cursor:pointer;">Spin Again</button>
    </div>

    <script>
        const destinations = [
            { name: "Kyoto", description: "Ancient temples, serene gardens, and traditional geishas." },
            { name: "Buenos Aires", description: "The 'Paris of South America', famous for tango, steak, and vibrant culture." },
            { name: "Marrakech", description: "A sensory overload of bustling souks, exotic spices, and stunning riads." },
            { name: "Lisbon", description: "Historic trams, Fado music, and delicious pastéis de nata." },
            { name: "Hanoi", description: "A chaotic blend of motorbikes, French colonial architecture, and incredible street food." },
            { name: "Mexico City", description: "A sprawling metropolis with world-class museums, ancient ruins, and a legendary food scene." },
            { name: "Cape Town", description: "Where mountains meet the ocean, with stunning hikes, wineries, and complex history." },
            { name: "Seoul", description: "A hyper-modern city where K-pop, cutting-edge technology, and ancient palaces collide." },
            { name: "Prague", description: "A fairytale city of gothic cathedrals, cobblestone streets, and a famous astronomical clock." },
            { name: "Istanbul", description: "The city where East meets West, with epic history, grand mosques, and bustling bazaars." },
        ];

        const wheel = document.getElementById('wheel');
        const spinButton = document.getElementById('spin-button');
        const resultCard = document.getElementById('result-card');
        const segmentCount = destinations.length;
        const segmentAngle = 360 / segmentCount;

        destinations.forEach((dest, i) => {
            const segment = document.createElement('div');
            segment.classList.add('segment');
            segment.style.transform = `rotate(${i * segmentAngle}deg)`;
            segment.style.backgroundColor = i % 2 === 0 ? 'var(--white)' : 'var(--sand)';
            segment.innerHTML = `<span>${dest.name}</span>`;
            wheel.appendChild(segment);
        });

        let isSpinning = false;
        let currentRotation = 0;

        spinButton.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;

            const spinRounds = Math.floor(Math.random() * 5) + 5; // 5-9 full rotations
            const randomIndex = Math.floor(Math.random() * segmentCount);
            const targetAngle = (spinRounds * 360) + (randomIndex * -segmentAngle) - (segmentAngle / 2);
            
            currentRotation = targetAngle;
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const selected = destinations[randomIndex];
                document.getElementById('result-name').textContent = selected.name;
                document.getElementById('result-description').textContent = selected.description;
                document.getElementById('result-link').href = `https://tabiji.ai/plan?destination=${encodeURIComponent(selected.name)}`;
                resultCard.style.display = 'block';
                spinButton.style.display = 'none';
            }, 6200);
        });
        
        document.getElementById('spin-again').addEventListener('click', () => {
            isSpinning = false;
            resultCard.style.display = 'none';
            spinButton.style.display = 'inline-block';
        });

    </script>
</body>
</html>
