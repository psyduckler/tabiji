# Page Anatomy — the 15-section structure for every /scams/everywhere/<slug>/ page
#
# Order matters. Each section's `slot` is the canonical name; `required` and
# `optional` enumerate the fields the slot consumes. `max_words` is a soft
# cap (Pass 1 / Pass 8 will warn if exceeded). `class` is the CSS class to
# apply (all pre-existing in scams.css or in the page-specific <style> block
# from the pig-butchering page).

sections:

  - slot: hero
    class: hero
    required:
      - eyebrow         # "🚨 Scam Guide · 2026 · Everywhere"
      - headline        # "<N> Scam Variants and the Script Behind Them"
      - subhead         # "$X stolen from <demographic>. <one-sentence framing>."
      - byline          # Bernard Huang (default)
      - channel_meta    # "💬 Channels: <list>"
      - page_meta_row   # demographic + median-loss pills (replaces severity_pills as of 2026-04-29 audit)
      - reading_time    # auto-computed from word count
    optional:
      - hero_image      # leave empty for text-only first pass
    notes:
      page_meta_row: |
        Use 2-3 .page-meta-pill items, each with an emoji + bolded label
        + value. The audit on 2026-04-29 found that the previous
        severity_pills slot ("5 High Risk") said the same thing on 4 of
        5 pages and conveyed nothing. Replace with informative metrics:
          - 🎯 Target: <demographic>  (e.g. "60+ adults · 5x more likely")
          - 📈 Median loss / Older losses 2024 / Total losses 2024
          - 📉 Loss range or other page-specific magnitude
        Each pill must cite its source inline. The row is horizontally
        centered in the hero (justify-content: center on the .page-meta-row
        flex container in scams.css — do not override). See
        tech-support-scams for a working reference.

  - slot: tldr_card
    class: safety-box tldr-box
    required:
      - title            # "📌 The 30-Second Version"
      - body             # ≤80 words; AEO-snippet-targeted
    max_words: 80

  - slot: safety_rules
    class: safety-box
    required:
      - title           # "⚡ Quick Safety Rules"
      - rules           # exactly 5 ordered rules
    rule_count: 5
    rule_max_words: 50

  - slot: self_assessment
    class: assessment-box
    required:
      - title           # "🪞 Am I in this script right now?"
      - intro           # one-sentence framing
      - questions       # 3-5 yes/no questions
      - verdict         # "2+ yes: <action>"
      - skip_link       # → action grid
    question_count: [3, 5]

  - slot: toc
    class: toc
    required:
      - title           # "Jump to a Variant"
      - items           # one per variant, with severity badge
    auto_generated: true

  - slot: hook_story
    class: hook-section
    required:
      - heading         # specific not bland — "The Anatomy of a $X Loss" preferred
      - body_paragraphs # 2-3 paragraphs, real verbatim Reddit content (anonymized OK, no fabrication)
      - source_link     # the canonical Reddit thread cited at end
    min_words: 100
    max_words: 250
    voice: third_person
    rule: must_use_real_reddit_content_not_composite

  - slot: definition
    class: section-heading + body
    required:
      - heading         # "What This Scam Actually Is"
      - etymology       # if applicable (pig-butchering uses 杀猪盘); skip if not
      - mechanism_phases # ordered list of phases (Entry/Fattening/Pivot/Trap was 4 for pig-butchering)
      - intelligence_caveat  # "Why this works on intelligent people"
    optional:
      - glossary        # collapsed <details> with terms
    max_words: 600

  - slot: variants
    class: scam-card (per variant)
    required:
      - count           # determined by Stage 1 cluster output (3-8 range)
      - micro_template  # see variant-template.yaml
    transition_lines: required_between_variants

  - slot: numbers_section
    class: section-heading + stat-strip
    required:
      - heading         # "The Numbers (and Where They Come From)"
      - intro           # one paragraph framing verified vs estimated
      - stat_cards      # 4 cards, each with verbatim source, ✓verified or ⚠estimated label
      - context_paragraph # additional stats (DOJ seizure, etc.)
    stat_card_count: [3, 5]

  - slot: ethical_context_sidebar
    class: context-sidebar
    required:
      - heading         # "📌 Where the script runs from, and why it matters"
      - body            # 2-4 paragraphs on the operational infrastructure
    skip_if: not_applicable_to_scam_type
    note: |
      Required for scams with organized-crime / trafficking / industrial
      infrastructure (pig-butchering, BEC, AI voice clone). Skip for
      individual-scammer scams (gift card, sextortion).

  - slot: recovery_section
    class: section-heading + body
    required:
      - heading         # "Recovery Reality" or similar
      - body_paragraphs # 3-4 paragraphs covering: realistic recovery rate, narrow window, what bank fraud teams can do, legitimate recovery paths
    max_words: 500

  - slot: how_to_help
    class: section-heading + help-list
    required:
      - heading         # "How to Help Someone in the Script"
      - intro           # one paragraph framing
      - steps           # 4-5 ordered steps
      - warnings        # "Two warnings" closing paragraph
    step_count: [4, 5]
    skip_if: scam_does_not_target_others_via_proxy

  - slot: action_grid
    class: action-section + action-grid
    required:
      - heading         # "🆘 What to Do If You've Been <Verbed>"
      - cells           # 6 action cells
    cell_count: 6
    cells_required:
      - report_to_ic3
      - call_bank_fraud_line
      - file_with_ftc_state_ag
      - block_recovery_dms
      - aps_if_elderly
      - share_your_story

  - slot: book_mid_cta
    class: book-mid-cta
    required:
      - cover_or_emoji  # cover img if available, else emoji placeholder
      - eyebrow         # "📖 Coming Soon · tabiji.ai General Scams"
      - headline        # one-sentence pitch tied to the page topic
      - meta            # price + "Notify me →" mailto link
      - button          # "See current titles →" linking /books/
    placement: directly_after_action_grid
    notes: |
      Added 2026-04-29 per Tier 4 audit. The single book-end-cta at the
      bottom of a 14-min read missed the highest-intent moment, which is
      right after the "🆘 What to Do" action grid. The mid-CTA must be
      visually lighter than the book-end-cta (single row, ~110px tall on
      desktop). Use the .book-mid-cta component already in scams.css.

      MARKUP RULE (caught 2026-04-29 — broken card on all 5 pages):
      The General Scams Coming-Soon variant has TWO clickable elements
      (an inline "Notify me →" mailto link + a "See current titles →"
      button). Nesting the mailto <a> inside an outer <a> breaks the
      HTML — browsers auto-close the outer anchor and the rest of the
      card renders as orphaned siblings. Use this exact structure:

        <div class="book-mid-cta">
          <div class="book-mid-cta-cover" aria-hidden="true" style="...">📖</div>
          <div class="book-mid-cta-body">
            <div class="book-mid-cta-eyebrow">📖 Coming Soon · tabiji.ai General Scams</div>
            <div class="book-mid-cta-headline">[page-specific pitch]</div>
            <div class="book-mid-cta-meta">$4.99 on Kindle when it ships · <a href="mailto:hello@tabiji.ai?subject=...">Notify me →</a></div>
          </div>
          <a href="/books/" class="book-mid-cta-btn">See current titles →</a>
        </div>

      Note: outer is <div>, NOT <a>. The button-styled element is an <a>
      (the explicit click target). The "Notify me" mailto is a normal
      inline link inside the meta line. NEVER use <a class="book-mid-cta">
      when the body contains another <a>.

      The tourist-scam (single-action) variant uses <a class="book-mid-cta">
      with a <span class="book-mid-cta-btn"> — that pattern is fine
      because there's no nested anchor.

  - slot: international_reporting
    class: section-heading + intl-list
    required:
      - heading         # "If You're Reporting Outside the United States"
      - intro           # one paragraph
      - items           # UK, Canada, Australia, EU at minimum
    items_required:
      - united_kingdom  # Action Fraud
      - canada          # CAFC
      - australia       # Scamwatch
      - european_union  # Europol + national equivalents

  - slot: faq
    class: faq-section
    required:
      - heading
      - questions       # 8-10 Q's; first 3 must match FAQ schema
    answer_max_words: 80
    answer_min_words: 60
    answer_must_be_front_loaded: true

  - slot: source_threads
    class: action-section + action-grid (re-used)
    required:
      - heading         # "📚 Source Threads (Reddit, <year_range>)"
      - cards           # one per anchoring Reddit thread
    card_count_min: 4

  - slot: related_reading
    class: section-heading + paragraph
    required:
      - heading         # "Related Reading"
      - internal_links  # /scams/everywhere/ siblings only (per user spec)
      - external_links  # high-DA authority sources
    internal_links_count: [2, 5]

  - slot: books_cta_stub
    class: book-end-cta
    required: true
    note: Use the existing "Coming Soon" stub format from pig-butchering page

  - slot: series_nav
    class: series-nav
    required:
      - prev_link  # previous guide in /scams/everywhere/ series
      - next_link  # next guide in /scams/everywhere/ series
    placement: directly_above_legal_disclaimer
    notes: |
      Added 2026-04-29 per Tier 4 audit. Every page in the corpus was a
      dead end — readers had no obvious next-step internal link beyond
      the single "Related Reading" paragraph at the bottom. Series nav
      shows ← prev guide and next → guide. The corpus order is circular
      (last page's "next" wraps back to the first), so every page has
      both a prev and next. Maintain the canonical order in
      corpus-mapping.json so update_hub.py can compute these links
      automatically when shipping new pages.

      Canonical order (publish-time order):
        pig-butchering → ai-voice-clone-scams → real-estate-wire-fraud
        → bank-impersonation-and-zelle → tech-support-scams → (back to start)

      Use the .series-nav component already in scams.css. See
      tech-support-scams for a working reference.

  - slot: legal_disclaimer
    class: legal-disclaimer
    required:
      - corpus_size_claim   # "drawn from patterns across <N> Reddit posts and comments"
      - last_updated        # today's date
      - next_refresh        # +90 days from today
      - archive_org_note    # "archived versions available via archive.org"

# ============================================================
# CSS / inline-style policy (added 2026-04-29 per Tier 4 audit)
# ============================================================
# Do NOT add a per-page <style> block to new pages. All component styles
# (.stat-strip, .assessment-box, .context-sidebar, .legal-disclaimer,
# .transition-line, .tldr-box, .hook-section, .phase-list, .intl-list,
# .help-list, .assessment-skip, .callback-box, .page-meta-row,
# .page-meta-pill, .series-nav, .book-mid-cta, .reddit-quote) live in
# /assets/scams.css under the body.editorial-v2 namespace. Pages must
# include <link rel="stylesheet" href="/assets/scams.css"> and
# <body class="editorial-v2"> but should not duplicate component styles
# inline.
#
# When adding a NEW reusable component class to scam pages, the rule is:
# add the editorial-v2 styles to scams.css FIRST, then use the class
# in HTML. Several components have been used in HTML without being
# styled (.reddit-quote was unstyled until 2026-04-29; rendered flush
# against surrounding text). If you grep scams.css for the class name
# and find nothing, that is the bug — add the style before shipping.
#
# If you need a one-off style, scope it to a unique class on a single
# element with inline style="" — never add a <style> block to a page.
#
# ============================================================
# CSS landmine: NEVER use display:flex on <li> elements that
# contain inline <a> links (added 2026-04-29 — third time this bit us)
# ============================================================
# When a <li> has `display: flex` AND its content includes inline mixed
# nodes (text + <a> + text), every text node and every <a> becomes a
# SEPARATE flex item. The result on screen: the bullet's text fragments
# into narrow columns, with each link forming its own column.
#
# Bug history:
#   - PR #1236: .safety-box li { display: flex }     → fragmented
#   - 2026-04-29: .detail-block li { display: flex } → fragmented
# Both fixed with the same pattern (below).
#
# Symptoms (look for these in screenshots):
#   - Bullet text wraps in unexpectedly narrow columns
#   - The link inside the bullet appears on its own line/column
#   - Surrounding text wraps tightly to either side of the link
#
# Wrong (fragments):
#   .my-list li { display: flex; gap: 0.5rem; }
#   .my-list li::before { content: "✓"; flex-shrink: 0; }
#
# Right (renders as one block of inline text):
#   .my-list li { position: relative; padding-left: 1.5rem; }
#   .my-list li::before { content: "✓"; position: absolute; left: 0; top: 0; }
#
# Rule: ANY <li> that may contain inline links must use
# `position: relative` + absolute-positioned `::before` for the bullet,
# not `display: flex` + `flex-shrink:0` on `::before`. The flex pattern
# only works for bullets whose content is a single text node — but every
# scam-page list eventually grows an inline link, so default to the
# absolute pattern.
