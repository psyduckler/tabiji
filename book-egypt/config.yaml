title: "Egypt Tourist Scams 2026"
subtitle: "43 Real Scams Across Cairo, Luxor, Hurghada & 4 More Cities — Drawn from Reddit Reports, Egyptian News, and Embassy Advisories"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $500 in Egypt. This book documents 43 tourist scams across
  7 Egyptian cities — drawn from Reddit traveler reports, Egyptian press
  (One Mile at a Time, Tragento, Discover Hurghada), embassy advisories,
  and consumer-protection investigations. You'll learn the exact scripts
  scammers use, the red flags that give them away, and the Arabic phrases
  that shut them down. Includes an Arabic exit-phrase card, a post-scam
  recovery playbook, and emergency contacts for every major Egyptian city.

# Cities in intended reading order
# Capital first → Upper Egypt (Nile cruise corridor) → Red Sea coast → Mediterranean → Sinai
cities:
  - cairo
  - luxor
  - aswan
  - hurghada
  - sharm-el-sheikh
  - alexandria
  - dahab

# Path to scam JSON data (source of truth — rebuilds pick up changes automatically)
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: egypt-scams

# Wraparound spine + bleed colors — match the modern-cairo-illustrated palette
# (sand-gold + Nile-blue) so the wraparound spine does not contrast with the
# cover.
bleed_colors:
  - "#C9A24A"
  - "#1F4E6B"
