<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="nileBack" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1F4E6B"/>
      <stop offset="1" stop-color="#0F2A3D"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#nileBack)"/>

  <!-- Double-rule gold frame (matches front) -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#C9A24A" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#C9A24A" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#C9A24A">T A B I J I . A I</text>
  <text x="440" y="70" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#E8C490" text-anchor="end">Travel Safety Series</text>
  <line x1="60" y1="84" x2="440" y2="84" stroke="#C9A24A" stroke-width="0.5" opacity="0.7"/>

  <!-- Hero headline -->
  <text x="60" y="156" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#F5E6CE" letter-spacing="-0.3">What the guidebooks</text>
  <text x="60" y="194" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#F5E6CE" letter-spacing="-0.3">won&#8217;t tell you.</text>
  <rect x="60" y="210" width="60" height="1.8" fill="#C9A24A"/>

  <!-- Italic pitch paragraph -->
  <text x="60" y="250" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C490">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="60" y="270" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C490">lifetime. Don&#8217;t lose a dollar of it to a Giza camel</text>
  <text x="60" y="290" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C490">handler, a fake Tourist Police uniform, or a Hurghada</text>
  <text x="60" y="310" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#E8C490">airport visa counter that quoted $25 and charged $35.</text>

  <!-- Body pitch paragraph -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">This book documents 43 tourist scams across 7</text>
  <text x="60" y="368" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Egyptian cities &#8212; drawn from Reddit r/Egypt and</text>
  <text x="60" y="386" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">r/EgyptTravel reports, embassy advisories, and</text>
  <text x="60" y="404" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">consumer-protection investigations. You&#8217;ll learn</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">the scripts, the red flags, and the moves that work.</text>

  <!-- Inside bullets -->
  <text x="60" y="462" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#C9A24A" font-weight="700">Inside:</text>
  <circle cx="66" cy="492" r="2" fill="#C9A24A"/>
  <text x="78" y="496" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The Camel Ride Hostage at Giza &#8212; and how to break it</text>
  <circle cx="66" cy="516" r="2" fill="#C9A24A"/>
  <text x="78" y="520" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Why Borg El Arab Terminal 2 has only one airport ATM</text>
  <circle cx="66" cy="540" r="2" fill="#C9A24A"/>
  <text x="78" y="544" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The Philae Temple boatman cartel (10 EGP posted, 500 EGP quoted)</text>
  <circle cx="66" cy="564" r="2" fill="#C9A24A"/>
  <text x="78" y="568" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Dahab&#8217;s Blue Hole dive-op safety cuts (and the Mashraba red flags)</text>
  <circle cx="66" cy="588" r="2" fill="#C9A24A"/>
  <text x="78" y="592" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">The Sharm El Sheikh nightclub bezness romance scam</text>

  <!-- Gold divider -->
  <line x1="60" y1="618" x2="440" y2="618" stroke="#C9A24A" stroke-width="0.5" opacity="0.6"/>

  <!-- Plus bullets -->
  <text x="60" y="644" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#C9A24A" font-weight="700">Plus:</text>
  <circle cx="66" cy="670" r="2" fill="#C9A24A"/>
  <text x="78" y="674" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Egyptian Arabic exit-phrase card</text>
  <circle cx="66" cy="692" r="2" fill="#C9A24A"/>
  <text x="78" y="696" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Post-scam recovery playbook</text>
  <circle cx="66" cy="714" r="2" fill="#C9A24A"/>
  <text x="78" y="718" font-family="Georgia, serif" font-size="12" fill="#F5E6CE">Emergency contacts for all 7 cities</text>

  <!-- KDP barcode safe zone — bottom-right blank. -->
</svg>
