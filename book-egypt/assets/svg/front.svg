<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- EGYPT FRONT COVER — gouache + ink (modern-cairo-illustrated)      -->
  <!-- Background: full-bleed Giza camel-handler scam scene              -->
  <!-- with text overlays in the upper sky + lower semi-transparent band -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1F2A3A" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#1F2A3A" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0D1620" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FBEBC9" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FBEBC9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED ILLUSTRATION BACKGROUND -->
  <image xlink:href="front.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- TOP BAND: soft cream gradient over the sky for title legibility -->
  <rect x="0" y="0" width="500" height="200" fill="url(#topBand)"/>

  <!-- MASTHEAD -->
  <text x="250" y="40" font-family="Georgia, serif" font-size="10"
        letter-spacing="6" fill="#A07530" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="52" x2="290" y2="52" stroke="#A07530" stroke-width="0.4" opacity="0.7"/>
  <text x="250" y="68" font-family="Georgia, serif" font-style="italic" font-size="10"
        fill="#1F2A3A" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="82" font-family="Georgia, serif" font-size="8"
        letter-spacing="5" fill="#A07530" text-anchor="middle" opacity="0.9">VOLUME FOUR</text>

  <!-- TITLE — chunky display serif, cream-stroked for readability against sky -->
  <text x="250" y="138" font-family="Georgia, serif" font-weight="700" font-size="58"
        fill="#1F2A3A" text-anchor="middle" letter-spacing="-1"
        style="paint-order: stroke; stroke: #FBEBC9; stroke-width: 4px;">EGYPT</text>

  <!-- Ornamental lotus-bud rule (sand-gold + Nile-blue) -->
  <g transform="translate(250 160)">
    <rect x="-90" y="-0.8" width="180" height="1.6" fill="#C9A24A"/>
    <g fill="#C9A24A">
      <ellipse cx="-12" cy="0" rx="6" ry="1.8" transform="rotate(-20 -12 0)"/>
      <polygon points="0,-4 3,0 0,4 -3,0"/>
      <ellipse cx="12" cy="0" rx="6" ry="1.8" transform="rotate(20 12 0)"/>
    </g>
  </g>

  <!-- Italic subtitle -->
  <text x="250" y="186" font-family="Georgia, serif" font-style="italic" font-size="22"
        fill="#1F2A3A" text-anchor="middle"
        style="paint-order: stroke; stroke: #FBEBC9; stroke-width: 3px;">Tourist Scams</text>

  <!-- BOTTOM BAND: dark gradient for hook block legibility -->
  <rect x="0" y="600" width="500" height="200" fill="url(#bottomBand)"/>

  <!-- STAT BADGE — cream-on-dark for contrast — tucked inside the hook band -->
  <g transform="translate(250 648)">
    <rect x="-72" y="-18" width="144" height="34" fill="none"
          stroke="#C9A24A" stroke-width="1.1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="19"
          fill="#FBEBC9" text-anchor="middle">43</text>
    <text x="0" y="11" font-family="Georgia, serif" font-size="7"
          fill="#C9A24A" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- HOOK -->
  <line x1="70" y1="684" x2="430" y2="684" stroke="#C9A24A" stroke-width="0.5" opacity="0.7"/>
  <text x="250" y="710" font-family="Georgia, serif" font-weight="700" font-size="21"
        fill="#FBEBC9" text-anchor="middle">Don&#8217;t Lose $500 in Egypt</text>
  <text x="250" y="732" font-family="Georgia, serif" font-style="italic" font-size="11.5"
        fill="#FBEBC9" text-anchor="middle" opacity="0.92">Drawn from Reddit reports and embassy advisories.</text>
  <line x1="70" y1="746" x2="430" y2="746" stroke="#C9A24A" stroke-width="0.5" opacity="0.7"/>

  <!-- FOOTER -->
  <text x="250" y="768" font-family="Georgia, serif" font-size="10"
        fill="#FBEBC9" text-anchor="middle" letter-spacing="4">7 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>
