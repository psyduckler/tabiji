title: "Turkey Tourist Scams 2026"
subtitle: "78 Real Scams Across Istanbul, Cappadocia, Antalya & 10 More Cities — Drawn from Turkish News Reports and Tourist Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose ₺5,000 in Türkiye. This book documents 78 tourist scams
  across 13 Turkish cities and scenic regions — drawn from Turkish
  news reports (Hürriyet Daily News, Daily Sabah, Anadolu Agency,
  Cumhuriyet), Turkish National Police and Jandarma records, and
  real traveler accounts. You'll learn the exact scripts Istanbul
  shoe-shine touts, carpet-shop "friends," and Bodrum jet-ski
  operators use, the red flags that give them away, and the Turkish
  phrases that shut them down. Includes a Turkish exit-phrase card,
  a post-scam recovery playbook, and emergency contacts for every
  major Turkish destination.

# Cities in intended reading order:
# Istanbul flagship → Aegean/Mediterranean coast (west to east) → Inland
cities:
  - istanbul
  - cappadocia
  - izmir
  - ephesus
  - kusadasi
  - bodrum
  - marmaris
  - fethiye
  - antalya
  - alanya
  - side-turkey
  - pamukkale
  - konya

# Path to scam JSON data
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: turkey-scams
