<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- COLOMBIA BACK COVER — Macondo watercolor aesthetic                -->
  <!-- Background: full-bleed Cartagena walled-city rose-seller scene    -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets               -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a0f07" stop-opacity="0.82"/>
      <stop offset="0.75" stop-color="#1a0f07" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#1a0f07" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a0f07" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED WATERCOLOR BACKGROUND -->
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility; lightens toward bottom -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#1a0f07" fill-opacity="0.7" stroke="#e8a93d" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#e8a93d" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#fdf4e3" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">In Bogot&#225;, yellow street taxis at night run the &#8220;paseo millonario.&#8221;</tspan>
    <tspan x="60" dy="16">In Medell&#237;n, Tinder matches arrive with scopolamine in the glass.</tspan>
    <tspan x="60" dy="16">In Cartagena, a rose in your companion&#8217;s hand costs $50.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">This book documents 33 specific scams across 5 Colombian</tspan>
    <tspan x="60" dy="15">destinations &#8212; drawn from El Tiempo, Semana, El Espectador,</tspan>
    <tspan x="60" dy="15">the US State Department Colombia advisory, and Polic&#237;a</tspan>
    <tspan x="60" dy="15">de Turismo records. You&#8217;ll learn the exact scripts scammers</tspan>
    <tspan x="60" dy="15">use, and the Spanish phrases that shut them down on the spot.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="320" x2="440" y2="320" stroke="#e8a93d" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#e8a93d">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">33 scams with exact Spanish scripts and peso / dollar amounts</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">Six universal red-flag patterns covering every scam in Colombia</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">A four-panel Macondo-watercolor comic for every scam entry</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">Bogot&#225;, Medell&#237;n, Cartagena, Cali &#38; Santa Marta</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">Colombian Spanish phrases with bogotano / coste&#241;o pronunciation</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#e8a93d">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">A Colombian exit-phrase card you can screenshot to your phone</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">A medical-first recovery playbook for scopolamine cases</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#e8a93d"/>
      <text x="14" y="3">Emergency contacts: 123 &#38; 165 plus every Polic&#237;a de Turismo office</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#e8a93d" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#fdf4e3" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
