title: "Colombia Tourist Scams 2026"
subtitle: "58 Real Scams Across 10 Colombian Destinations — From Paseo Millonario to Scopolamine, the Exact Phrases That End the Con"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose a thousand dollars — or your memory — in Colombia. This book
  documents 58 tourist scams across ten Colombian destinations — drawn
  from Colombian press coverage (El Tiempo, El Colombiano, El Heraldo,
  El Universal, Semana, El País de Cali, Hoy Diario del Magdalena, El
  Isleño, La Crónica del Quindío), US State Department and UK Foreign
  Office advisories, Policía de Turismo records, and firsthand traveler
  accounts from Colombia-focused travel communities. You'll learn the
  exact Bogotá paseo-millonario taxi script, the Medellín scopolamine
  Tinder setup, the Cartagena walled-city USD-pricing trap, the Cali
  San Antonio fake-plainclothes approach, the Santa Marta bill-switch
  counterfeit-change move, the El Poblado-to-Guatapé private-driver
  markup, the Salento Cocora willys-jeep overcharge, the Tayrona
  El Zaino park-closed redirect, the San Andrés Tarjeta de Turismo
  resale fraud, and the Villa de Leyva Calle Caliente drink-spiking
  pattern — plus a Colombian Spanish exit-phrase card, a medical-first
  recovery playbook for drink-spiking cases, and emergency contacts for
  every major Colombian city.

# Cities in intended reading order:
# Capital (Andes) → Paisa hub (Antioquia) → Caribbean UNESCO walled city
# → Salsa capital (Valle del Cauca) → Caribbean gateway (Magdalena) →
# Antioquia day-trip rock village → Quindío coffee axis → Magdalena
# park & beach gateway → Caribbean island & dive zone → Boyacá colonial
# weekend town
cities:
  - bogota
  - medellin
  - cartagena
  - cali
  - santa-marta
  - guatape
  - salento
  - tayrona
  - san-andres
  - villa-de-leyva

