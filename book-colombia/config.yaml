title: "Colombia Tourist Scams 2026"
subtitle: "33 Real Scams Across Bogotá, Medellín, Cartagena, Cali & Santa Marta — From Paseo Millonario to Scopolamine, the Exact Phrases That End the Con"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose a thousand dollars — or your memory — in Colombia. This book
  documents 33 tourist scams across five Colombian destinations — drawn
  from Colombian press coverage (El Tiempo, Semana, El Espectador, El
  Colombiano), US State Department and UK Foreign Office advisories,
  Policía de Turismo records, and firsthand traveler accounts from
  Colombia-focused travel communities. You'll learn the exact Bogotá
  paseo-millonario taxi script, the Medellín scopolamine Tinder setup,
  the Cartagena walled-city USD-pricing trap, the Cali San Antonio
  fake-plainclothes approach, and the Santa Marta bill-switch
  counterfeit-change move — plus a Colombian Spanish exit-phrase card,
  a medical-first recovery playbook for drink-spiking cases, and
  emergency contacts for every major Colombian city.

# Cities in intended reading order:
# Capital (Andes) → Paisa hub (Antioquia) → Caribbean UNESCO walled city
# → Salsa capital (Valle del Cauca) → Caribbean gateway (Magdalena)
cities:
  - bogota
  - medellin
  - cartagena
  - cali
  - santa-marta

# Path to scam JSON data — Colombian data lives in the public API tree
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: colombia-scams
