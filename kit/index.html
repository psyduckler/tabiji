<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tabiji Kit">
  <meta name="description" content="Emergency travel safety companion — offline-ready country safety profiles for 40+ countries">
  <title>Tabiji Kit 🧳</title>

  <link rel="manifest" href="/kit/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/kit/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/kit/icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/kit/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <button class="header-back" id="backBtn" aria-label="Go back">←</button>
    <div class="header-brand">Tabiji Kit 🧳</div>
    <span class="header-offline" id="offlineTag">Offline</span>
  </header>

  <main class="container">

    <!-- Install Banner -->
    <div class="install-banner" id="installBanner">
      <div class="install-banner-text">
        <strong>Install Tabiji Kit</strong>
        <small>Add to home screen for quick access</small>
      </div>
      <button class="btn" id="installBtn">Install</button>
      <button class="install-dismiss" id="installDismiss">✕</button>
    </div>

    <!-- Country List View -->
    <div class="view active" id="listView">
      <div class="search-bar">
        <div class="search-bar-inner">
          <span class="search-icon">🔍</span>
          <input type="search" class="search-input" id="searchInput" placeholder="Search 40 countries..." autocomplete="off">
        </div>
      </div>
      <ul class="country-list" id="countryList"></ul>
      <div class="footer">
        <p>Tabiji Kit v0.1 · Emergency travel safety data</p>
        <p>Data for informational purposes only · <a href="https://tabiji.ai">tabiji.ai</a></p>
      </div>
    </div>

    <!-- Country Detail View -->
    <div class="view" id="detailView">
      <div class="country-hero" id="countryHero"></div>
      <div class="tabs-wrapper">
        <div class="tabs-scroll" id="tabsScroll"></div>
      </div>
      <div id="tabContent"></div>
    </div>

  </main>

  <script src="/kit/app.js"></script>
</body>
</html>
