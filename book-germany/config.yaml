title: "Germany Tourist Scams 2026"
subtitle: "88 Real Scams Across Berlin, Munich, Hamburg & 13 More Cities — Drawn from German News Reports and Polizei Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €300 in Germany. This book documents 88 tourist scams across
  16 German cities and spa towns — drawn from German news reports
  (*Der Spiegel*, *Süddeutsche Zeitung*, *Bild*, *Deutsche Welle*),
  Bundespolizei and Landespolizei records, and real traveler accounts.
  You'll learn the exact scripts behind the Brandenburg Gate clipboard
  pickpocket, the Munich Oktoberfest overcharge-and-vanish, the Hauptbahnhof
  fake-ticket-agent swap, and the German phrases that shut them down.
  Includes a German exit-phrase card, a post-scam recovery playbook, and
  emergency contacts for every major German destination.

# Cities in intended reading order:
# Berlin (capital) → Potsdam (Brandenburg gateway) → Hamburg, Bremen (north coast) →
# Dresden, Leipzig (east / Saxony) → Munich, Nuremberg (Bavaria) →
# Frankfurt, Stuttgart (central/south) → Cologne, Düsseldorf (Rhineland) →
# Heidelberg, Baden-Baden, Rothenburg, Füssen (Romantic Road finale)
cities:
  - berlin
  - potsdam
  - hamburg
  - bremen
  - dresden
  - leipzig
  - munich
  - nuremberg
  - frankfurt
  - stuttgart
  - cologne
  - dusseldorf
  - heidelberg
  - baden-baden
  - rothenburg
  - fussen

