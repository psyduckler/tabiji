<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a0a0a" stop-opacity="0.82"/>
      <stop offset="0.75" stop-color="#1a0a0a" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#1a0a0a" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800" preserveAspectRatio="xMidYMid slice"/>
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>
  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7" fill="#1a0a0a" fill-opacity="0.7" stroke="#c89a3d" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9" fill="#c89a3d" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#fdf4e3" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12" fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">Berlin runs a Brandenburger Tor clipboard-petition pickpocket every day.</tspan>
    <tspan x="60" dy="16">Munich&#8217;s Oktoberfest has a &#8220;share my table&#8221; bill-shock every September.</tspan>
    <tspan x="60" dy="16">Neuschwanstein ticket resellers sell QR codes that don&#8217;t scan at the gate.</tspan>
  </text>
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">This book documents 88 specific scams across 16 German cities and</tspan>
    <tspan x="60" dy="15">spa towns &#8212; drawn from Der Spiegel, S&#252;ddeutsche Zeitung, Bild,</tspan>
    <tspan x="60" dy="15">Deutsche Welle, and Bundespolizei (110) records. You&#8217;ll learn the</tspan>
    <tspan x="60" dy="15">exact scripts scammers use, the red flags that give them away, and</tspan>
    <tspan x="60" dy="15">the German phrases that shut them down on the spot.</tspan>
  </text>
  <line x1="60" y1="320" x2="440" y2="320" stroke="#c89a3d" stroke-width="0.5"/>
  <text x="60" y="340" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#c89a3d">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 362)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">88 scams with exact German scripts and euro (&#8364;) amounts</text></g>
    <g transform="translate(60 380)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">Six universal red-flag patterns covering every scam in Germany</text></g>
    <g transform="translate(60 398)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">A four-panel Heinrich-Zille-style ink comic for every scam entry</text></g>
    <g transform="translate(60 416)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">Berlin, Munich, Hamburg, Cologne &#38; 12 more cities</text></g>
    <g transform="translate(60 434)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">German phrases with umlauts and eszett (&#223;) explained</text></g>
  </g>
  <text x="60" y="464" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#c89a3d">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 484)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">A German exit-phrase card you can screenshot to your phone</text></g>
    <g transform="translate(60 502)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">A post-scam recovery playbook (first 15 min, first hour, first day)</text></g>
    <g transform="translate(60 520)"><polygon points="0,0 5,-3 5,3" fill="#c89a3d"/><text x="14" y="3">Emergency contacts: 110 Polizei &#38; every major-city station + hospitals</text></g>
  </g>
  <line x1="60" y1="548" x2="440" y2="548" stroke="#c89a3d" stroke-width="0.5"/>
  <text x="250" y="770" font-family="Georgia, serif" font-size="9" fill="#fdf4e3" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
