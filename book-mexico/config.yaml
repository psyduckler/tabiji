title: "Mexico Tourist Scams 2026"
subtitle: "114 Real Scams Across Mexico City, Cancún, Tulum & 16 More Cities — Drawn from Mexican News Reports and Tourist Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $400 in Mexico. This book documents 114 tourist scams across
  19 Mexican cities and Caribbean islands — drawn from Mexican news reports
  (Reforma, El Universal, Milenio, La Jornada, Riviera Maya News, Yucatan
  Times, Mexico News Daily), PROFECO consumer warnings, SECTUR advisories,
  state fiscalía records, and real traveler accounts. You'll learn the
  exact scripts behind the Benito Juárez airport "authorized taxi"
  overcharge, the Cancún ATM-skim ring, the Tulum cenote "park entry"
  shakedown, the Mexico City CDMX taxi short-meter, and the Spanish
  phrases that shut them down. Includes a Spanish exit-phrase card,
  a post-scam recovery playbook (denuncia, PROFECO, consular notification),
  and emergency contacts for every major Mexican destination.

# Cities in intended reading order:
# Capital → highland heritage cities → Yucatán → Caribbean islands & coast → Pacific
cities:
  - mexico-city                 # capital, flagship — Volume 16's anchor
  - puebla                      # UNESCO heritage, near capital
  - oaxaca                      # heritage, mezcal heartland
  - guanajuato                  # heritage, callejones
  - san-miguel-de-allende       # expat magnet, Magic Town
  - guadalajara                 # mariachi + tequila country
  - merida                      # Yucatán capital, white-stone heritage
  - san-cristobal-de-las-casas  # Chiapas highland, indigenous markets
  - cancun                      # Caribbean flagship, Hotel Zone
  - playa-del-carmen            # Riviera Maya hub, Quinta Avenida
  - tulum                       # cliffside Mayan ruins + bohemian beach
  - cozumel                     # cruise-port reef island
  - isla-mujeres                # Playa Norte day-trip island
  - holbox                      # sand-street eco-island, flamingos
  - puerto-vallarta             # Pacific flagship, Banderas Bay
  - mazatlan                    # Pacific Old Lighthouse, Sinaloa
  - acapulco                    # Pacific bay, La Quebrada divers
  - cabo-san-lucas              # Baja tip, El Arco
  - puerto-escondido            # Pacific surf, Zicatela

# Path to scam JSON data
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: mexico-scams
