title: "Spain Tourist Scams 2026"
subtitle: "103 Real Scams Across Madrid, Barcelona, Seville & 13 More Cities — Drawn from Spanish News Reports and Policía Nacional Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €500 in Spain. This book documents 103 tourist scams
  across 16 Spanish cities and islands — drawn from Spanish news
  reports (El País, La Vanguardia, ABC, El Mundo), Policía Nacional
  and Guardia Civil records, and real traveler accounts. You'll
  learn the exact scripts pickpocket teams use on La Rambla, the
  moves that stop Barcelona petition scammers, and the Spanish
  phrases that end an argument in seconds. Includes a Spanish
  exit-phrase card, a post-scam recovery playbook, and emergency
  contacts for every major Spanish city and island.

# Cities in intended reading order:
# Capital → Catalonia → Andalucía → North → Islands (Balearic then Canary)
cities:
  - madrid
  - barcelona
  - seville
  - granada-spain
  - cordoba
  - malaga
  - valencia
  - bilbao
  - san-sebastian
  - santiago-de-compostela
  - toledo
  - palma-de-mallorca
  - ibiza
  - tenerife
  - gran-canaria
  - lanzarote

# Path to scam JSON data — Spain data lives in the public API tree
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: spain-scams
