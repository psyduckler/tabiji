title: "Vietnam Tourist Scams 2026"
subtitle: "66 Real Scams Across Hanoi, Ho Chi Minh City, Ha Long Bay & 8 More Cities — Drawn from Vietnamese News Reports and Tourist Police Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose $1,000 in Vietnam. This book documents 66 tourist scams
  across 11 Vietnamese cities and regions — drawn from Vietnamese news
  reports (Tuoi Tre, VnExpress, VietnamPlus, Thanh Nien), Tourist Police
  (dial 113) records, and real traveler accounts. You'll learn the exact
  scripts scammers use, the red flags that give them away, and the
  Vietnamese phrases that shut them down. Includes a Vietnamese
  exit-phrase card, a post-scam recovery playbook, and emergency contacts
  for every major Vietnamese city and region.

# Cities in intended reading order
# Hanoi flagship → North → Central coast → South → Highland/Delta/Islands
cities:
  - hanoi
  - ha-long-bay
  - sapa
  - hue
  - hoi-an
  - da-nang
  - nha-trang
  - dalat
  - ho-chi-minh-city
  - can-tho
  - phu-quoc

# Path to scam JSON data — Vietnam data lives in the public API tree
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: vietnam-scams
