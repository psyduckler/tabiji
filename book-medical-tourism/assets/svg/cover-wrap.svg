<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1289.63 925"
     width="3869"
     height="2775">
  <!-- ===========================================================
       The Medical Tourism Field Guide — Paperback Wrap Cover
       KDP 6×9" trim, 287 pages, spine width 0.6463"
       Total wrap dimensions (with 0.125" bleed):
         Width:  12.8963" (3869 px @ 300 DPI)
         Height: 9.25"    (2775 px @ 300 DPI)
       Layout (left to right):
         [bleed 0.125"][back 6"][spine 0.6463"][front 6"][bleed 0.125"]
       Spine fold left:  612.5
       Spine fold right: 677.13  (= 612.5 + 64.63)
       Front cover left:   677.13
       Front cover center: 977.13
       =========================================================== -->

  <!-- Full-bleed cream background (matches the cover-art's cream paper) -->
  <rect width="1289.63" height="925" fill="#fcf9e8"/>

  <!-- Subtle spine fold guide lines (so the press operator can see the fold,
       but soft enough not to be visually distracting) -->
  <line x1="612.5"  y1="0" x2="612.5"  y2="925" stroke="#3A5566" stroke-width="0.4" opacity="0.20"/>
  <line x1="677.13" y1="0" x2="677.13" y2="925" stroke="#3A5566" stroke-width="0.4" opacity="0.20"/>

  <!-- =========================================================
       BACK COVER (x: 12.5 to 612.5)
       Safe zone: x: 37.5 to 587.5 (0.25" from each edge)
       For 287-page book, outside safe-zone requirement is 0.375",
       so inner safe x range is roughly 50 to 575.
       ========================================================= -->

  <!-- Back: top hook headline -->
  <text x="312.5" y="80"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="20"
        font-weight="bold"
        fill="#3A5566">If you are thinking about</text>
  <text x="312.5" y="108"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="20"
        font-weight="bold"
        fill="#3A5566">healthcare abroad, this book is for you.</text>

  <!-- Back: short description -->
  <g font-family="Georgia, serif" font-size="11" fill="#1a1812">
    <text x="62.5" y="170"><tspan x="62.5" dy="0">Maybe a friend traveled abroad for surgery and came back</tspan><tspan x="62.5" dy="14">with a story that made you wonder. Maybe a dental quote in</tspan><tspan x="62.5" dy="14">your hand has a number that does not match your savings.</tspan><tspan x="62.5" dy="14">Maybe your mother needs a hip replacement and her insurance</tspan><tspan x="62.5" dy="14">has just denied the prior authorization for the third time.</tspan><tspan x="62.5" dy="14">Maybe a facilitator on Instagram has been replying to your</tspan><tspan x="62.5" dy="14">DMs within minutes and the price is half the US quote.</tspan></text>

    <text x="62.5" y="290"><tspan x="62.5" dy="0" font-weight="bold" fill="#3A5566">This is the book you wish you had before the deposit.</tspan></text>

    <text x="62.5" y="330"><tspan x="62.5" dy="0">A calm, practical field manual for the patient considering</tspan><tspan x="62.5" dy="14">medical care across an international border. It will not</tspan><tspan x="62.5" dy="14">rank countries or clinics. It will not sell you a</tspan><tspan x="62.5" dy="14">destination. It will help you slow down, verify the surgeon</tspan><tspan x="62.5" dy="14">and the anesthesia provider, decode a quote, recognize the</tspan><tspan x="62.5" dy="14">patterns federal agencies and peer-reviewed research have</tspan><tspan x="62.5" dy="14">documented, and protect your decision from sales pressure.</tspan></text>

    <text x="62.5" y="465"><tspan x="62.5" dy="0" font-weight="bold" fill="#3A5566">Inside:</tspan></text>
    <text x="62.5" y="485"><tspan x="62.5" dy="0">• The Five Rules and the Seven Leverage Points</tspan></text>
    <text x="62.5" y="501"><tspan x="62.5" dy="0">• A 20-Minute Safety Pause before any deposit</tspan></text>
    <text x="62.5" y="517"><tspan x="62.5" dy="0">• The Procedure Complexity Ladder (Steps 1 through 5)</tspan></text>
    <text x="62.5" y="533"><tspan x="62.5" dy="0">• Specialist credential verification by country</tspan></text>
    <text x="62.5" y="549"><tspan x="62.5" dy="0">• 9 composite scenarios drawn from documented patterns</tspan></text>
    <text x="62.5" y="565"><tspan x="62.5" dy="0">• 7 short "Bernard's Notes" — the editor's direct voice</tspan></text>
    <text x="62.5" y="581"><tspan x="62.5" dy="0">• 20 reusable worksheets in the back matter</tspan></text>
  </g>

  <!-- Pull quote on back cover -->
  <g transform="translate(80, 635)">
    <text x="0" y="0"   font-family="Georgia, serif" font-size="46" fill="#3A5566" font-weight="bold" opacity="0.7">&#8220;</text>
    <text x="40" y="-12" font-family="Georgia, serif" font-size="13" fill="#1a1812" font-style="italic">The body is yours. The decision is yours.</text>
    <text x="40" y="5"   font-family="Georgia, serif" font-size="13" fill="#1a1812" font-style="italic">The book is the second pair of eyes.</text>
  </g>

  <!-- Back: bottom — series line + URL -->
  <line x1="62.5" y1="710" x2="562.5" y2="710" stroke="#3A5566" stroke-width="0.5" opacity="0.6"/>

  <text x="62.5" y="735" font-family="Georgia, serif" font-size="10" fill="#1F6470" letter-spacing="3">A TABIJI FIELD GUIDE  |  VOLUME THREE</text>
  <text x="62.5" y="754" font-family="Georgia, serif" font-size="10" fill="#1F6470" font-style="italic">tabiji.ai/book/medical-tourism</text>

  <!-- KDP automatically places its own barcode on the lower-right of the
       back cover with its own white background. The area below is intentionally
       left clear for that barcode. Recommended clear zone:
         x ≈ 362.5 to 562.5, y ≈ 690 to 810 (≈ 2" × 1.2"). -->

  <!-- =========================================================
       SPINE (x: 612.5 to 677.13, width 64.63 = 0.6463")
       Safe text area: x ≈ 618.75 to 670.88 (0.0625" from each fold)
       Center of spine: x = 644.815
       ========================================================= -->

  <!-- TABIJI wordmark at top of spine, rotated -->
  <text transform="translate(641, 60) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="8"
        fill="#3A5566"
        letter-spacing="2.5">TABIJI</text>

  <!-- Title on spine, rotated 90° clockwise — left edge of rotated text is
       the top of the printed spine (reads top-to-bottom when book is upright).
       Font size 17 fits within the 0.6463" spine with cap-height headroom. -->
  <text transform="translate(644.815, 175) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="17"
        font-weight="bold"
        fill="#1a1812">The Medical Tourism Field Guide</text>

  <!-- Author at bottom of spine -->
  <text transform="translate(641, 760) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="9"
        fill="#1a1812"
        letter-spacing="2">BERNARD HUANG</text>

  <!-- =========================================================
       FRONT COVER (x: 677.13 to 1277.13, width 600)
       Safe zone: x ≈ 702.13 to 1252.13 (0.25" from each side)
       For 287-page book, outside-trim safety is 0.375", so the
       outer-edge safe x is ≈ 714.63 to 1239.63.
       Center of front: x = 977.13
       Trim: y = 12.5 to 912.5
       ========================================================= -->

  <!-- Front: embedded Hergé cover art. y=187.5 keeps the illustration's
       cream upper wall safely below the title and subtitle. -->
  <image xlink:href="cover-art.jpg"
         x="677.13" y="187.5"
         width="600" height="600"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Front: top imprint band -->
  <line x1="771.42" y1="90" x2="1182.84" y2="90" stroke="#3A5566" stroke-width="1"/>
  <text x="977.13" y="70" text-anchor="middle"
        font-family="Georgia, serif" font-size="11" fill="#3A5566" letter-spacing="4">TABIJI FIELD GUIDES</text>
  <text x="977.13" y="110" text-anchor="middle"
        font-family="Georgia, serif" font-size="7" fill="#1F6470" letter-spacing="3" font-style="italic">VOLUME THREE</text>

  <!-- Front: title -->
  <g font-family="Georgia, serif" fill="#1a1812" font-weight="bold">
    <text x="977.13" y="160" text-anchor="middle" font-size="36">The</text>
    <text x="977.13" y="208" text-anchor="middle" font-size="36">Medical Tourism</text>
    <text x="977.13" y="256" text-anchor="middle" font-size="36">Field Guide</text>
  </g>

  <!-- Front: subtitle (sits just above the illustration's top edge) -->
  <text x="977.13" y="290" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#3A5566" font-style="italic">A buyer-protection guide to healthcare decisions abroad</text>

  <!-- Front: bottom rule + byline (sit on the cream floor area of the illustration) -->
  <line x1="827.13" y1="850" x2="1127.13" y2="850" stroke="#3A5566" stroke-width="0.8" opacity="0.85"/>
  <text x="977.13" y="878" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a1812" letter-spacing="2">BERNARD HUANG</text>
  <text x="977.13" y="896" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#1F6470" letter-spacing="3" font-style="italic">EDITOR</text>

</svg>
