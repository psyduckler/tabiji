<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 1800"
     width="1200"
     height="1800">

  <!-- =========================================================
       The Medical Tourism Field Guide — Front Cover
       Volume 3 of the Tabiji Field Guides series.
       Direction: Hergé / Tintin ligne-claire.
       6×9" trim, 2:3 aspect, viewBox 1200×1800 (renders at 300 DPI = 1800×2700 px).

       Palette (sampled from cover art):
         Cream:        #fcf9e8   (background — matches the JPG cream)
         Ink:          #1a1812   (Hergé line color, used for title body)
         Slate blue:   #3A5566   (V3 series accent — passport-tone)
         Quiet teal:   #1F6470   (V3 series secondary accent — sampled from sky/plane)
       ========================================================= -->

  <!-- Full cream background (matches and extends the JPG's cream upper third) -->
  <rect width="1200" height="1800" fill="#fcf9e8"/>

  <!-- Embedded Hergé cover art. Positioned in the lower 2/3 of the
       canvas so the JPG's own cream upper third meets the SVG cream
       seamlessly. y=400 gives the title block (top to y≈610) room to
       breathe above the airport scene that begins in the embedded
       image's middle band. preserveAspectRatio="xMidYMid slice" fills
       the 1200×1200 box from a 1024×1024 source. -->
  <image xlink:href="cover-art.jpg"
         x="0" y="400"
         width="1200" height="1200"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- ===== Top imprint band: TABIJI FIELD GUIDES ===== -->
  <line x1="180" y1="180" x2="1020" y2="180" stroke="#3A5566" stroke-width="2"/>
  <text x="600" y="140"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        fill="#3A5566"
        letter-spacing="9">TABIJI FIELD GUIDES</text>
  <text x="600" y="220"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14"
        fill="#1F6470"
        letter-spacing="7"
        font-style="italic">VOLUME THREE</text>

  <!-- ===== Title block ===== -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1a1812" font-weight="bold">
    <text x="600" y="320" text-anchor="middle" font-size="72">The</text>
    <text x="600" y="400" text-anchor="middle" font-size="72">Medical Tourism</text>
    <text x="600" y="480" text-anchor="middle" font-size="72">Field Guide</text>
  </g>

  <!-- ===== Subtitle — sits just above the illustration's content ===== -->
  <text x="600" y="540"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        fill="#3A5566"
        font-style="italic">A buyer-protection guide to healthcare decisions abroad</text>

  <!-- ===== Editor byline at bottom (sits on the airport floor) ===== -->
  <!-- Subtle horizontal rule above the byline -->
  <line x1="380" y1="1660" x2="820" y2="1660" stroke="#3A5566" stroke-width="1.2" opacity="0.8"/>

  <text x="600" y="1715"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24"
        fill="#1a1812"
        letter-spacing="5">BERNARD HUANG</text>
  <text x="600" y="1750"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13"
        fill="#1F6470"
        letter-spacing="7"
        font-style="italic">EDITOR</text>

</svg>
