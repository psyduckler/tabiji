<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 1800"
     width="1200"
     height="1800">

  <!-- =========================================================
       The Cosmetic Surgery Field Guide — Front Cover
       Volume 2 of the Tabiji Field Guides series.
       Direction: Saul Steinberg / New Yorker editorial line.
       6×9" trim, 2:3 aspect, viewBox 1200×1800 (renders at 300 DPI = 1800×2700 px).

       Palette (sampled from cover art):
         Cream:        #fcf9e8   (background — matches the JPG cream)
         Ink:          #1a1812   (Steinberg line color, used for title body)
         Warm red:     #c54a3a   (warm brick accent — kindred to the lamp glow)
         Muted green:  #5e6e57   (italic + small caps — quiet contrast)
       ========================================================= -->

  <!-- Full cream background (matches and extends the JPG's cream paper) -->
  <rect width="1200" height="1800" fill="#fcf9e8"/>

  <!-- Embedded Steinberg cover art, positioned in the lower 2/3.
       The JPG's own cream extends seamlessly up into the typography area. -->
  <image xlink:href="cover-art.jpg"
         x="0" y="600"
         width="1200" height="1200"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- ===== Top imprint band: TABIJI FIELD GUIDES ===== -->
  <line x1="180" y1="180" x2="1020" y2="180" stroke="#c54a3a" stroke-width="2"/>
  <text x="600" y="140"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        fill="#c54a3a"
        letter-spacing="9">TABIJI FIELD GUIDES</text>
  <text x="600" y="220"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14"
        fill="#5e6e57"
        letter-spacing="7"
        font-style="italic">VOLUME TWO</text>

  <!-- ===== Title block ===== -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#1a1812" font-weight="bold">
    <text x="600" y="350" text-anchor="middle" font-size="78">The</text>
    <text x="600" y="450" text-anchor="middle" font-size="78">Cosmetic Surgery</text>
    <text x="600" y="550" text-anchor="middle" font-size="78">Field Guide</text>
  </g>

  <!-- ===== Subtitle — sits just above the illustration top edge ===== -->
  <text x="600" y="610"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        fill="#c54a3a"
        font-style="italic">A buyer-protection guide to cosmetic surgery abroad</text>

  <!-- ===== Editor byline at bottom (sits on the cream floor area of the illustration) ===== -->
  <!-- Subtle horizontal rule above the byline -->
  <line x1="380" y1="1660" x2="820" y2="1660" stroke="#c54a3a" stroke-width="1.2" opacity="0.8"/>

  <text x="600" y="1715"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="24"
        fill="#1a1812"
        letter-spacing="5">BERNARD HUANG</text>
  <text x="600" y="1750"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="13"
        fill="#5e6e57"
        letter-spacing="7"
        font-style="italic">EDITOR</text>

</svg>
