<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1318.23 925"
     width="3947"
     height="2775">
  <!-- ===========================================================
       The Cosmetic Surgery Field Guide — Paperback Wrap Cover
       KDP 6×9" trim, 414 pages, spine width 0.9323"
       Total wrap dimensions (with 0.125" bleed):
         Width:  13.1823" (3947 px @ 300 DPI)
         Height: 9.25"    (2775 px @ 300 DPI)
       Layout (left to right):
         [bleed 0.125"][back 6"][spine 0.9323"][front 6"][bleed 0.125"]
       Spine fold left:  612.5
       Spine fold right: 705.73  (= 612.5 + 93.23)
       Front cover center: 1005.73
       =========================================================== -->

  <!-- Full-bleed cream background (matches the cover-art's cream paper) -->
  <rect width="1318.23" height="925" fill="#fcf9e8"/>

  <!-- Subtle spine fold guide lines (so the press operator can see the fold,
       but soft enough not to be visually distracting) -->
  <line x1="612.5"  y1="0" x2="612.5"  y2="925" stroke="#c54a3a" stroke-width="0.4" opacity="0.20"/>
  <line x1="705.73" y1="0" x2="705.73" y2="925" stroke="#c54a3a" stroke-width="0.4" opacity="0.20"/>

  <!-- =========================================================
       BACK COVER (x: 12.5 to 612.5)
       Safe zone: x: 37.5 to 587.5 (0.25" from each edge)
       For 414-page book, outside safe-zone requirement is 0.5",
       so inner safe x range is roughly 62.5 to 562.5.
       ========================================================= -->

  <!-- Back: top hook headline -->
  <text x="312.5" y="80"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="20"
        font-weight="bold"
        fill="#c54a3a">If you are thinking about cosmetic surgery</text>
  <text x="312.5" y="108"
        text-anchor="middle"
        font-family="Georgia, serif"
        font-size="20"
        font-weight="bold"
        fill="#c54a3a">abroad, this book is for you.</text>

  <!-- Back: short description -->
  <g font-family="Georgia, serif" font-size="11" fill="#1a1812">
    <text x="62.5" y="170"><tspan x="62.5" dy="0">Maybe a friend came back from a clinic abroad looking like the</tspan><tspan x="62.5" dy="14">person they hoped to be. Maybe you have scrolled before-and-</tspan><tspan x="62.5" dy="14">after reels until 2 a.m. Maybe a coordinator has been replying</tspan><tspan x="62.5" dy="14">in minutes and the price is half the local quote. Maybe you</tspan><tspan x="62.5" dy="14">have already paid a deposit and your stomach is telling you</tspan><tspan x="62.5" dy="14">something the consent form is not.</tspan></text>

    <text x="62.5" y="280"><tspan x="62.5" dy="0" font-weight="bold" fill="#c54a3a">This is the book you wish you had before the deposit.</tspan></text>

    <text x="62.5" y="320"><tspan x="62.5" dy="0">A calm, practical field manual for the patient considering</tspan><tspan x="62.5" dy="14">cosmetic surgery or hair restoration abroad. It will not rank</tspan><tspan x="62.5" dy="14">countries or clinics. It will not sell you a destination. It will</tspan><tspan x="62.5" dy="14">help you slow down, verify the surgeon and the anesthesia</tspan><tspan x="62.5" dy="14">provider, decode a quote, recognize the patterns the CDC has</tspan><tspan x="62.5" dy="14">documented, and protect your decision from sales pressure.</tspan></text>

    <text x="62.5" y="445"><tspan x="62.5" dy="0" font-weight="bold" fill="#c54a3a">Inside:</tspan></text>
    <text x="62.5" y="465"><tspan x="62.5" dy="0">• The Five Rules and the Seven Leverage Points</tspan></text>
    <text x="62.5" y="481"><tspan x="62.5" dy="0">• A 20-Minute Safety Pause before any deposit</tspan></text>
    <text x="62.5" y="497"><tspan x="62.5" dy="0">• A pre-op mental-health self-screen (BDDQ)</tspan></text>
    <text x="62.5" y="513"><tspan x="62.5" dy="0">• The three questions to ask the anesthesia provider</tspan></text>
    <text x="62.5" y="529"><tspan x="62.5" dy="0">• 12 composite scenarios drawn from documented patterns</tspan></text>
    <text x="62.5" y="545"><tspan x="62.5" dy="0">• Word-for-word scripts your companion can use under pressure</tspan></text>
    <text x="62.5" y="561"><tspan x="62.5" dy="0">• 19 reusable worksheets in the back matter</tspan></text>
  </g>

  <!-- Pull quote on back cover -->
  <g transform="translate(80, 615)">
    <text x="0" y="0"   font-family="Georgia, serif" font-size="46" fill="#c54a3a" font-weight="bold" opacity="0.7">&#8220;</text>
    <text x="40" y="-12" font-family="Georgia, serif" font-size="13" fill="#1a1812" font-style="italic">The body is yours. The decision is yours.</text>
    <text x="40" y="5"   font-family="Georgia, serif" font-size="13" fill="#1a1812" font-style="italic">The book is the second pair of eyes.</text>
  </g>

  <!-- Back: bottom — series line + URL -->
  <line x1="62.5" y1="700" x2="562.5" y2="700" stroke="#c54a3a" stroke-width="0.5" opacity="0.6"/>

  <text x="62.5" y="725" font-family="Georgia, serif" font-size="10" fill="#5e6e57" letter-spacing="3">A TABIJI FIELD GUIDE  |  VOLUME TWO</text>
  <text x="62.5" y="744" font-family="Georgia, serif" font-size="10" fill="#5e6e57" font-style="italic">tabiji.ai/book/cosmetic-surgery</text>

  <!-- KDP automatically places its own barcode on the lower-right of the
       back cover with its own white background. The area below is intentionally
       left clear for that barcode. Recommended clear zone:
         x ≈ 362.5 to 562.5, y ≈ 690 to 810 (≈ 2" × 1.2"). -->

  <!-- =========================================================
       SPINE (x: 612.5 to 705.73, width 93.23 = 0.9323")
       Safe text area: x ≈ 618.75 to 699.48 (0.0625" from each fold)
       Center of spine: x = 659.115
       ========================================================= -->

  <!-- TABIJI wordmark at top of spine, rotated -->
  <text transform="translate(656, 60) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="9"
        fill="#c54a3a"
        letter-spacing="3">TABIJI</text>

  <!-- Title on spine, rotated 90° clockwise — left edge of rotated text is
       the top of the printed spine (reads top-to-bottom when book is upright) -->
  <text transform="translate(659.5, 180) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="22"
        font-weight="bold"
        fill="#1a1812">The Cosmetic Surgery Field Guide</text>

  <!-- Author at bottom of spine -->
  <text transform="translate(656, 740) rotate(90)"
        text-anchor="start"
        font-family="Georgia, serif"
        font-size="11"
        fill="#1a1812"
        letter-spacing="2">BERNARD HUANG</text>

  <!-- =========================================================
       FRONT COVER (x: 705.73 to 1305.73, width 600)
       Safe zone: x ≈ 730.73 to 1280.73 (0.25" from each side; KDP requires
       0.5" outside-trim safety for 301+ page books — adding a little more
       inside the right edge below)
       Center of front: x = 1005.73
       Trim: y = 12.5 to 912.5
       ========================================================= -->

  <!-- Front: embedded Steinberg cover art. Shifted up from the original
       lower-2/3 anchor so the figure sits closer to vertical center of
       the cream stage. y=187.5 keeps the illustration's wall-lines and
       window safely below the title and subtitle. -->
  <image xlink:href="cover-art.jpg"
         x="705.73" y="187.5"
         width="600" height="600"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Front: top imprint band -->
  <line x1="800" y1="90" x2="1211.46" y2="90" stroke="#c54a3a" stroke-width="1"/>
  <text x="1005.73" y="70" text-anchor="middle"
        font-family="Georgia, serif" font-size="11" fill="#c54a3a" letter-spacing="4">TABIJI FIELD GUIDES</text>
  <text x="1005.73" y="110" text-anchor="middle"
        font-family="Georgia, serif" font-size="7" fill="#5e6e57" letter-spacing="3" font-style="italic">VOLUME TWO</text>

  <!-- Front: title -->
  <g font-family="Georgia, serif" fill="#1a1812" font-weight="bold">
    <text x="1005.73" y="180" text-anchor="middle" font-size="40">The</text>
    <text x="1005.73" y="232" text-anchor="middle" font-size="40">Cosmetic Surgery</text>
    <text x="1005.73" y="284" text-anchor="middle" font-size="40">Field Guide</text>
  </g>

  <!-- Front: subtitle (sits just above the illustration's top edge) -->
  <text x="1005.73" y="310" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#c54a3a" font-style="italic">A buyer-protection guide to cosmetic surgery abroad</text>

  <!-- Front: bottom rule + byline (sit on the cream floor area of the illustration) -->
  <line x1="855" y1="850" x2="1156.46" y2="850" stroke="#c54a3a" stroke-width="0.8" opacity="0.85"/>
  <text x="1005.73" y="878" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#1a1812" letter-spacing="2">BERNARD HUANG</text>
  <text x="1005.73" y="896" text-anchor="middle" font-family="Georgia, serif" font-size="7" fill="#5e6e57" letter-spacing="3" font-style="italic">EDITOR</text>

</svg>
