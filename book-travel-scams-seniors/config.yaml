isbn: ""  # to be assigned by publisher
edition: "First Edition"

description: >
  Most travel advice for older adults is either useless ("Just be careful")
  or fearful ("Don't go"). Travel Scams for Seniors offers a third path:
  the calm, repeatable habits that protect independent travelers without
  shrinking the trip. Each of 19 chapters covers one scam category — from
  airport "porters" to fake hotel calls to romance fraud — with ready-to-use
  refusal scripts, red-flag checklists, and printable appendices including
  an Emergency Contact Worksheet, a Family Travel Companion Agreement, and
  a complete Pre-Trip Checklist. Written for older travelers and their
  adult children.

