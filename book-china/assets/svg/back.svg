<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- CHINA BACK COVER — watercolor-comic aesthetic                    -->
  <!-- Background: full-bleed hutong-evening scene with red lanterns    -->
  <!-- Overlays: hero headline, pitch, INSIDE/PLUS bullets              -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a0a0a" stop-opacity="0.82"/>
      <stop offset="0.75" stop-color="#1a0a0a" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#1a0a0a" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#1a0a0a" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <image xlink:href="back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <g transform="translate(250 50)">
    <polygon points="-120,0 -110,-7 110,-7 120,0 110,7 -110,7"
             fill="#1a0a0a" fill-opacity="0.7" stroke="#c89a3d" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#c89a3d" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#fdf4e3" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">Wangfujing runs an &#8220;art student&#8221; script you can&#8217;t opt out of.</tspan>
    <tspan x="60" dy="16">The Bund tea-ceremony extracts 1,200 RMB per cup of tea.</tspan>
    <tspan x="60" dy="16">Xi&#8217;an Muslim Quarter &#8220;auntie-tours&#8221; end at an 8,000-RMB jade counter.</tspan>
  </text>

  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#fdf4e3" opacity="0.92">
    <tspan x="60" dy="0">This book documents 98 specific scams across 16 mainland-Chinese</tspan>
    <tspan x="60" dy="15">cities &#8212; drawn from China Daily, Global Times, Xinhua, Shanghai Daily,</tspan>
    <tspan x="60" dy="15">and Public Security Bureau (110) records. You&#8217;ll learn the exact</tspan>
    <tspan x="60" dy="15">scripts scammers use, the red flags that give them away, and the</tspan>
    <tspan x="60" dy="15">Mandarin phrases that shut them down on the spot.</tspan>
  </text>

  <line x1="60" y1="320" x2="440" y2="320" stroke="#c89a3d" stroke-width="0.5"/>

  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c89a3d">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">98 scams with exact Mandarin scripts and RMB amounts</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Six universal red-flag patterns covering every scam in China</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A four-panel watercolor comic for every scam entry</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Beijing, Shanghai, Xi&#8217;an, Chengdu &#38; 12 more cities</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Mandarin phrases with Pinyin &#38; simplified Chinese characters</text>
    </g>
  </g>

  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#c89a3d">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#fdf4e3">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A Mandarin exit-phrase card you can screenshot to your phone</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">A post-scam recovery playbook (first 15 min, first hour, first day)</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#c89a3d"/>
      <text x="14" y="3">Emergency contacts: 110 PSB, 12301 tourist-help, every major hospital</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#c89a3d" stroke-width="0.5"/>

  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#fdf4e3" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
