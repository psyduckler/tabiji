# A+ Content kit — China: Tourist Scams
#
# Drives generators/aplus-content/build_aplus.py. Copy is human-authored;
# comics resolve from scams/<city>/index.html (the Nth scam-comic = scam-N).
# Build:  python3 generators/aplus-content/build_aplus.py book-china

book:
  title: "China: Tourist Scams"
  subtitle: "98 real scams across 16 cities — drawn from Chinese news reports & Public Security Bureau records"

brand:
  logo_url: https://img.tabiji.ai/tabiji-owl-logo.png
  wordmark: TABIJI
  series: Travel Safety Series

modules:
  # 1 — brand anchor
  - type: logo

  # 2 — hero banner: cover-scene comic + baked title (KDP headline shows above)
  - type: hero
    headline: "Don't lose ¥2,000 to a scam you never saw coming."
    eyebrow: "Tabiji Travel Safety Series"
    title: "CHINA"
    title_sub: "Tourist Scams · 2026 Edition"
    hook: "The exact scripts touts use at the Forbidden City, the Bund and the Terracotta Army — and the moves that shut each one down."
    stat: "98 SCAMS · 16 CITIES · SOURCED FROM PSB RECORDS"
    comic: { city: beijing, n: 2 }   # Art Student Gallery Trap — matches the book cover

  # 3 — the comic showcase: four distinct scam archetypes
  - type: quad
    headline: "Four scams you'll meet in the first 48 hours"
    tiles:
      - city: beijing
        n: 3            # Wangfujing & Qianmen Tea House
        title: "The Wangfujing 'Tea Ceremony'"
        body: "Strangers near the Forbidden City walk you to a side-street tea house — then a ¥3,000–¥8,000 bill arrives and the door won't open until you pay."
      - city: xian
        n: 1            # Fake Terracotta Army Site
        title: "The Fake Terracotta Army"
        body: "Drivers detour you to replica 'warriors' 35 km short of the real site, or bundle it into a commission-heavy shopping tour with 90 rushed minutes at the pits."
      - city: chengdu
        n: 1            # Airport taxi
        title: "The Airport 'Fixed-Price' Taxi"
        body: "Touts inside the terminal quote ¥500–¥800 for a ride the meter runs at ¥180. The metro does the same trip for ¥9 — scam-proof."
      - city: beijing
        n: 5            # Great Wall fake ticket / budget tour
        title: "The ¥150 Great Wall 'Day Trip'"
        body: "That all-inclusive lobby tour pays for itself with four or five jade-and-silk shopping stops, leaving you 90 crowded minutes at Badaling."

  # 4 — "what's inside": one comic + the value stack
  - type: feature
    headline: "Not just a list — a field manual"
    comic: { city: shanghai, n: 1 }   # Nanjing Road tea house
    # Plain text — KDP A+ text fields take no HTML (bold via the editor toolbar).
    # The preview bolds the label before the em-dash for you.
    bullets:
      - "98 scams across 16 cities — Beijing, Shanghai, Xi'an, Chengdu, Guilin, Lijiang, Harbin and more"
      - "Sourced from Chinese-language reporting — South China Morning Post, Global Times, China Daily and Xinhua, plus Public Security Bureau and tourist-police records"
      - "A Mandarin exit-phrase card — Pinyin and characters, to end an approach in seconds"
      - "A post-scam recovery playbook — what to do in the first hour, who to call, how to dispute a charge"
      - "Emergency contacts — police, embassies and tourist hotlines for every major destination"
      - "Illustrated throughout in a Feng Zikai brush-cartoon style"

  # 5 — closing trust block (text only)
  - type: text
    headline: "Why travelers trust Tabiji"
    body: "Every scam in this book is documented from real traveler accounts and verified against local news and official safety advisories — never invented, never recycled from another country. The series is re-researched every year: buy once, and re-download future editions from your Amazon library at no extra cost. It's pocket-sized for the moment a stranger smiles and says, 'Come — just five minutes, very famous tea house.'"
