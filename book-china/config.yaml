title: "China Tourist Scams 2026"
subtitle: "98 Real Scams Across Beijing, Shanghai, Xi'an & 13 More Cities — Drawn from Chinese News Reports and Public Security Bureau Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose ¥2,000 in China. This book documents 98 tourist scams
  across 16 mainland-Chinese cities — drawn from Chinese news
  reports (South China Morning Post, Global Times, China Daily,
  Xinhua), Public Security Bureau and tourist-police records, and
  real traveler accounts. You'll learn the exact scripts tea-house
  touts use at the Forbidden City, the moves that stop Shanghai
  Bund "art student" approaches, and the Mandarin phrases that end
  an argument in seconds. Includes a Mandarin exit-phrase card
  (Pinyin + characters), a post-scam recovery playbook, and
  emergency contacts for every major Chinese destination.

