title: "France Tourist Scams 2026"
subtitle: "191 Real Scams Across Paris, Nice, Provence & 13 More Cities — Drawn from French News Reports and Gendarmerie Records"
author: "The Tabiji Team"
publisher: "Tabiji"
language: en-US
rights: "Copyright (c) 2026 Tabiji. All rights reserved."
description: >
  Don't lose €1,000 in France. This book documents 191 tourist scams across
  16 French cities — drawn from French news reports (Le Parisien, Le Figaro,
  Nice-Matin, La Provence, Ouest-France, Le Dauphiné Libéré, Sud Ouest),
  official gendarmerie and police records, and real traveler accounts.
  You'll learn the exact scripts scammers use, the red flags that give them
  away, and the French phrases that shut them down. Includes a French
  exit-phrase card, a post-scam recovery playbook, and emergency contacts
  for every major French city.

# Cities in intended reading order
# Paris → Riviera → Provence → Alps/Rhône → Atlantic/Southwest → Alsace/North
cities:
  - paris
  - nice
  - cannes
  - st-tropez
  - marseille
  - avignon
  - montpellier
  - toulouse
  - lyon
  - chamonix
  - annecy
  - bordeaux
  - biarritz
  - strasbourg
  - colmar
  - mont-saint-michel

# Path to scam JSON data — France data lives in the public API tree, which is
# regenerated from scams/research/batch-<city>.json on every France sync.
# The build reads only the slugs listed above; other countries in this dir
# are ignored.
scam_data_dir: ../api/v1/scams

# Output
output_dir: build
output_filename: france-scams
