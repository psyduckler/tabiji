<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="mySkyBack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E8A454"/>
      <stop offset="0.35" stop-color="#E88A3C"/>
      <stop offset="0.65" stop-color="#1DA5A0"/>
      <stop offset="1" stop-color="#0F5F5C"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#mySkyBack)"/>

  <!-- Double-rule cream frame -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#FFF3DC" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#FFF3DC" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="60" y="70" font-family="Georgia, serif" font-size="10" letter-spacing="4" fill="#FFF3DC">T A B I J I . A I</text>
  <text x="440" y="70" font-family="Georgia, serif" font-style="italic" font-size="10" fill="#FFE39C" text-anchor="end">Travel Safety Series</text>
  <line x1="60" y1="84" x2="440" y2="84" stroke="#FFF3DC" stroke-width="0.5" opacity="0.7"/>

  <!-- Hero headline -->
  <text x="60" y="156" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">What the guidebooks</text>
  <text x="60" y="194" font-family="Georgia, serif" font-weight="700" font-size="30" fill="#FFF3DC" letter-spacing="-0.3">won&#8217;t tell you.</text>
  <rect x="60" y="210" width="60" height="1.8" fill="#FFF3DC"/>

  <!-- Italic pitch paragraph -->
  <text x="60" y="250" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFE39C">You&#8217;re about to spend thousands on the trip of a</text>
  <text x="60" y="270" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFE39C">lifetime. Don&#8217;t lose a ringgit of it to a KLIA2 teksi sapu</text>
  <text x="60" y="290" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFE39C">tout, a Langkawi jet-ski shakedown, or a Melaka</text>
  <text x="60" y="310" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFE39C">QR-code scam that eats RM 3,000 in a week.</text>

  <!-- Body pitch paragraph -->
  <text x="60" y="350" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">This book documents 60 tourist scams across 10</text>
  <text x="60" y="368" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Malaysian cities &#8212; sourced from r/malaysia,</text>
  <text x="60" y="386" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">r/KualaLumpur, r/Sabah, New Straits Times, The Star,</text>
  <text x="60" y="404" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">FMT, PDRM &amp; KPDN advisories. You&#8217;ll learn the exact</text>
  <text x="60" y="422" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">scripts scammers use, red flags, and moves that shut them down.</text>

  <!-- Inside bullets -->
  <text x="60" y="462" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#FFF3DC" font-weight="700">Inside:</text>
  <circle cx="66" cy="492" r="2" fill="#FFF3DC"/>
  <text x="78" y="496" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The KLIA2 &#8220;teksi sapu&#8221; airport taxi overcharge + Grab cancellation</text>
  <circle cx="66" cy="516" r="2" fill="#FFF3DC"/>
  <text x="78" y="520" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">The Melaka QR-code receipt scam (Apr 2026 Melaka Tengah arrests)</text>
  <circle cx="66" cy="540" r="2" fill="#FFF3DC"/>
  <text x="78" y="544" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Langkawi jet-ski damage-compensation shakedown (RM 500&#8211;RM 2,000)</text>
  <circle cx="66" cy="564" r="2" fill="#FFF3DC"/>
  <text x="78" y="568" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Mt Kinabalu fake climbing-package (RM 18,000 loss documented)</text>
  <circle cx="66" cy="588" r="2" fill="#FFF3DC"/>
  <text x="78" y="592" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Fake MDAC immigration website &#8212; the free form that costs RM 145</text>

  <!-- Divider -->
  <line x1="60" y1="618" x2="440" y2="618" stroke="#FFF3DC" stroke-width="0.5" opacity="0.6"/>

  <!-- Plus bullets -->
  <text x="60" y="644" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#FFF3DC" font-weight="700">Plus:</text>
  <circle cx="66" cy="670" r="2" fill="#FFF3DC"/>
  <text x="78" y="674" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Bahasa Malaysia exit-phrase card</text>
  <circle cx="66" cy="692" r="2" fill="#FFF3DC"/>
  <text x="78" y="696" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Post-scam recovery playbook (999 / 997 NSRC / KPDN / PDRM)</text>
  <circle cx="66" cy="714" r="2" fill="#FFF3DC"/>
  <text x="78" y="718" font-family="Georgia, serif" font-size="12" fill="#FFF3DC">Emergency contacts for all 10 cities</text>

  <!-- Amazon barcode safe zone (blank bottom-right) -->
</svg>
