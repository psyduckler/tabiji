<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- MALAYSIA BACK COVER — Peranakan/Nyonya pastel watercolor scene   -->
  <!-- Background: full-bleed George Town shophouse street, golden hour -->
  <!-- Overlays: hero headline, italic pitch, INSIDE/PLUS bullets       -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="dimOverlay" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1a0f08" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#1a0f08" stop-opacity="0.78"/>
      <stop offset="0.85" stop-color="#1a0f08" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1a0f08" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED ILLUSTRATION BACKGROUND -->
  <image xlink:href="https://img.tabiji.ai/book-malaysia/assets/svg/back.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Full-height dark gradient for text legibility; lightens toward bottom -->
  <rect x="0" y="0" width="500" height="800" fill="url(#dimOverlay)"/>

  <!-- TOP CHEVRON BAR -->
  <g transform="translate(250 50)">
    <polygon points="-130,0 -120,-7 120,-7 130,0 120,7 -120,7"
             fill="#1a0f08" fill-opacity="0.7" stroke="#FFE3B0" stroke-width="0.9"/>
    <text x="0" y="3" font-family="Georgia, serif" font-size="9"
          fill="#FFE3B0" text-anchor="middle" letter-spacing="4">TABIJI &#183; TRAVEL SAFETY</text>
  </g>

  <!-- HERO HEADLINE -->
  <text x="250" y="108" font-family="Georgia, serif" font-weight="700" font-size="24"
        fill="#FFF6E8" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>

  <!-- ITALIC PITCH PARAGRAPH (3 specific scams, Malaysian) -->
  <text x="60" y="148" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#FFF6E8" opacity="0.95">
    <tspan x="60" dy="0">KLIA2 &#8220;teksi sapu&#8221; touts quote RM 70 and charge RM 250.</tspan>
    <tspan x="60" dy="16">Langkawi jet-ski operators stage damage and demand RM 4,000.</tspan>
    <tspan x="60" dy="16">Melaka warungs flash QR codes that route to a stranger&#8217;s wallet.</tspan>
  </text>

  <!-- BODY PITCH PARAGRAPH -->
  <text x="60" y="218" font-family="Georgia, serif" font-size="11.5"
        fill="#FFF6E8" opacity="0.95">
    <tspan x="60" dy="0">This book documents 60 specific scams across 10 Malaysian</tspan>
    <tspan x="60" dy="15">cities &#8212; drawn from r/malaysia, r/KualaLumpur, r/penang,</tspan>
    <tspan x="60" dy="15">the New Straits Times, The Star, FMT, Bernama, and PDRM /</tspan>
    <tspan x="60" dy="15">KPDN / NSRC advisories. You&#8217;ll learn the scripts, the red</tspan>
    <tspan x="60" dy="15">flags, and the Bahasa Malaysia phrases that shut them down.</tspan>
  </text>

  <!-- GOLD DIVIDER -->
  <line x1="60" y1="320" x2="440" y2="320" stroke="#FFE3B0" stroke-width="0.5"/>

  <!-- INSIDE -->
  <text x="60" y="340" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#FFE3B0">INSIDE</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#FFF6E8">
    <g transform="translate(60 362)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">The KLIA2 teksi sapu airport-tout shakedown &#8212; and how to break it</text>
    </g>
    <g transform="translate(60 380)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">Why Mt Kinabalu &#8220;guide packages&#8221; cost RM 18,000 (paid in cash)</text>
    </g>
    <g transform="translate(60 398)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">The Langkawi jet-ski damage-deposit shakedown</text>
    </g>
    <g transform="translate(60 416)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">The Melaka QR-code receipt swap and Penang shophouse hawker tactics</text>
    </g>
    <g transform="translate(60 434)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">The Genting Highlands cable-car &#8220;closed&#8221; private-driver detour</text>
    </g>
  </g>

  <!-- PLUS -->
  <text x="60" y="464" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#FFE3B0">PLUS</text>
  <g font-family="Georgia, serif" font-size="11.5" fill="#FFF6E8">
    <g transform="translate(60 484)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">A Bahasa Malaysia exit-phrase card you can screenshot</text>
    </g>
    <g transform="translate(60 502)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">A post-scam recovery playbook (999 / 997 NSRC / KPDN / PDRM)</text>
    </g>
    <g transform="translate(60 520)">
      <polygon points="0,0 5,-3 5,3" fill="#FFE3B0"/>
      <text x="14" y="3">Emergency contacts and tourist-police desks for all 10 cities</text>
    </g>
  </g>

  <line x1="60" y1="548" x2="440" y2="548" stroke="#FFE3B0" stroke-width="0.5"/>

  <!-- FOOTER -->
  <text x="250" y="770" font-family="Georgia, serif" font-size="9"
        fill="#FFF6E8" text-anchor="middle" letter-spacing="5" opacity="0.85">KINDLE EDITION &#183; 2026</text>
</svg>
