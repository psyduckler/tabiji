<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- MALAYSIA BACK COVER — Peranakan/Nyonya pastel heritage style     -->
  <!-- George Town shophouse hero illustration centered, copy framing  -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="topBandBack" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="1" stop-color="#FBE8DA"/>
    </linearGradient>
  </defs>

  <!-- Cream base -->
  <rect x="0" y="0" width="500" height="800" fill="#FFF6E8"/>

  <!-- HERO ILLUSTRATION (1:1 native 500x500, anchored top below masthead) -->
  <image xlink:href="back.jpg" x="0" y="50" width="500" height="500"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Decorative gilt rules above + below illustration -->
  <line x1="0" y1="50" x2="500" y2="50" stroke="#C9A24A" stroke-width="0.8" opacity="0.85"/>
  <line x1="0" y1="550" x2="500" y2="550" stroke="#C9A24A" stroke-width="0.8" opacity="0.85"/>

  <!-- Outer cream double-rule frame -->
  <rect x="20" y="20" width="460" height="760" fill="none" stroke="#C9A24A" stroke-width="0.8" opacity="0.7"/>
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#C9A24A" stroke-width="0.4" opacity="0.5"/>

  <!-- ============= TOP MASTHEAD ============= -->
  <text x="60" y="40" font-family="Georgia, serif" font-size="10"
        letter-spacing="4" fill="#A07530">T A B I J I . A I</text>
  <text x="440" y="40" font-family="Georgia, serif" font-style="italic" font-size="10"
        fill="#7A4F26" text-anchor="end">Travel Safety Series</text>

  <!-- ============= HERO HEADLINE (under illustration) ============= -->
  <text x="250" y="586" font-family="Georgia, serif" font-weight="700" font-size="22"
        fill="#7A4F26" text-anchor="middle">What the guidebooks won&#8217;t tell you.</text>
  <line x1="170" y1="600" x2="330" y2="600" stroke="#C9A24A" stroke-width="0.6"/>

  <!-- ============= ITALIC PITCH ============= -->
  <text x="60" y="624" font-family="Georgia, serif" font-style="italic" font-size="11"
        fill="#7A4F26">
    <tspan x="60" dy="0">You&#8217;re about to spend thousands on the trip of a lifetime.</tspan>
    <tspan x="60" dy="14">Don&#8217;t lose a ringgit of it to a KLIA2 teksi sapu tout, a</tspan>
    <tspan x="60" dy="14">Langkawi jet-ski shakedown, or a Melaka QR-code scam.</tspan>
  </text>

  <!-- ============= INSIDE BULLETS (compact, gold-arrow) ============= -->
  <text x="60" y="688" font-family="Georgia, serif" font-size="9"
        letter-spacing="4" fill="#A07530">INSIDE</text>
  <g font-family="Georgia, serif" font-size="10.5" fill="#7A4F26">
    <g transform="translate(60 706)">
      <polygon points="0,0 5,-3 5,3" fill="#C9A24A"/>
      <text x="14" y="3">KLIA2 &#8220;teksi sapu&#8221; airport-taxi overcharge + Grab cancels</text>
    </g>
    <g transform="translate(60 722)">
      <polygon points="0,0 5,-3 5,3" fill="#C9A24A"/>
      <text x="14" y="3">Mt Kinabalu fake climbing-package (RM 18,000 documented loss)</text>
    </g>
    <g transform="translate(60 738)">
      <polygon points="0,0 5,-3 5,3" fill="#C9A24A"/>
      <text x="14" y="3">Bahasa Malaysia exit-phrase card (the line that stops them cold)</text>
    </g>
    <g transform="translate(60 754)">
      <polygon points="0,0 5,-3 5,3" fill="#C9A24A"/>
      <text x="14" y="3">Post-scam recovery (999 / 997 NSRC / KPDN / PDRM)</text>
    </g>
  </g>

  <!-- ============= FOOTER ============= -->
  <text x="250" y="782" font-family="Georgia, serif" font-size="8"
        fill="#A07530" text-anchor="middle" letter-spacing="5" opacity="0.85">10 CITIES &#183; 60 SCAMS &#183; 2026 EDITION</text>
</svg>
