<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- MALAYSIA FRONT COVER — Peranakan/Nyonya pastel heritage style    -->
  <!-- 500x500 hero illustration centered, title band above, hook below -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF6E8"/>
      <stop offset="1" stop-color="#FBE8DA"/>
    </linearGradient>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FBE8DA"/>
      <stop offset="1" stop-color="#F4D9C7"/>
    </linearGradient>
  </defs>

  <!-- Cream base for full canvas (visible above + below the 500x500 hero) -->
  <rect x="0" y="0" width="500" height="800" fill="#FFF6E8"/>

  <!-- TOP BAND (cream, holds masthead + title + subtitle) -->
  <rect x="0" y="0" width="500" height="180" fill="url(#topBand)"/>

  <!-- BOTTOM BAND (warm cream, holds stat badge + hook + footer) -->
  <rect x="0" y="680" width="500" height="120" fill="url(#bottomBand)"/>

  <!-- HERO ILLUSTRATION (1:1 at native 500x500) -->
  <image xlink:href="front.jpg" x="0" y="180" width="500" height="500"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- Decorative gilt rules above and below the illustration -->
  <line x1="0" y1="180" x2="500" y2="180" stroke="#C9A24A" stroke-width="0.8" opacity="0.85"/>
  <line x1="0" y1="680" x2="500" y2="680" stroke="#C9A24A" stroke-width="0.8" opacity="0.85"/>

  <!-- Outer cream double-rule frame -->
  <rect x="20" y="20" width="460" height="760" fill="none" stroke="#C9A24A" stroke-width="0.8" opacity="0.7"/>
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#C9A24A" stroke-width="0.4" opacity="0.5"/>

  <!-- ============= MASTHEAD ============= -->
  <text x="250" y="58" font-family="Georgia, serif" font-size="10"
        letter-spacing="6" fill="#A07530" text-anchor="middle">T A B I J I . A I</text>
  <line x1="210" y1="68" x2="290" y2="68" stroke="#A07530" stroke-width="0.4" opacity="0.7"/>
  <text x="250" y="84" font-family="Georgia, serif" font-style="italic" font-size="11"
        fill="#7A4F26" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>

  <!-- ============= TITLE ============= -->
  <text x="250" y="130" font-family="Georgia, serif" font-weight="700" font-size="44"
        fill="#7A4F26" text-anchor="middle" letter-spacing="-1">MALAYSIA</text>

  <!-- Ornamental peony rule under title -->
  <g transform="translate(250 152)" fill="#C9A24A">
    <line x1="-90" y1="0" x2="-22" y2="0" stroke="#C9A24A" stroke-width="0.6"/>
    <line x1="22" y1="0" x2="90" y2="0" stroke="#C9A24A" stroke-width="0.6"/>
    <ellipse cx="-12" cy="0" rx="6" ry="1.8" transform="rotate(-20 -12 0)"/>
    <polygon points="0,-4 3,0 0,4 -3,0"/>
    <ellipse cx="12" cy="0" rx="6" ry="1.8" transform="rotate(20 12 0)"/>
  </g>

  <!-- ============= SUBTITLE ============= -->
  <text x="250" y="172" font-family="Georgia, serif" font-style="italic" font-size="20"
        fill="#7A4F26" text-anchor="middle">Tourist Scams</text>

  <!-- ============= STAT BADGE (above hook) ============= -->
  <g transform="translate(250 718)">
    <rect x="-72" y="-18" width="144" height="34" fill="#FFF6E8"
          stroke="#C9A24A" stroke-width="1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="19"
          fill="#7A4F26" text-anchor="middle">60</text>
    <text x="0" y="11" font-family="Georgia, serif" font-size="7"
          fill="#A07530" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- ============= HOOK ============= -->
  <text x="250" y="758" font-family="Georgia, serif" font-weight="700" font-size="17"
        fill="#7A4F26" text-anchor="middle">Don&#8217;t Lose RM 1,000 in Malaysia</text>

  <!-- ============= FOOTER ============= -->
  <text x="250" y="778" font-family="Georgia, serif" font-size="9"
        fill="#A07530" text-anchor="middle" letter-spacing="4">10 CITIES &#183; 2026 EDITION &#183; BY TABIJI</text>
</svg>
