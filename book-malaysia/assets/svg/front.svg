<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Yusof Gajah folk-naïf palette: marigold → tropical turquoise → deep forest -->
    <linearGradient id="mySky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#E8A454"/>
      <stop offset="0.35" stop-color="#E88A3C"/>
      <stop offset="0.65" stop-color="#1DA5A0"/>
      <stop offset="1" stop-color="#0F5F5C"/>
    </linearGradient>
  </defs>
  <rect width="500" height="800" fill="url(#mySky)"/>

  <!-- Double-rule cream frame -->
  <rect x="28" y="28" width="444" height="744" fill="none" stroke="#FFF3DC" stroke-width="1"/>
  <rect x="36" y="36" width="428" height="728" fill="none" stroke="#FFF3DC" stroke-width="0.4" opacity="0.7"/>

  <!-- Masthead -->
  <text x="250" y="82" font-family="Georgia, serif" font-size="11" letter-spacing="6" fill="#FFF3DC" text-anchor="middle">T A B I J I . A I</text>
  <line x1="205" y1="98" x2="295" y2="98" stroke="#FFF3DC" stroke-width="0.5"/>
  <text x="250" y="116" font-family="Georgia, serif" font-style="italic" font-size="11" fill="#FFE39C" text-anchor="middle" letter-spacing="1">Travel Safety Series</text>
  <text x="250" y="134" font-family="Georgia, serif" font-size="9" letter-spacing="5" fill="#FFF3DC" text-anchor="middle" opacity="0.9">MALAYSIA EDITION</text>

  <!-- Ornamental fleuron (Yusof Gajah-inspired lotus + dots) -->
  <g transform="translate(250 182)" fill="#FFF3DC">
    <polygon points="0,-6 4,0 0,6 -4,0" opacity="0.95"/>
    <ellipse cx="-14" cy="0" rx="8" ry="2.2" transform="rotate(-15 -14 0)" opacity="0.85"/>
    <ellipse cx="14" cy="0" rx="8" ry="2.2" transform="rotate(15 14 0)" opacity="0.85"/>
    <circle cx="-26" cy="0" r="1.6"/>
    <circle cx="26" cy="0" r="1.6"/>
    <line x1="-80" y1="0" x2="-34" y2="0" stroke="#FFF3DC" stroke-width="0.4" opacity="0.5"/>
    <line x1="34" y1="0" x2="80" y2="0" stroke="#FFF3DC" stroke-width="0.4" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="250" y="270" font-family="Georgia, serif" font-weight="700" font-size="76" fill="#FFF3DC" text-anchor="middle" letter-spacing="-2">MALAYSIA</text>

  <!-- Ornamental divider -->
  <g transform="translate(250 310)">
    <line x1="-120" y1="0" x2="-22" y2="0" stroke="#FFF3DC" stroke-width="0.8"/>
    <line x1="22" y1="0" x2="120" y2="0" stroke="#FFF3DC" stroke-width="0.8"/>
    <g fill="#FFF3DC">
      <ellipse cx="-14" cy="0" rx="8" ry="2.4" transform="rotate(-25 -14 0)"/>
      <ellipse cx="0" cy="0" rx="5" ry="1.8"/>
      <ellipse cx="14" cy="0" rx="8" ry="2.4" transform="rotate(25 14 0)"/>
    </g>
  </g>

  <text x="250" y="354" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#FFE39C" text-anchor="middle">Tourist Scams</text>
  <text x="250" y="384" font-family="Georgia, serif" font-size="13" fill="#FFF3DC" text-anchor="middle" letter-spacing="5">A TRAVELER&#8217;S FIELD GUIDE &#183; MMXXVI</text>

  <!-- Circular hibiscus seal — 10 lotus petals around the rim (matches 10 cities) -->
  <g transform="translate(250 510)">
    <circle cx="0" cy="0" r="72" fill="none" stroke="#FFF3DC" stroke-width="1.4"/>
    <circle cx="0" cy="0" r="62" fill="none" stroke="#FFF3DC" stroke-width="0.5"/>
    <!-- 10 petal dots -->
    <g fill="#FFE39C" opacity="0.95">
      <circle cx="0" cy="-52" r="2.4"/>
      <circle cx="31" cy="-42" r="2.4"/>
      <circle cx="49" cy="-16" r="2.4"/>
      <circle cx="49" cy="16" r="2.4"/>
      <circle cx="31" cy="42" r="2.4"/>
      <circle cx="0" cy="52" r="2.4"/>
      <circle cx="-31" cy="42" r="2.4"/>
      <circle cx="-49" cy="16" r="2.4"/>
      <circle cx="-49" cy="-16" r="2.4"/>
      <circle cx="-31" cy="-42" r="2.4"/>
    </g>
    <!-- Lotus sprig at base -->
    <g transform="translate(0 74)" fill="#FFF3DC" opacity="0.95">
      <path d="M 0 -4 L 0 10" stroke="#FFF3DC" stroke-width="1" fill="none"/>
      <ellipse cx="-10" cy="4" rx="12" ry="3" transform="rotate(-30 -10 4)" opacity="0.9"/>
      <ellipse cx="10" cy="4" rx="12" ry="3" transform="rotate(30 10 4)" opacity="0.9"/>
    </g>
    <!-- Center stat -->
    <text x="0" y="-8" font-family="Georgia, serif" font-weight="700" font-size="36" fill="#FFF3DC" text-anchor="middle">60</text>
    <text x="0" y="12" font-family="Georgia, serif" font-size="9" fill="#FFE39C" text-anchor="middle" letter-spacing="3">DOCUMENTED</text>
    <text x="0" y="26" font-family="Georgia, serif" font-size="9" fill="#FFE39C" text-anchor="middle" letter-spacing="3">SCAMS</text>
  </g>

  <!-- Hook block -->
  <line x1="90" y1="644" x2="410" y2="644" stroke="#FFF3DC" stroke-width="0.6"/>
  <text x="250" y="678" font-family="Georgia, serif" font-weight="700" font-size="24" fill="#FFF3DC" text-anchor="middle">Don&#8217;t Lose RM 1,000 in Malaysia</text>
  <text x="250" y="704" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#FFE39C" text-anchor="middle">Drawn from Reddit, Malaysian press &amp; PDRM advisories.</text>
  <line x1="90" y1="722" x2="410" y2="722" stroke="#FFF3DC" stroke-width="0.6"/>

  <!-- Footer -->
  <text x="250" y="742" font-family="Georgia, serif" font-size="12" fill="#FFE39C" text-anchor="middle" letter-spacing="4">10 CITIES &#183; 2026 EDITION</text>
  <text x="250" y="756" font-family="Georgia, serif" font-size="9" fill="#FFF3DC" text-anchor="middle" letter-spacing="5" opacity="0.9">BY TABIJI</text>
</svg>
