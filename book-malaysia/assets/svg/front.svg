<svg viewBox="0 0 500 800" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     preserveAspectRatio="xMidYMid meet">
  <!-- ================================================================ -->
  <!-- MALAYSIA FRONT COVER — Peranakan/Nyonya pastel watercolor scene  -->
  <!-- KLIA2 'teksi sapu' airport-tout shakedown, full-bleed background -->
  <!-- with title overlay in upper sky band + dark hook band at bottom  -->
  <!-- ================================================================ -->
  <defs>
    <linearGradient id="topBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF6E8" stop-opacity="0.92"/>
      <stop offset="0.65" stop-color="#FFF6E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFF6E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomBand" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#3a1d12" stop-opacity="0"/>
      <stop offset="0.32" stop-color="#3a1d12" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#1a0f08" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <!-- FULL-BLEED ILLUSTRATION BACKGROUND.
       build.py inlines this as a base64 data URI before rsvg-convert renders,
       so the path lookup succeeds whether the JPG sits next to the SVG or in
       assets/covers/. -->
  <image xlink:href="https://img.tabiji.ai/book-malaysia/assets/svg/front.jpg" x="0" y="0" width="500" height="800"
         preserveAspectRatio="xMidYMid slice"/>

  <!-- TOP BAND: cream gradient over the watercolor sky for title legibility -->
  <rect x="0" y="0" width="500" height="240" fill="url(#topBand)"/>

  <!-- Cream double-rule frame -->
  <rect x="20" y="20" width="460" height="760" fill="none"
        stroke="#FFF6E8" stroke-width="1" opacity="0.7"/>
  <rect x="28" y="28" width="444" height="744" fill="none"
        stroke="#FFF6E8" stroke-width="0.4" opacity="0.45"/>

  <!-- ============= MASTHEAD ============= -->
  <text x="250" y="58" font-family="Georgia, serif" font-size="11"
        letter-spacing="6" fill="#7A4F26" text-anchor="middle"
        style="paint-order: stroke; stroke: #FFF6E8; stroke-width: 2px;">T A B I J I . A I</text>
  <line x1="205" y1="74" x2="295" y2="74" stroke="#7A4F26" stroke-width="0.5" opacity="0.8"/>
  <text x="250" y="92" font-family="Georgia, serif" font-style="italic" font-size="11"
        fill="#7A4F26" text-anchor="middle" letter-spacing="1"
        style="paint-order: stroke; stroke: #FFF6E8; stroke-width: 2px;">Travel Safety Series</text>

  <!-- ============= TITLE ============= -->
  <!-- Paint-order stroke gives a thick cream halo for legibility against any sky -->
  <text x="250" y="156" font-family="Georgia, serif" font-weight="700" font-size="64"
        fill="#7A4F26" text-anchor="middle" letter-spacing="-2"
        style="paint-order: stroke; stroke: #FFF6E8; stroke-width: 4px;">MALAYSIA</text>

  <!-- Ornamental peony rule under title (Peranakan motif) -->
  <g transform="translate(250 178)" fill="#C9A24A">
    <line x1="-90" y1="0" x2="-22" y2="0" stroke="#C9A24A" stroke-width="0.7"/>
    <line x1="22" y1="0" x2="90" y2="0" stroke="#C9A24A" stroke-width="0.7"/>
    <ellipse cx="-12" cy="0" rx="6" ry="1.8" transform="rotate(-20 -12 0)"/>
    <polygon points="0,-4 3,0 0,4 -3,0"/>
    <ellipse cx="12" cy="0" rx="6" ry="1.8" transform="rotate(20 12 0)"/>
  </g>

  <!-- ============= SUBTITLE ============= -->
  <text x="250" y="206" font-family="Georgia, serif" font-style="italic" font-size="22"
        fill="#7A4F26" text-anchor="middle"
        style="paint-order: stroke; stroke: #FFF6E8; stroke-width: 3px;">Tourist Scams</text>

  <text x="250" y="228" font-family="Georgia, serif" font-size="10"
        fill="#7A4F26" text-anchor="middle" letter-spacing="4"
        style="paint-order: stroke; stroke: #FFF6E8; stroke-width: 1.8px;">A TRAVELER&#8217;S FIELD GUIDE &#183; MMXXVI</text>

  <!-- BOTTOM BAND: dark gradient for hook block legibility -->
  <rect x="0" y="560" width="500" height="240" fill="url(#bottomBand)"/>

  <!-- ============= STAT BADGE ============= -->
  <g transform="translate(250 612)">
    <rect x="-72" y="-22" width="144" height="44" fill="none"
          stroke="#FFE3B0" stroke-width="1.1" rx="2"/>
    <text x="0" y="-2" font-family="Georgia, serif" font-weight="700" font-size="22"
          fill="#FFF6E8" text-anchor="middle">60</text>
    <text x="0" y="14" font-family="Georgia, serif" font-size="8"
          fill="#FFE3B0" text-anchor="middle" letter-spacing="3">DOCUMENTED SCAMS</text>
  </g>

  <!-- ============= HOOK BLOCK ============= -->
  <line x1="80" y1="660" x2="420" y2="660" stroke="#FFE3B0" stroke-width="0.6" opacity="0.7"/>
  <text x="250" y="694" font-family="Georgia, serif" font-weight="700" font-size="22"
        fill="#FFF6E8" text-anchor="middle"
        style="paint-order: stroke; stroke: #1a0f08; stroke-width: 2px;">Don&#8217;t Lose RM 1,000 in Malaysia</text>
  <text x="250" y="720" font-family="Georgia, serif" font-style="italic" font-size="12"
        fill="#FFE3B0" text-anchor="middle">Drawn from Reddit, Malaysian press &amp; PDRM advisories.</text>
  <line x1="80" y1="736" x2="420" y2="736" stroke="#FFE3B0" stroke-width="0.6" opacity="0.7"/>

  <!-- ============= FOOTER ============= -->
  <text x="250" y="754" font-family="Georgia, serif" font-size="10"
        fill="#FFE3B0" text-anchor="middle" letter-spacing="4">10 CITIES &#183; 2026 EDITION</text>
  <text x="250" y="770" font-family="Georgia, serif" font-size="8"
        fill="#FFF6E8" text-anchor="middle" letter-spacing="5" opacity="0.85">BY TABIJI</text>
</svg>
