
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Destination Finder | tabiji.ai</title>
    <meta name="description" content="Find your perfect trip. Filter 100+ destinations by travel style, trip type, continent, and budget.">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D7QHNRXLHJ"></script>
    <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-D7QHNRXLHJ');</script>
    <style>
        :root { --indigo: #2D3A5C; --terracotta: #C4704B; --warm-cream: #F5F0E8; --sand: #E8DFD0; --earth: #8B7355; --white: #FEFCF9; --text: #2C2419; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background-color: var(--white); color: var(--text); margin: 0; }
        .header { background: var(--warm-cream); padding: 4rem 2rem 3rem; text-align: center; border-bottom: 1px solid var(--sand); }
        .header h1 { font-size: 2.5rem; color: var(--indigo); margin: 0 0 0.5rem 0; }
        .header p { font-size: 1.1rem; color: var(--earth); max-width: 500px; margin: 0 auto; }
        .filters { padding: 2rem; max-width: 1000px; margin: 0 auto; }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group h3 { font-size: 0.9rem; color: var(--earth); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.75rem; }
        .chips { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .chip { background: var(--sand); color: var(--earth); padding: 0.5rem 1rem; border-radius: 100px; cursor: pointer; transition: all 0.2s ease; font-weight: 500; }
        .chip.active { background: var(--indigo); color: white; }
        .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; padding: 0 2rem 4rem; max-width: 1200px; margin: 0 auto; }
        .dest-card { background: var(--warm-cream); border-radius: 15px; overflow: hidden; display: none; }
        .dest-card.visible { display: block; }
        .dest-card img { width: 100%; height: 180px; object-fit: cover; }
        .dest-card-content { padding: 1rem 1.25rem; }
        .dest-card h3 { color: var(--indigo); margin: 0 0 0.25rem 0; }
        .dest-card p { color: var(--earth); margin: 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Destination Finder</h1>
        <p>Your perfect trip is just a few clicks away. Select your preferences and discover where you're headed next.</p>
    </div>

    <div class="filters">
        <div class="filter-group">
            <h3>Trip Style</h3>
            <div class="chips" id="style-filter" data-filter="style">
                <div class="chip" data-value="adventure">Adventure</div>
                <div class="chip" data-value="relax">Relax</div>
                <div class="chip" data-value="culture">Culture</div>
                <div class="chip" data-value="food">Food</div>
            </div>
        </div>
        <div class="filter-group">
            <h3>Budget</h3>
            <div class="chips" id="budget-filter" data-filter="budget">
                <div class="chip" data-value="budget">Budget ($)</div>
                <div class="chip" data-value="mid">Mid-range ($$)</div>
                <div class="chip" data-value="luxury">Luxury ($$$)</div>
            </div>
        </div>
    </div>

    <div class="results" id="results"></div>

    <script>
        const destinations = [
            { name: 'Kyoto', img: 'https://images.unsplash.com/photo-1528164344705-47542687000d?w=400', style: ['culture', 'food'], budget: 'mid' },
            { name: 'Costa Rica', img: 'https://images.unsplash.com/photo-1532558622994-3d9e35467618?w=400', style: ['adventure', 'relax'], budget: 'mid' },
            { name: 'Rome', img: 'https://images.unsplash.com/photo-1552832230-c0197dd311b5?w=400', style: ['culture', 'food'], budget: 'mid' },
            { name: 'Thailand', img: 'https://images.unsplash.com/photo-1528181304800-259b08848526?w=400', style: ['food', 'relax', 'budget'], budget: 'budget' },
            { name: 'New Zealand', img: 'https://images.unsplash.com/photo-1507699434052-d378a34aef47?w=400', style: ['adventure'], budget: 'luxury' },
            { name: 'Peru', img: 'https://images.unsplash.com/photo-1526392060635-9d6019884377?w=400', style: ['adventure', 'culture'], budget: 'budget' },
            { name: 'Paris', img: 'https://images.unsplash.com/photo-1502602898657-3e91760c0336?w=400', style: ['culture', 'food'], budget: 'luxury' },
            { name: 'Vietnam', img: 'https://images.unsplash.com/photo-1528127269322-539801943592?w=400', style: ['food', 'culture', 'budget'], budget: 'budget' },
        ];

        const resultsContainer = document.getElementById('results');
        const filters = { style: [], budget: [] };

        function renderDestinations() {
            resultsContainer.innerHTML = '';
            destinations.forEach(dest => {
                const card = document.createElement('div');
                card.className = 'dest-card';
                card.innerHTML = `
                    <img src="${dest.img}" alt="${dest.name}" loading="lazy">
                    <div class="dest-card-content">
                        <h3>${dest.name}</h3>
                        <p>Style: ${dest.style.join(', ')} | Budget: ${dest.budget}</p>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
            applyFilters();
        }

        function applyFilters() {
            document.querySelectorAll('.dest-card').forEach((card, i) => {
                const dest = destinations[i];
                const styleMatch = filters.style.length === 0 || filters.style.some(s => dest.style.includes(s));
                const budgetMatch = filters.budget.length === 0 || filters.budget.includes(dest.budget);

                if (styleMatch && budgetMatch) {
                    card.classList.add('visible');
                } else {
                    card.classList.remove('visible');
                }
            });
        }

        document.querySelectorAll('.chips').forEach(chipGroup => {
            chipGroup.addEventListener('click', e => {
                if (!e.target.classList.contains('chip')) return;
                
                const chip = e.target;
                const filterType = chipGroup.dataset.filter;
                const value = chip.dataset.value;

                chip.classList.toggle('active');

                const filterArray = filters[filterType];
                if (filterArray.includes(value)) {
                    filters[filterType] = filterArray.filter(v => v !== value);
                } else {
                    filterArray.push(value);
                }
                applyFilters();
            });
        });

        renderDestinations();
    </script>
</body>
</html>
